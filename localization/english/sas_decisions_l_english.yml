l_english:
 # Expand Spy Network
 sas_expand_spy_network_decision: "Expand Spy Network"
 sas_expand_spy_network_decision_desc: "The only two ways for a spider to expand its web are to spend more time weaving, or get more spiders involved. While our [sas_spy_network|E] has had a modest but successful inception, we may yet expand our reach ever further, entangling rulers far and wide and leveraging their closest held secrets to our advantage."
 sas_expand_spy_network_decision_tooltip: "Grow your [sas_spy_network|E] in number and ability"
 sas_expand_spy_network_decision_confirm: "The spider web grows!"
 sas_expand_spy_network_double_spies.tt: "You may employ double the number of [sas_spies|E]"
 sas_expand_spy_network_child_spies.tt: "You may employ children at least 8 years old as [sas_spies|E]"
 sas_expand_spy_network_innovation_spies.tt: "Your [sas_spies|E] may steal civic or military [innovations|E] from their courts of residence if you are a [culture_head|E]#weak (25 year cooldown)#!"
 sas_expand_spy_network_have_enough_spies_tt: "You employ at least 3 [sas_spies|E]"
 sas_expand_spy_network_have_paid_spies_tt: "You have bought at least 3 [secrets|E] from [sas_spies|E]"

 # Establish Criminal Underground
 sas_establish_criminal_underground_decision: "Establish Criminal Underground"
 sas_establish_criminal_underground_decision_desc: "Keeping all your cards on the table is certainly one way to rule, but when it comes to international diplomacy, it's certainly easier to keep an ace or two hidden up your sleeve. Why dangle limply from the strings of decorum and propriety when you could be the puppet master?"
 sas_establish_criminal_underground_decision_tooltip: "Encourage the employment of assorted scoundrels and [sas_spies|E] in your court"
 sas_establish_criminal_underground_decision_confirm: "Let us dance in the darkness!"
 sas_establish_criminal_underground_spy_network.tt: "Unlocks the ability to employ [sas_spies|E] in a [sas_spy_network|E]"
 sas_establish_criminal_underground_rabble_rouser.tt: "Unlocks the [rabble_rouser_court_position|E] court position"
 sas_establish_criminal_underground_femme_fatale.tt: "Unlocks the [femme_fatale_court_position|E] court position"
 sas_establish_criminal_underground_smuggler.tt: "Unlocks the [smuggler_court_position|E] court position"
 sas_establish_criminal_underground_master_assassin.tt: "Unlocks the [master_assassin_court_position|E] court position"
 ALREADY_ESTABLISHED_CRIMINAL_UNDERGROUND: "House [CHARACTER.GetHouse.GetName|U] has established a criminal underground"
 NOT_ALREADY_ESTABLISHED_CRIMINAL_UNDERGROUND: "House [CHARACTER.GetHouse.GetName|U] has not established a criminal underground"

 # Special Operations Training
 sas_special_operations_training_decision: "Special Operations Training"
 sas_special_operations_training_decision_desc: "Adapation is key to surviving in the shadows. By focusing on sharing knowledge across the underground our agents can develop a mastery of their craft, becoming more self sufficient in finding what we can only assume to be their own highly scrupulous income streams while growing our web of influence."
 sas_special_operations_training_decision_tooltip: "Train criminals and [sas_spies|E] to be more confident participating in [hostile_schemes|E]"
 sas_special_operations_training_decision_confirm: "More knives in the dark!"
 sas_special_operations_completed_hostile_schemes_tt: "You have completed at least 3 [hostile_schemes|E]"
 sas_special_operations_have_enough_spies_tt: "You employ at least 3 [sas_spies|E]"
 sas_special_operations_training_spies_intrigue_no_salary: "[intrigue|E] based [court_positions|E] cost no salary"
 sas_special_operations_training_spies_likely_to_join_schemes.tt: "Your [sas_spies|E] are more likely to join your [hostile_schemes|E] as [agents|E]"
 sas_special_operations_training_rabble_rouser_likely_to_join_schemes.tt: "Your [rabble_rouser_court_position|E] is more likely to join your [hostile_schemes|E] as an [agent|E]"
 sas_special_operations_training_femme_fatale_likely_to_join_schemes.tt: "Your [femme_fatale_court_position|E] is more likely to join your [hostile_schemes|E] as an [agent|E]"
 sas_special_operations_training_smuggler_likely_to_join_schemes.tt: "Your [smuggler_court_position|E] is more likely to join your [hostile_schemes|E] as an [agent|E]"
 sas_special_operations_training_master_assassin_likely_to_join_schemes.tt: "Your [master_assassin_court_position|E] is more likely to join your [hostile_schemes|E] as an [agent|E]"

 # House of Sabotage and Subterfuge
 sas_house_of_sabotage_and_subterfuge_decision: "A House of Sabotage and Subterfuge"
 sas_house_of_sabotage_and_subterfuge_decision_desc: "Your house has firmly established itself as a paragon of sabotage and subterfuge, working in the darkness of back alleys and midnight balconies to further its own ambitions. A long legacy of beguiling and webweaving lies before you, should you be willing to take the plunge."
 sas_house_of_sabotage_and_subterfuge_decision_tooltip: "Cement your house's legacy of sabotage and subterfuge"
 sas_house_of_sabotage_and_subterfuge_decision_confirm: "We are one with the shadows!"
 sas_house_of_sabotage_and_subterfuge_schemes_tt: "You have completed at least 8 [hostile_schemes|E]"
 sas_house_of_sabotage_and_subterfuge_enough_spies_tt: "You employ at least 8 [sas_spies|E]"
 sas_house_of_sabotage_and_subterfuge_schemes_give_renown: "Gain @dynasty_prestige_icon!#P 100#! [dynasty_prestige|E] any time you complete a [hostile_schemes|E]"
 sas_house_of_sabotage_and_subterfuge_spies_better_discovery: "Increase the chances of your [sas_spies|E] discovering secrets and innovations"

 #################### 
 # Recruit Malefactor
 ####################
 sas_recruit_malefactor_decision: "Recruit Malefactor"
 sas_recruit_malefactor_decision_desc: "A well-functioning criminal underground requires the work of many hands. I shall dispatch my servants far and wide to find suitable candidates for our more important vacancies."
 sas_recruit_malefactor_decision_tooltip: "Search for a character to fill a [court_position|E] pertinent to the criminal underground for a fee\n\n#weak For example, you may hire a [GetCourtPositionType('rabble_rouser_court_position').GetName]#!"
 SAS_CHOOSE_CHARACTER_ROLE_DECISION_NEXT_STEP_BUTTON: "Choose Position Type"
 sas_recruit_malefactor_decision_confirm: "Confirm"
 sas_recruit_court_position_decision_tt: "You will receive two suitable candidates from which to choose for the selected [court_position|E]"

