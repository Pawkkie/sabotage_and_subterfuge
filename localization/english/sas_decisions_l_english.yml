 recruit_rabble_rouser_cooldown_tt: "Recruiting a [GetCourtPositionType('rabble_rouser_court_position').GetName] is on cooldown for [GetGameTimeDifferenceForDiffDays( THIS.VarRemaining( 'recruit_rabble_rouser_cooldown' ))]"

