 hire_rabble_rouser_desc: "A [rabble_rouser_court_position|E] is key to stirring up trouble in other realms, or keeping the populace content in our own. I will ask my servants to bring forth a number of suitable candidates."
#  hire_rabble_rouser_decision_effect_tooltip: "You will be presented with a group of [GetCourtPositionType('rabble_rouser_court_position').GetName()] candidates and may hire one of them for a fee and a monthly salary"
