l_english:
 artifact_black_book_name: "Black Book"
 artifact_black_book_desc: "#medium Your [heir|E] will inherit your known [secrets|E] if equipped, as long as your house is a House of Sabotage and Subterfuge.#!\n\nNot so much a book as a dagger wrapped in leather, this small ledger of sins and whispers might have the power to ask a favor, blackmail a vassal, or topple an empire. Probably best not to lose it."