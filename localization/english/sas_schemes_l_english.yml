l_english:
 ###########################
 # Critical Moments
 ###########################

 # Scheme Type A Boilerplate
 sas_scheme_critical_moments.0001.t.task_contract: "Conclude [GetPlayer.Custom('GetContractOrIssue')]"
 sas_scheme_critical_moments.0001.t.scheme: "Execute Scheme"
 sas_scheme_critical_moments.0001.desc: "Spend your accumulated [scheme_opportunity_opportunities|E] to add new [agent|E] slots or attempt completion of your [scheme.GetName] [scheme|E]."
 sas_scheme_critical_moments.0001.a: "#WEAK (@scheme_opportunity_icon![scheme.MakeScope.ScriptValue('scheme_charge_to_advance_threshold_value')])#! Seize the Moment"
 sas_scheme_critical_moments.0001.a.tt.stymied.insufficient_opportunities: "You need at least [scheme_opportunity_i][scheme.MakeScope.ScriptValue('scheme_charge_to_advance_threshold_value')] [scheme_opportunity_opportunities|E]"
 sas_scheme_critical_moments.0001.a.tt.stymied.insufficient_success_chance: "You need at least 1% [success_chance|E]"
 sas_scheme_critical_moments.0001.a.tt.progress: "You finalize your [scheme.GetName] against [scheme.GetTargetCharacter.GetShortUIName] #WEAK ([scheme.GetSuccessChance|%/0] [success_chance|E])#!"
 sas_scheme_critical_moments.0001.a.tt.murders_may_be_intercepted.repeatable: "#WEAK #WEAK [target.GetTitledFirstNamePossessive] [court_positions|E] & other defenses give [target.GetHerHim] a [scheme.MakeScope.Var('target_intercept_repeatable_chance').GetValue]% chance to intercept a successful murder#!#!"
 sas_scheme_critical_moments.0001.a.tt.murders_may_be_intercepted.repeatable_and_unique: "#WEAK Random chance and special effects may also, rarely, thwart the attempt#!"
 sas_scheme_critical_moments.0001.a.tt.murders_may_be_intercepted.unique: "#WEAK Random chance and special effects may, rarely, thwart the attempt#!"
 sas_scheme_critical_moments.0001.b: "[scheme.Custom('GetCorrectAgentType_ChoiceA_Icon')] Add [scheme.Custom('GetCorrectAgentType_ChoiceA')] agent slot."
 sas_scheme_critical_moments.0001.b.fallback: "Add random agent slot."
 sas_scheme_critical_moments.0001.c: "[scheme.Custom('GetCorrectAgentType_ChoiceB_Icon')] Add [scheme.Custom('GetCorrectAgentType_ChoiceB')] agent slot."
 sas_scheme_critical_moments.0001.c.fallback: "Add random agent slot."
 sas_scheme_critical_moments.0001.d: "@unpredictable_icon! Bah, these agents won't do."
 sas_scheme_critical_moments.0001.d.tt: "These potential [agent|E] slots will be discarded"
 sas_scheme_critical_moments.0001.e: "@icon_contract_modification_single! Risk an event"
 sas_scheme_critical_moments.0001.e.receive_event: "You receive a random [scheme.GetName]-related event, which may be #P helpful#! or #N harmful#!"
 sas_scheme_critical_moments.0001.e.debug.warning: "#D These events have not been vetted, so risk:reward balance is likely poor.#!"
 sas_scheme_critical_moments.0001.f: "@scheme_success_icon! Add success chance modifier"
 sas_scheme_critical_moments.0001.g: "@scheme_success_max_icon! Add max success chance modifier"
 sas_scheme_critical_moments.0001.h: "@time_icon! More planning is needed..."
 sas_scheme_critical_moments.0001.h.tt.some_opportunities: "You exit without spending any [scheme_opportunity_i] [scheme_opportunity_opportunities|E]"
 sas_scheme_critical_moments.0001.h.tt.zero_opportunities: "You should return after you have an [scheme_opportunity_i] [scheme_opportunity_opportunity|E]"
 sas_scheme_critical_moments.0001.option.need_opportunities: "You need at least [scheme_opportunity_i]1 [scheme_opportunity_opportunity|E]"
 sas_scheme_critical_moments.0001.option.max_slots: "This [scheme|E] has reached its maximum [agent|E] slots"
 sas_scheme_critical_moments.0001.option.opportunities_better_spent_on_agents: "#mixed_value @alert_icon! [scheme_opportunity_opportunities|E] are generally better spent on [agent|E] slots#!"

 # Scheme Type B Boilerplate
 sas_scheme_critical_moments.0002.t: "$sas_scheme_critical_moments.0001.t$"
 sas_scheme_critical_moments.0002.desc: "Spend your accumulated [scheme_opportunity_opportunities|E] to attempt completion of your [scheme.GetName] [scheme|E]. Spend more for powerful final bonuses."
 sas_scheme_critical_moments.0002.a: "#BOL @scheme_opportunity_icon![scheme.MakeScope.ScriptValue('multi_ending_scheme_charge_to_advance_threshold_t1_value')]#!: Seize the Moment"
 sas_scheme_critical_moments.0002.a.tt.stymied.insufficient_opportunities: "You need at least [scheme_opportunity_i][scheme.MakeScope.ScriptValue('multi_ending_scheme_charge_to_advance_threshold_t1_value')] [scheme_opportunity_opportunities|E]"
 sas_scheme_critical_moments.0002.b: "#BOL @scheme_opportunity_icon![scheme.MakeScope.ScriptValue('multi_ending_scheme_charge_to_advance_threshold_t2_value')]#!: $scheme_end_buff_t2_modifier$"
 sas_scheme_critical_moments.0002.b.tt.stymied.insufficient_opportunities: "You need at least [scheme_opportunity_i][scheme.MakeScope.ScriptValue('multi_ending_scheme_charge_to_advance_threshold_t2_value')] [scheme_opportunity_opportunities|E]"
 sas_scheme_critical_moments.0002.b.tt.clarify_buff: "[scheme|E] gains [EmptyScope.ScriptValue('multi_ending_scheme_buff_t2_value')|=P/0%] to its final [success_chance|E]\n#WEAK $EFFECT_LIST_BULLET$ Total [success_chance|E] can never exceed a maximum of [scheme.MakeScope.ScriptValue('scheme_max_theoretical_success_chance_value')|/0%]#!"
 sas_scheme_critical_moments.0002.b.tt.progress: "You finalize your [scheme.GetName] against [scheme.GetTargetCharacter.GetShortUIName]\n$BULLET_WITH_TAB$#WEAK ([scheme.MakeScope.ScriptValue('multi_ending_scheme_buff_t2_total_success_value')|P/0%] [success_chance|E], including this option's modifiers)#!"
 sas_scheme_critical_moments.0002.c: "#BOL @scheme_opportunity_icon![scheme.MakeScope.ScriptValue('multi_ending_scheme_charge_to_advance_threshold_t3_value')]#!: $scheme_end_buff_t3_modifier$"
 sas_scheme_critical_moments.0002.c.tt.stymied.insufficient_opportunities: "You need at least [scheme_opportunity_i][scheme.MakeScope.ScriptValue('multi_ending_scheme_charge_to_advance_threshold_t3_value')] [scheme_opportunity_opportunities|E]"
 sas_scheme_critical_moments.0002.c.tt.clarify_buff: "[scheme|E] gains [EmptyScope.ScriptValue('multi_ending_scheme_buff_t3_value')|=P/0%] to its final [success_chance|E]\n#WEAK $EFFECT_LIST_BULLET$ Total [success_chance|E] can never exceed a maximum of [scheme.MakeScope.ScriptValue('scheme_max_theoretical_success_chance_value')|/0%]#!"
 sas_scheme_critical_moments.0002.c.tt.progress: "You finalize your [scheme.GetName] against [scheme.GetTargetCharacter.GetShortUIName]\n$BULLET_WITH_TAB$#WEAK ([scheme.MakeScope.ScriptValue('multi_ending_scheme_buff_t3_total_success_value')|P/0%] [success_chance|E], including this option's modifiers)#!"
 sas_scheme_critical_moments.0002.d: "#BOL @scheme_opportunity_icon![scheme.MakeScope.ScriptValue('multi_ending_scheme_charge_to_advance_threshold_t4_value')]#!: $scheme_end_buff_t4_modifier$"
 sas_scheme_critical_moments.0002.d.tt.stymied.insufficient_opportunities: "You need at least [scheme_opportunity_i][scheme.MakeScope.ScriptValue('multi_ending_scheme_charge_to_advance_threshold_t4_value')] [scheme_opportunity_opportunities|E]"
 sas_scheme_critical_moments.0002.d.tt.clarify_buff: "[scheme|E] gains [EmptyScope.ScriptValue('multi_ending_scheme_buff_t4_value')|=P/0%] to its final [success_chance|E]\n#WEAK $EFFECT_LIST_BULLET$ Total [success_chance|E] can never exceed a maximum of [scheme.MakeScope.ScriptValue('scheme_max_theoretical_success_chance_value')|/0%]#!"
 sas_scheme_critical_moments.0002.d.tt.progress: "You finalize your [scheme.GetName] against [scheme.GetTargetCharacter.GetShortUIName]\n$BULLET_WITH_TAB$#WEAK ([scheme.MakeScope.ScriptValue('multi_ending_scheme_buff_t4_total_success_value')|P/0%] [success_chance|E], including this option's modifiers)#!"
 sas_scheme_critical_moments.0002.e: "$sas_scheme_critical_moments.0001.h$"
 sas_scheme_critical_moments.0002.e.tt.some_opportunities: "$sas_scheme_critical_moments.0001.h.tt.some_opportunities$"
 sas_scheme_critical_moments.0002.e.tt.zero_opportunities: "$sas_scheme_critical_moments.0001.h.tt.zero_opportunities$"
 sas_scheme_end_buff_t2_modifier: "Execute with Confidence"
 sas_scheme_end_buff_t2_modifier_desc: "Surety is its own brand of success."
 sas_scheme_end_buff_t3_modifier: "Leverage Advantages"
 sas_scheme_end_buff_t3_modifier_desc: "There's no such thing as a sure thing, so press every possibility."
 sas_scheme_end_buff_t4_modifier: "Cover Every Angle"
 sas_scheme_end_buff_t4_modifier_desc: "Winners gamble, strategists know."

 # Reminders
 sas_scheme_critical_moments.0011.t.boilerplate: "Limits of Opportunity"
 sas_scheme_critical_moments.0011.t.task_contract: "$sas_scheme_critical_moments.0001.t.task_contract$: $sas_scheme_critical_moments.0011.t.boilerplate$"
 sas_scheme_critical_moments.0011.t.scheme: "$sas_scheme_critical_moments.0001.t.scheme$: $sas_scheme_critical_moments.0011.t.boilerplate$"
 sas_scheme_critical_moments.0011.desc.intro: "My scheme to [scheme.GetName]"
 sas_scheme_critical_moments.0011.desc.middle.character: "[scheme.GetTargetCharacter.GetTitledFirstName]"
 sas_scheme_critical_moments.0011.desc.middle.title: "[scheme.GetTargetTitle.GetDefinitiveName]"
 sas_scheme_critical_moments.0011.desc.outro: "has progressed well — perhaps #EMP too#! well.\n\nThere are many avenues I could develop it down, should I so choose, but further #EMP opportunities#! are unlikely to present themselves till I've taken advantage of some of those I have."
 sas_scheme_critical_moments.0011.immediate.tt: "Your [scheme.GetName] [scheme|E] has the maximum [GetDefine('NScheme','SCHEME_MAX_OPPORTUNITIES')|0] [scheme_opportunities|E]"
 sas_scheme_critical_moments.0011.a: "I'll act when I see fit and not before!"
 sas_scheme_critical_moments.0011.a.tt: "@warning_icon! #X You will no longer receive alerts when this [scheme|E] has the maximum number of [scheme_opportunity_opportunities|E]#!"
 sas_scheme_critical_moments.0011.b: "It's useful to stay abreast of such things."
 sas_scheme_critical_moments.0011.b.tt: "If this [scheme|E] hits the maximum number of [scheme_opportunity_opportunities|E] again a year from now, you'll be notified again"
 sas_scheme_critical_moments.0011.c: "I shall execute it immediately."
