l_english:
 poison_opinion: "Poison Opinion"
 poison_opinion_action: "Poison Opinion"
 poison_opinion_desc: "I will attempt to poison [SCHEME.GetTargetCharacter.GetShortUINameNoTooltip]'s opinion of their liege, causing disorder in their courts."
 poison_opinion_desc_general: "Poison Opinion is a [personal_scheme|E] that attempts to reduce the target's opinion of their direct [liege|E]. This scheme primarily relies on your own [intrigue|E] and the abilities of your [femme_fatale_court_position|E]. As it is not a [hostile_scheme|E], it is not [secret_scheme_single|E] and does not use [agents|E].\n\nUnlike most schemes but like the Sway [personal_scheme|E], Poison Opinion restarts upon completion. The opinion lost from it stacks, so keeping it active will make the [scheme_target|E] like their liege less and less.\n\nSuccessful targets of this scheme with negative opinions of their liege will be more likely to join factions created through the [provoke_vassals|E] [hostile_scheme|E]."
 POISON_OPINION_SUCCESS_DESC: "[TARGET_CHARACTER.GetShortUINamePossessive] [opinion|E] of their [liege|E] will decrease by #P [CHARACTER.MakeScope.ScriptValue('poison_opinion_opinion_decrease_per_success')|V0]#!"
 I_AM_BLOCKED_FROM_POISONING_OPINION_OF_THIS_CHARACTER: "You cannot poison the opinion [TARGET_CHARACTER.GetShortUIName] while [TARGET_CHARACTER.GetSheHe] is irritated at me"
 poison_opinion_success_message: "[target.GetShortUINameNoTooltip]'s opinion has been poisoned"
 poison_opinion_failed_message: "[target.GetShortUINameNoTooltip]'s opinion has not been poisoned"

