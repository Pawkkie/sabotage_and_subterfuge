l_english:
 INTRIGUE_WINDOW_MY_SPIES_TITLE: "[sas_spies|E] In Your [sas_spy_network|E]" 
 INTRIGUE_WINDOW_SPIES_MAX_COUNT: "#T Number of [sas_spies|E]#!\nMax calculated as one fifth of the combined [intrigue|E] of you and your [spymaster|E], rounded down. Doubled by the Expand Spy Network decision."
 INTRIGUE_WINDOW_DISMISS: "Dismiss"
 INTRIGUE_WINDOW_DISMISS_BUTTON_TT: "#T Dismiss#!\n\nDismiss [Character.GetTitledFirstName] from your [sas_spy_network|E]"
 INTRIGUE_WINDOW_STOP_SURVEILING: "Stop Surveillance"
 INTRIGUE_WINDOW_STOP_SURVEILING_BUTTON_TT: "#T Stop Surveillance#!\n\nStop your [sas_spy_network|E] from focusing their [sas_surveillance|E] efforts on [Character.GetTitledFirstName]"
 SPY_ABBREVIATED_RELATIONS_TOOLTIP: "[Character.GetRelationToString( GetPlayer )]"
 INTRIGUE_WINDOW_SURVEIL_TARGET: "[sas_surveillance|E] Target"
 INTRIGUE_WINDOW_QUARTERLY_SUCCESS_CHANCE: "Quarterly Success Chance: "
 INTRIGUE_WINDOW_QUARTERLY_SUCCESS_CHANCE_TOOLTIP: "#T Quarterly Success Chance#!\nSeveral factors affect success chance.\n\nAdding to your chances are your total [sas_spy|E] count, half your [intrigue|E], your [spymaster|E]'s [intrigue|E] if using $task_find_secrets$ in the target's court, and the [intrigue|E] value of every [sas_spy|E] you have in the target's court. Your [femme_fatale_court_position|E] can also increase your chances, as will completing your House of Sabotage and Subterfuge.\n\nSubtracting from your changes are half your target's [intrigue|E], your target's [spymaster|E]'s [intrigue|E] if using $task_disrupt_schemes$ as long as they aren't also in your [sas_spy_network|E], and your target's total [sas_spy|E] count in their own court.\n\n[GetTrait('trusting').GetName( GetNullCharacter )] targets are also more vulnerable, and [GetTrait('paranoid').GetName( GetNullCharacter )] targets are less so."

 game_concept_sas_surveil_target_desc: "You can designate a character as a surveillance target to have your [sas_spy_network|E] focus their efforts entirely on learning that individual's secrets. Your [sas_spies|E] will not learn secrets from their normal regions, nor will they discover any innovations.\n\nInstead, you will have a quarterly success chance of discovering a secret the target holds, or confirming that the target does not have any secrets at all. This chance is affected by the [intrigue|E] of you, your target, your [spymaster|E], and your target's [spymaster|E], the number of [sas_spies|E] in your [sas_spy_network], the [intrigue|E] of any [sas_spies|E] you have in their court, the number of [sas_spies|E] your target has in their court, using your [spymaster|E]'s $task_find_secrets$, and your target using their [spymaster|E]'s $task_disrupt_schemes$.\n\nNote that you must have a [sas_spy|E] in the target's court in order to mark them for surveillance, and if at any time while surveilling them you do not, your success chance will go to zero."