l_english:
 # Roused Rabble
 roused_rabble_faction: "Roused Rabble Faction"
 roused_rabble_faction_desc: "The Roused Rabble [faction|E], formed of peasants emboldened by the words of a fiery revolutionary, have decided it's high time to bring their complaints to their liege directly on the field of battle."
 roused_rabble_faction_short_effect_desc: "Wants to disrupt their liege's operations"
 roused_rabble_faction_every_county: "Every [faction|E] [county|E]"
 roused_rabble_faction_spawn_county_levies: "Raises a [new_title.GetAdjective] [army|E] proportional to its [levies|E]"
 FACTION_DEMAND_ROUSED_RABBLE: "To the [ROOT.Char.Custom('InsultAdjective')] [ROOT.Char.GetTitledFirstName]"
 FACTION_DEMAND_ROUSED_RABBLE_DESC: "We have been burdened with your oppressive laws for far too long. No more! We are done paying you taxes.\n\nOnce your coffers dry up and your larders are empty, you will wish you had treated us more fairly."
 FACTION_DEMAND_ROUSED_RABBLE_ACCEPT: "I guess I could grant a tax lien..."
 FACTION_DEMAND_ROUSED_RABBLE_REFUSE: "Never! A peasant's lot is to serve their lord!"
 FACTION_ROUSED_RABBLE_NAME: "Roused Rabble"
 FACTION_ROUSED_RABBLE_TITLE_NAME: "Roused Rabble Revolt"
 FACTION_REASON_RABBLE_ROUSED: "Target of a [rouse_rabble_scheme|E]: $VALUE|0+=$"

 # Roused Rabble Funding Option
 sas_faction_demand.1003.t: "Roused Rabble Ready to Rock..."
 sas_faction_demand.1003.desc: "Word has reached me that the rabble we roused some time ago have nearly their preparations and will be ready to take their fight to the capital in four months' time.\n\nI have faith in them to get some damage done and potentially incite some real change, but I'm sure there's time to tip the scales in their favour..."
 sas_faction_demand.1003.a: "They have my unwavering support!"
 sas_faction_demand.1003.b: "We could use some addition leverage."
 sas_faction_demand.1003.c: "I suppose we can spare a few gold..."
 sas_faction_demand.1003.d: "They'll be fine on their own."

 # Roused Rabble Pre-War Check In
 sas_faction_demand.1004.t: "And Now It's Time to Roll!"
 sas_faction_demand.1004.desc: "Finally, I've been brought word that the faction of rabble we emboldened to rebellion are prepared to charge into battle.\n\nI've heard good things about [peasant_leader.GetShortUIName] through the grapevine, hopefully [peasant_leader.GetSheHe] can lead them to victory!"
 sas_faction_demand.1004.a: "And perhaps we can take advantage of the situation..."

 # War Ended in Victory
 sas_faction_demand.1005.t: "The Rabble Is Victorious"
 sas_faction_demand.1005.desc: "The rabble we supported have won in their revolution to improve their standard of life! This should significantly hamper their liege's further development of the realm, and cut them all some well deserved slack."
 sas_faction_demand.1005.a: "I could have scare hoped for a better outcome"

 # War Ended in White Peace
 sas_faction_demand.1006.t: "The Rabble Is Breaks Even"
 sas_faction_demand.1006.desc: "The rabble we supported have drawn a white peace in their revolution to improve their standard of life! Perhaps this has destabilized the region to some degree, relationships may take some time to recover."
 sas_faction_demand.1006.a: "Not too quickly, I hope"

 # War Ended in Defeat
 sas_faction_demand.1007.t: "The Rabble Is Defeated"
 sas_faction_demand.1007.desc: "The rabble we supported have lost in their revolution to improve their standard of life. This outcome is unfortunate, but not entirely unexpected. Hopefully we've gotten all that we needed to out of this ordeal."
 sas_faction_demand.1007.a: "Time to move on to other matters"

 # Roused Rabble War
 ROUSED_RABBLE_WAR_NAME:0 "Roused Rabble Uprising"
 roused_rabble_faction_event_troops:0 "Roused Rabble Uprising"
 roused_rabble_war_victory_desc:0 "All rebellious [counties|E] lose [SCOPE.ScriptValue('peasant_war_victory_county_control_loss')|N0] [control|E]."
 roused_rabble_war_white_peace_desc:0 "The roused rabble is disbanded."
 roused_rabble_war_defeat_desc:0 "The roused rabble is disbanded and [attacker.GetShortUIName] is imprisoned. All rebelling [counties|E] have their [county_opinion|E] forcibly increased."


 # Provoked Independence
 provoked_independence_faction: "Provoked Independence"
 provoked_independence_faction_desc: "Members of the Independence [faction|E] seek independence from their [liege|E].\n\n#S Ultimatum#!\nAll Faction Members become [independent|E]\n[liege|E] loses [prestige|E]"
 FACTION_REASON_PROVOKED_INDEPENDENCE_MODIFIER: "Provoked into Independence Faction: $VALUE|0+=$"

 # Provoked Dissolution
 provoked_dissolution_faction: "Provoked Dissolution"
 provoked_dissolution_faction_desc: "Members of the $nation_fracturing_faction$ [faction|E] seek to destroy the realm of their [liege|E].\n\n#S Ultimatum#!\nAll Faction Members become [independent|E]\n[liege|E] loses their [primary_title|E] and other [titles|E] of the same [title_tier|E]"
 FACTION_REASON_PROVOKED_DISSOLUTION_MODIFIER: "Provoked into Dissolution Faction: $VALUE|0+=$"
 