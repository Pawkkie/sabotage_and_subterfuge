l_english:
 # Court Position
 smuggler_court_position: "Smuggler"
 smuggler_court_position_desc: "If you need goods moved from one point to another, the smuggler can get you connected. While not strictly required, dubious goods are their specialty. The smuggler allows for heist planning and artifact thievery, as well as bolstering your own transportation networks."
 smuggler_custom_effect_description_scheme: "$BULLET$Can allow access to the [GetScheme('smuggle_artifact').GetTypeName] [hostile_scheme|E]" 
 smuggler_custom_effect_description_demand_payment: "$BULLET$Unlocks the [demand_payment|E] Interaction"

 # Traits
 # court_position_wayfarer_trait: "[GetTrait('lifestyle_wayfarer').GetName( ROOT.Char )]"

 # Rouse Rabble task
 smuggler_task_plan_heist: "Plan Heist"
 smuggler_task_plan_heist_desc: "Plan the heist of a specific artifact, letting you and your crew work towards smuggling it out of their courtroom and into yours."
 allow_steal_artifact_scheme_tt: "Can use the [plan_heist_interaction|E] interaction to enable the [smuggle_artifact_scheme|E] against a target. This task must be active to both start and continue the scheme.\n[GetScheme('smuggle_artifact').GetTypeName] [scheme|E] [success_chance|E]:\n@scheme_success_icon!#P +0%#! to @scheme_success_icon!#P +20%#! (based on [aptitude|E])"

