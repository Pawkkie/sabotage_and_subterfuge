 cki_scheme_critical_moments.0002.a.tt.progress: "You finalize your [scheme.GetName] against [scheme.GetTargetCharacter.GetShortUIName]\n$BULLET_WITH_TAB$#WEAK ([scheme.MakeScope.ScriptValue('multi_ending_scheme_buff_t2_total_success_value')|P/0%] [success_chance|E], including this option's modifiers)#!"
