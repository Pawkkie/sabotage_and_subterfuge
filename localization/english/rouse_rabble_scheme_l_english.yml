 # Scheme info
 rouse_rabble: "Rouse Rabble"
 rouse_rabble_desc: "Turn the peasants of a realm against its rulers"
 rouse_rabble_desc_general: "$rouse_rabble$ is a [hostile_scheme|E] that attempts to embolden the peasants in the target's realm to revolt against their liege. It requires the employ of a [rabble_rouser_court_position|E] [court_position|E] to be undertaken, and you and your target must both be in charge of realms of at least [duchy|E] tier.\n\nIf at any point the [rabble_rouser_court_position|E] is unemployed or switches tasks, the scheme will be cancelled."
 # or otherwise unavailable, such as by traveling, being imprisoned, or leading an army
 rouse_rabble_action: "Rouse the Rabble of"

 ROUSE_RABBLE_SUCCESS_DESC: "The rabble having been roused, inciting a peasant revolt"
 ROUSE_RABBLE_DISCOVERY_DESC: "You can continue rousing the rabble in [TARGET_CHARACTER.GetShortUINamePossessiveNoTooltip] realm."

 max_rouse_rabble_schemes_add: "$BULLET$Max [GetScheme('rouse_rabble').GetTypeName] [schemes|E]"

