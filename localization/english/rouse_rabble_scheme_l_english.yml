## Scheme Critical Moments
# Scheme Execute Event
 cki_scheme_critical_moments.0002.t: "Execute Scheme"
 cki_scheme_critical_moments.0002.t.scheme: "Execute Scheme"
 cki_scheme_critical_moments.0002.desc: "Spend your accumulated [scheme_opportunity_opportunities|E] to attempt completion of your [scheme.GetName] [scheme|E]. Spend more for powerful final bonuses."
 cki_scheme_critical_moments.0002.a: "#BOL @scheme_opportunity_icon![scheme.MakeScope.ScriptValue('multi_ending_scheme_charge_to_advance_threshold_t1_value')]#!: Seize the Moment"
 cki_scheme_critical_moments.0002.a.tt.stymied.insufficient_opportunities: "You need at least [scheme_opportunity_i][scheme.MakeScope.ScriptValue('multi_ending_scheme_charge_to_advance_threshold_t1_value')] [scheme_opportunity_opportunities|E]"
