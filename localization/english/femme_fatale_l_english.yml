 # Embrace the Spiders task
 femme_fatale_task_embrace_the_spiders: "Embrace the Spiders"
 femme_fatale_task_embrace_the_spiders_desc: "Provoke the vassals of another court, leading to lowering opinion and potentially a full uprising."

 # Soothe and Surveil task
 femme_fatale_task_soothe_and_surveil: "Soothe and Surveil"
