l_english:
 # Court Position
 femme_fatale_court_position: "Femme Fatale"
 femme_fatale_court_position_desc: "A master of working courtiers around her fingers, the Femme Fatale specializes in directing courts in a way that serves her best from the shadows. She can sour the opinion of a liege in the eyes of their vassal, increase the effectiveness of your [sas_spies|E], and ease proceedings in your own court."
 femme_fatale_custom_effect_description_poison_opinion: "$BULLET$Can allow access to the [GetScheme('poison_opinion').GetTypeName] [personal_scheme|E]" 
 femme_fatale_custom_effect_description_fabricate_claim: "$BULLET$Chance of [GetScheme('fabricate_hook').GetTypeName] manufacturing a [strong_hook|E]:\n@unspent_strong_hook_icon!#P +10%#! to @unspent_strong_hook_icon!#P +50%#! (based on [aptitude|E])" 

 # Traits
 court_position_lustful_trait: "[GetTrait('lustful').GetName( ROOT.Char )]"
 court_position_vengeful_trait: "[GetTrait('vengeful').GetName( ROOT.Char )]"
 court_position_beauty_good_1_trait: "[GetTrait('beauty_good_1').GetName( ROOT.Char )]"
 court_position_beauty_good_2_trait: "[GetTrait('beauty_good_2').GetName( ROOT.Char )]"
 court_position_beauty_good_3_trait: "[GetTrait('beauty_good_3').GetName( ROOT.Char )]"
 court_position_adulterer_trait: "[GetTrait('adulterer').GetName( ROOT.Char )]"

 # Eligibility
 femme_fatale_not_lowborn: "They are #bold not#! [lowborn|E]"
 femme_falate_not_married: "They are #bold not#! [married|E]"

 # Poison Opinion task
 femme_fatale_task_poison_opinion: "Poison Opinion"
 femme_fatale_task_poison_opinion_desc: "Poison the target's opinion of their [liege|E], leading to chaos and disorder in their court."
 allow_poisoning_opinion_scheme_tt: "Can use the [poison_opinion_scheme|E]. This task must be active to both start and continue the scheme.\n[GetScheme('poison_opinion').GetTypeName] [scheme|E] [success_chance|E]:\n@scheme_success_icon!#P +0%#! to @scheme_success_icon!#P +20%#! (based on [aptitude|E])"
 max_poison_opinion_schemes_add: "Max [GetScheme('poison_opinion').GetTypeName] [schemes|E]"

 # Embrace the Spiders task
 femme_fatale_task_embrace_the_spiders: "Embrace the Spiders"
 femme_fatale_task_embrace_the_spiders_desc: "Weave the webs of the [sas_spy_network|E] ever farther afield, learning foreign secrets more effectively than ever."
 femme_fatale_increase_spy_discovery_chance_tt: "Increase the chances of your [sas_spies|E] discovering secrets and innovations"

 # Soothe and Surveil task
 femme_fatale_task_soothe_and_surveil: "Soothe and Surveil"
 femme_fatale_task_soothe_and_surveil_desc: "Ease any rising tensions in your court, while keeping a close eye for any signs of sabotage."
 increased_poison_opinion_defense_tt: "Enemy [GetScheme('poison_opinion').GetTypeName] [scheme|E] [success_chance|E]:\n@scheme_success_icon!#P -0%#! to @scheme_success_icon!#P -20%#! (based on [aptitude|E])"
