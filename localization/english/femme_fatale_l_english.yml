 femme_fatale_court_position: "Femme Fatale"
 femme_fatale_court_position_desc: "Keen to stir the pot, the Rabble Rouser has a knack for getting in with the right crowd and firing them up. They can travel to other realms and incite peasant revolts or vassal uprisings, or stay at home and spread the good word of your excellence."
