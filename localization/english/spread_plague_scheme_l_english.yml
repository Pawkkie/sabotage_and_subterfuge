 spread_plague_invalidated_not_spreading_plague: "[CHARACTER.GetShortUIName|U] is no longer performing the Spread Plague task."
 spread_plague_invalidated_dead: "[target.GetShortUIName] has passed away. You can no longer spread plague to [target.GetHerHim]."

