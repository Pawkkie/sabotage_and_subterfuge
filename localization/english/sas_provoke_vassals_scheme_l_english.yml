l_english:
 # Scheme modifiers
 PROVOKE_VASSALS_AMBITIOUS: "[GetTrait('ambitious').GetName( GetPlayer )]: $VALUE|=+0$" 

 # Scheme info
 provoke_vassals: "Provoke Vassals"
 provoke_vassals_desc: "Turn the vassals of a realm against their liege"
 provoke_vassals_desc_general: "$provoke_vassals$ is a [hostile_scheme|E] that attempts to embolden the vassals in the target's realm to revolt against their liege. It requires the employ of a [rabble_rouser_court_position|E] [court_position|E] to be undertaken, and you and your target must both be in charge of realms of at least [duchy|E] tier.\n\nIf at any point the [rabble_rouser_court_position|E] is unemployed or switches tasks, the scheme will be cancelled."
 # or otherwise unavailable, such as by traveling, being imprisoned, or leading an army
 provoke_vassals_action: "Provoke the Vassals of"

 PROVOKE_VASSALS_SUCCESS_DESC: "The vassals have been provoked, inciting an insurrection"
 PROVOKE_VASSALS_DISCOVERY_DESC: "You can continue provoking the vassals in [TARGET_CHARACTER.GetShortUINamePossessiveNoTooltip] realm."

 max_provoke_vassals_schemes_add: "Max [GetScheme('provoke_vassals').GetTypeName] [schemes|E]"

## Character Interaction Scheme Agent Packages
 provoke_vassals_interaction.tt.agent_focus_balance: "$schemes.tt.agent_packages.list_boilerplate$\n$EFFECT_LIST_BULLET$[success_chance_max_i] [GetAgentSlotType( 'agent_rabble_rouser' ).GetName]\n$EFFECT_LIST_BULLET$[success_chance_max_i] [GetAgentSlotType( 'agent_diplomat' ).GetName]\n$EFFECT_LIST_BULLET$[scheme_speed_i] [GetAgentSlotType( 'agent_gabbler' ).GetName]\n$EFFECT_LIST_BULLET$[scheme_speed_i] [GetAgentSlotType( 'agent_herald' ).GetName]\n$EFFECT_LIST_BULLET$[secrecy_i] [GetAgentSlotType( 'agent_justiciar' ).GetName]"
 provoke_vassals_interaction.tt.agent_focus_success: "$schemes.tt.agent_packages.list_boilerplate$\n$EFFECT_LIST_BULLET$[success_chance_max_i] [GetAgentSlotType( 'agent_rabble_rouser' ).GetName]\n$EFFECT_LIST_BULLET$[success_chance_max_i] [GetAgentSlotType( 'agent_rabble_rouser' ).GetName]\n$EFFECT_LIST_BULLET$[success_chance_max_i] [GetAgentSlotType( 'agent_diplomat' ).GetName]\n$EFFECT_LIST_BULLET$[scheme_speed_i] [GetAgentSlotType( 'agent_gabbler' ).GetName]\n$EFFECT_LIST_BULLET$[secrecy_i] [GetAgentSlotType( 'agent_justiciar' ).GetName]"
 provoke_vassals_interaction.tt.agent_focus_speed: "$schemes.tt.agent_packages.list_boilerplate$\n$EFFECT_LIST_BULLET$[scheme_speed_i] [GetAgentSlotType( 'agent_gabbler' ).GetName]\n$EFFECT_LIST_BULLET$[scheme_speed_i] [GetAgentSlotType( 'agent_gabbler' ).GetName]\n$EFFECT_LIST_BULLET$[scheme_speed_i] [GetAgentSlotType( 'agent_herald' ).GetName]\n$EFFECT_LIST_BULLET$[success_chance_max_i] [GetAgentSlotType( 'agent_rabble_rouser' ).GetName]\n$EFFECT_LIST_BULLET$[secrecy_i] [GetAgentSlotType( 'agent_justiciar' ).GetName]"
 provoke_vassals_interaction.tt.agent_focus_secrecy: "$schemes.tt.agent_packages.list_boilerplate$\n$EFFECT_LIST_BULLET$[secrecy_i] [GetAgentSlotType( 'agent_justiciar' ).GetName]\n$EFFECT_LIST_BULLET$[secrecy_i] [GetAgentSlotType( 'agent_justiciar' ).GetName]\n$EFFECT_LIST_BULLET$[secrecy_i] [GetAgentSlotType( 'agent_amanuensis' ).GetName]\n$EFFECT_LIST_BULLET$[success_chance_max_i] [GetAgentSlotType( 'agent_rabble_rouser' ).GetName]\n$EFFECT_LIST_BULLET$[scheme_speed_i] [GetAgentSlotType( 'agent_gabbler' ).GetName]"

