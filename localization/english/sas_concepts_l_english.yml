 game_concept_sas_spy: "Spy"
 game_concept_sas_spies: "Spies"
 game_concept_sas_spy_desc: "Spies are agents that that can be based in any court and report back to their employer when the find secrets. Their employer may learn any of these secrets by paying a small fee.\n\nThe collective group of agents working for one employer is called a [sas_spy_network|E]."
 game_concept_sas_spy_network: "Spy Network"
 game_concept_sas_spy_network_desc: "A collection of [sas_spies|E] all working for the same employer. This network can be grown by using the Recruit Spy interaction on eligible characters directly, or by using the Check for Spies interaction on a particular ruler to investigate their court for opportunities.\n\nSpies in other courts are naturally recruited by a [spymaster|E] using the Find Secrets council task, and can be discovered in your court using the Disrupt Schemes council task.\n\nThe efficacy of a [sas_spy_network|E] can be enhanced by making certain decisions, with effects such as increasing the maximum number of spies, making courtiers more likely to be willing to offer their services, or allowing spies to discover [innovations|E]."
 game_concept_sas_ennoblement_interaction: "$sas_ennoblement_interaction$"
 game_concept_sas_ennobled_interaction: "Ennobled"
 game_concept_sas_ennoblement_interaction_desc: "$sas_ennoblement_interaction_concept_desc$"
 game_concept_sas_embezzle_interaction: "$sas_embezzle_interaction$"
 game_concept_sas_embezzle_interaction_desc: "$sas_embezzle_interaction_desc$"
 game_concept_sas_induct_bastard_interaction: "$sas_induct_bastard_interaction$"
 game_concept_sas_induct_bastard_interaction_desc: "$sas_induct_bastard_interaction_concept_desc$"
 game_concept_sas_steal_bastard_interaction: "$sas_steal_bastard_interaction$"
 game_concept_sas_steal_bastard_interaction_desc: "$sas_steal_bastard_interaction_concept_desc$"
 game_concept_sas_nation_fracturing_faction: "Dissolution Faction"
 game_concept_sas_nation_fracturing_factions: "Dissolution Factions"
 game_concept_sas_nation_fracturing_faction_desc: "Members of the $game_concept_sas_nation_fracturing_faction$ seek to destroy the realm of their liege. If successful they will all become [independent|E], and their [liege|E] will lose their [primary_title|E] and other [titles|E] of the same [title_tier|E]."
 game_concept_sas_surveil_target: "Surveil Target"
 game_concept_sas_surveillance_target: "Surveillance Target"
 game_concept_sas_surveillance: "Surveillance"
 game_concept_sas_surveil: "Surveil"
 game_concept_sas_surveil_target_desc: "You can designate a character as a surveillance target to have your [sas_spy_network|E] focus their efforts entirely on learning that individual's secrets. Your [sas_spies|E] will not learn secrets from their normal regions, nor will they discover any innovations.\n\nInstead, you will have a quarterly success chance of discovering a secret the target holds, or confirming that the target does not have any secrets at all. This chance is affected by the [intrigue|E] of you, your target, your [spymaster|E], and your target's [spymaster|E], the number of [sas_spies|E] in your [sas_spy_network], the [intrigue|E] of any [sas_spies|E] you have in their court, the number of [sas_spies|E] your target has in their court, using your [spymaster|E]'s $task_find_secrets$, and your target using their [spymaster|E]'s $task_disrupt_schemes$.\n\nNote that you must have a [sas_spy|E] in the target's court in order to mark them for surveillance, and if at any time while surveilling them you do not, your success chance will go to zero."