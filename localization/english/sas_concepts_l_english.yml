l_english:
 game_concept_sas_spy: "Spy"
 game_concept_sas_spies: "Spies"
 game_concept_sas_spy_desc: "Spies are agents that that can be based in any court and report back to their employer when the find secrets. Their employer may learn any of these secrets by paying a small fee.\n\nThe collective group of agents working for one employer is called a [sas_spy_network|E]."
 game_concept_sas_spy_network: "Spy Network"
 game_concept_sas_spy_network_desc: "A collection of [sas_spies|E] all working for the same employer. This network can be grown by using the Recruit Spy interaction on eligible characters directly, or by using the Check for Spies interaction on a particular ruler to investigate their court for opportunities.\n\nSpies in other courts are naturally recruited by a [spymaster|E] using the Find Secrets council task, and can be discovered in your court using the Disrupt Schemes council task.\n\nThe efficacy of a [sas_spy_network|E] can be enhanced by making certain decisions, with effects such as increasing the maximum number of spies, making courtiers more likely to be willing to offer their services, or allowing spies to discover [innovations|E]."