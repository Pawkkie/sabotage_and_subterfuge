l_english:
 # Find Rabble Rouser
 sas_recruit_malefactor.1001.t: "[GetCourtPositionType('rabble_rouser_court_position').GetNameNoTooltip()]"
 sas_recruit_malefactor.1001.desc: "As per my request, my servants have assembled two options for me to consider for the role of [rabble_rouser_court_position|E]. [good_rabble_rouser.GetName] is already a proven leader, but [mediocre_rabble_rouser.GetName] is a budding activist. "
 sas_recruit_malefactor.1001.a: "[mediocre_rabble_rouser.GetNameNoTooltip] should be a fine choice."
 sas_recruit_malefactor.1001.b: "[good_rabble_rouser.GetNameNoTooltip] is already making me feel fired up!"
 sas_recruit_malefactor.1001.c: "None of these choices are adequate."
 sas_recruit_malefactor.1001.a.aptitude: "[mediocre_rabble_rouser.GetFirstNamePossessiveNoTooltip] [aptitude|E] is [mediocre_rabble_rouser.GetCourtPositionAptitude( GetCourtPositionType( 'rabble_rouser_court_position' ) )]"
 sas_recruit_malefactor.1001.b.aptitude: "[good_rabble_rouser.GetFirstNamePossessiveNoTooltip] [aptitude|E] is [good_rabble_rouser.GetCourtPositionAptitude( GetCourtPositionType( 'rabble_rouser_court_position' ) )]"

 rabble_rouser_aptitude_tooltip: "[candidate.GetHerHisMy|U] [aptitude|E] is [candidate.GetCourtPositionAptitude( GetCourtPositionType( 'rabble_rouser_court_position' ) )]"
 rabble_rouser_old_holder_aptitude_tooltip: "[candidate.GetHerHisMy|U] [aptitude|E] is [candidate.GetCourtPositionAptitude( GetCourtPositionType( 'rabble_rouser_court_position' ) )] #weak ([old_holder.GetFirstName] [old_holder.GetCourtPositionAptitude( GetCourtPositionType( 'rabble_rouser_court_position' ) )])#!"
 rabble_rouser_salary_tooltip: "[GetCourtPositionType( 'rabble_rouser_court_position' ).GetName()] has a monthly salary of [gold_i][SCOPE.ScriptValue('medium_court_position_salary')|2]"

