l_english:
 # Invited to a feast
 rouse_rabble_ongoing.0001.t: "Invited to a Feast"
 rouse_rabble_ongoing.0001.desc: "An elder heading a large peasant family on the rural outskirts of [target_title.GetNameNoTier] has invited [rouser_name.GetShortUIName] to a feast celebrating a local holiday. When [rouser_name.GetShortUIName] made it clear they were gracious for the offer and would write to their employer to inform them of a late return, the invitation was further extended, unknowlingly, to me.\n\nThese peasants have no idea I am at all involved in this and my presence might serve as a shock to them... but also a strong showing of support for their cause, especially if we sit down over a meal as equals."
 rouse_rabble_ongoing.0001.a: "I'll join the festivities"
 rouse_rabble_ongoing.0001.b: "I'll send a gift"
 rouse_rabble_ongoing.0001.c: "I shouldn't get involved"

 # The liege sends relief
 rouse_rabble_ongoing.0002.t: "The Liege Sends Relief"
 rouse_rabble_ongoing.0002.desc: "[rouser_name.GetShortUIName] has informed me that a fire recently spread through some rural [target_title.GetNameNoTier] settlements, torching a granary and nearby buildings. This has seriously stressed the peasants' food supply.\n\n[target.GetShortUIName] has ordered relief sent to the affected area in the form of food and building supplies. Offering our support would foster good will but stabilize the masses... Perhaps we instead hire some mercenaries to intercept and destroy the delivery on route?\n\nMaybe that's a step too far..."
 rouse_rabble_ongoing.0002.a: "Intercept the delivery"
 rouse_rabble_ongoing.0002.b: "Endorse the delivery"
 rouse_rabble_ongoing.0002.c: "Just see what happens"

 # Connecting with the youth
 rouse_rabble_ongoing.0003.t: "Connecting with the Youth"
 rouse_rabble_ongoing.0003.desc: "It seems that [rouser_name.GetShortUIName] has been asked to help put on a fair for the local peasant youth! There's an entire afteroon's worth of time to fill with some kind of activity.\n\nThe youth of today are the revolutionaries of tomorrow. I wonder if this is an apportunity to sow the seeds that might most benefit us?"
 rouse_rabble_ongoing.0003.a: "Plan a mock battle"
 rouse_rabble_ongoing.0003.b: "Hold a hunting tournament"
 rouse_rabble_ongoing.0003.c: "Run a workshop on cultural exchange"

 # Staging a protest
 rouse_rabble_ongoing.0004.t: "Staging a Protest"
 rouse_rabble_ongoing.0004.desc: "I read a novel recently in which the characters, wealthy nobles, disguised themselves in dress and demeanor to blend in with the peasantry.\n\nIt occured to me that we could do this in [target_title.GetNameNoTier], and send in some members of our court to stage a peaceful protest, potentially turning it violent as it builds."
 rouse_rabble_ongoing.0004.a: "Let's rock the boat"
 rouse_rabble_ongoing.0004.b: "Maybe this is better left to fiction"

 # A rowdy tavern
 rouse_rabble_ongoing.0005.t: "A Rowdy Tavern"
 rouse_rabble_ongoing.0005.desc: "I travelled in secret to a tavern in the area of [target_title.GetNameNoTier] where [rouser_name.GetShortUIName] is working to get an update from [rouser_name.GetHerHim]. The tavern was packed and raucous, bubbling over like a witch's cauldron\n\nA voice shouts out over the cacophony, a soldier of the realm too deep in his cups, talking down to the peasantry. Rumblings of discontent ripple through the group, though none are willing to approach him."
 rouse_rabble_ongoing.0005.a: "Get up and knock his lights out"
 rouse_rabble_ongoing.0005.b: "Add fuel to the murmers of discontent"
 rouse_rabble_ongoing.0005.c: "Help the solider home"
 rouse_rabble_ongoing.0005.d: "Sip your drink and observe"

 # An interesting missive
 rouse_rabble_ongoing.0006.t: "An Interesting Missive"
 rouse_rabble_ongoing.0006.desc: "I've received a letter from, unbelievably, [target.GetShortUIName]. The tone is flattering and cordial, a ruler checking in with [target.GetHerHis] contemporaries.\n\nThe interesting part is the ending. It seems [target.GetSheHe] is dealing with some unrest from the peasantry, and is asking my opinion as to the best way forward. It's clear I'm not under suspicion, but this may yet present an opportunity."
 rouse_rabble_ongoing.0006.a: "Crush them"
 rouse_rabble_ongoing.0006.b: "Cut them some slack"

 # A Costly Suggestion
 rouse_rabble_ongoing.0007.t: "A Costly Suggestion"
 rouse_rabble_ongoing.0007.desc: "An agent recently suggested to me that it might be prudent to try to lead the peasant rebellion by example. By this they mean, use our realm as a shining beacon of what the peasants of the world should aspire to achieve for themselves. [rouser_name.GetShortUIName] can then use our good grace as concrete evidence that change is possible.\n\nThis does not come without a cost, as we must obviously change how we interact with the masses ourselves. Is it worth it just for this?"
 rouse_rabble_ongoing.0007.a: "Reduce their taxes"
 rouse_rabble_ongoing.0007.b: "Reduce their levies"
 rouse_rabble_ongoing.0007.c: "Give them some time off"
 rouse_rabble_ongoing.0007.d: "Heavens no!"

 # Who's the rouser
 rouse_rabble_ongoing.0008.t: "Who's the Rabble Rouser Here?!"
 rouse_rabble_ongoing.0008.desc: "Blasphemous! Malarky! What an apocalypitcally stupid idea! Where on earth does this suggestion even come from, I can't understand what they're thinking at all!\n\nI guess [rouser_name.GetShortUIName] is the professional here, but really? REALLY?! Does that kind of pedigree really provide them such a unique perspective as to see the merit of ideas like this?\n\nI can't understand it, but we still need to decide on a course of action."
 rouse_rabble_ongoing.0008.a: "They know what they're doing"
 rouse_rabble_ongoing.0008.b: "I'm overruling this nonsense"
 rouse_rabble_ongoing.0008.c: "I'm sure we can find a compromise"
