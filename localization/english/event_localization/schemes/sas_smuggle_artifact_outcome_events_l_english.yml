l_english:
 smuggle_artifact_outcome.1001.t: "$smuggle_artifact_event_title$ Success!"
 smuggle_artifact_outcome.1001.desc: "I feel a great rush of pride, and can't help but grin as I'm presented with the artifact I've sought to claim. The [artifact.GetName] has a new owner!\n\nThough it's perhaps slightly scuffed and dirty from the travails of liberation, I still can't help tracing my fingers over the luxurious surface of this stolen item... the [artifact.GetName], a fine prize!"
 smuggle_artifact_outcome.1001.a: "It is welcome in its new home!"

 smuggle_artifact_outcome.1002.t: "$smuggle_artifact_event_title$ Stolen Artifact!"
 smuggle_artifact_outcome.1002.desc: "Today, I took a fancy to admire my [artifact_to_steal.GetName]... but to my horror, I found it gone! #EMP Gone!#!\n\nAfter some feverish investigation, a servant comes forward saying that [owner.GetName] orchestrated the brazen theft! Indeed, it's said [owner.GetSheHe] often waxed on about how much better the [artifact_to_steal.GetName] would look in [owner.GetHerHis] possession..."
 smuggle_artifact_outcome.1002.a: "Curse that despicable thief!"

 smuggle_artifact_outcome.2001.t: "$smuggle_artifact_event_title$ Failure"
 smuggle_artifact_outcome.2001: "My cunningly-plotted infiltration went as planned, but the [artifact.GetName] could not be found!\n\nWas it moved? Hidden? Either dumb luck saved my mark... or my incompetent lackeys were cleverly outmaneuvered. Panicked by this utter failure, they will aid me no further. My prize remains with its owner..."
 smuggle_artifact_outcome.2001.a: "I can't believe this! #EMP Unacceptable!#!"

