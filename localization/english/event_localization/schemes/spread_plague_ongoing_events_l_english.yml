l_english:
 # Disease Selection
 spread_plague_ongoing.0001.t: "Pick Your Poison"
 spread_plague_ongoing.0001.desc: "With the decision made to attempt to start a [epidemic|E] in [target.GetUINamePossessive] realms, all that remains is to choose our method of attack.\n\n[master_assassin_name.GetUIName] tells me that we have access to the discarded bedding and clothes of an unfortunate soul who suffered a localized case of smallpox which might do the trick.\n\nWe can also take the more direct means of soiling a local water supply, or instead perhaps taint their larders with some toxic fungus [master_assassin_name.GetShortUIName] has in their possession."
 spread_plague_ongoing.0001.a: "Use the contaminated bedding"
 spread_plague_ongoing.0001.b: "Soil the water supply"
 spread_plague_ongoing.0001.c: "Taint their larders"

 spread_plague_ongoing.0001.smallpox.tt: "Attempt to spread Smallpox in the region"
 spread_plague_ongoing.0001.bloody_flux.tt: "Attempt to spread Bloody Flux in the region"
 spread_plague_ongoing.0001.holy_fire.tt: "Attempt to spread Holy Fire in the region"

 # Smallpox
 spread_plague_ongoing.0002.t: "Warm Embrace of Death"
 spread_plague_ongoing.0002.desc: "[master_assassin_name.GetUIName] has found a merchant in [target_title.GetNameNoTier] interested in making an acquisition of basic clothing, bedding, and other fabrics.\n\nThis is the perfect opportunity to get more contaminants into the region quickly, but handling them any more than necessary is dangerous and there's a possibility the source of plague gets traced back to us."
 spread_plague_ongoing.0002.a: "Mix the contaminated articles into the shipment"
 spread_plague_ongoing.0002.b: "This might draw too much suspicion"

 # Bloody Flux
 spread_plague_ongoing.0003.t: "Water You Waiting For"
 spread_plague_ongoing.0003.desc: "[master_assassin_name.GetUIName] has traced a water source in [target_title.GetNameNoTier] upriver, and found an ideal place for us to dump contaminants.\n\nWe should largely be safe from detection, it's just a question or whether the water will flow the way we want it to.\n\nAlternatively we could try a more direct approach, and dump them right at a town's main access point under cover of darkness. Much riskier though."
 spread_plague_ongoing.0003.a: "Dump them upstream"
 spread_plague_ongoing.0003.b: "Dump them in town"

 # Holy Fire
 spread_plague_ongoing.0004.t: "A Fungus Among Us"
 spread_plague_ongoing.0004.desc: "[master_assassin_name.GetUIName] has procured a specific kind of fungus whose spores can lead to horrible symptoms if ingested. If we can get this into some backwater larder in [target_title.GetNameNoTier], the spread from there should take care of itself.\n\nAccessing food stores is not easy, though, and it might be easier to instead try to propogate the fungus in the fields directly. This is lower risk, but also probably less likely to succeed."
 spread_plague_ongoing.0004.a: "Sneak into a larder"
 spread_plague_ongoing.0004.b: "Taint the fields"