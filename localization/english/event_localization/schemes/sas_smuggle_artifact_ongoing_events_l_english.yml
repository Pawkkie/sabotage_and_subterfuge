l_english:
 smuggle_artifact_event_title: "Smuggle Artifact:"
 smuggle_artifact_ongoing.1001.t: "$smuggle_artifact_event_title$ The Antiquarian"
 smuggle_artifact_ongoing.1001.desc: "One of the obvious hurdles to retrieving the artifact, is [target.GetTitledFirstNamePossessive] antiquarian, [antiquarian.GetTitledFirstName].\n\nThere are, of course, multiple ways to... #EMP deal#! with a person, but I wonder if [antiquarian.GetFirstNameNoTooltip] is the type of person whom I could persuade to look the other way by offering a suitable bribe."
 smuggle_artifact_ongoing.1001.a: "Gold is the universal language of bribery."
 smuggle_artifact_ongoing.1001.a.tt: "You believe [antiquarian.GetTitledFirstNamePossessive] loyalty can be bought with riches..."
 smuggle_artifact_ongoing.1001.b: "Perhaps an artifact for an artifact?"
 smuggle_artifact_ongoing.1001.b.tt: "[antiquarian.GetTitledFirstName] will agree to an even "trade.""
 smuggle_artifact_ongoing.1001.c: "An introduction to [random_beauty.GetTitledFirstName] might prove... #EMP stimulating#!."
 smuggle_artifact_ongoing.1001.c.tt: "You're hedging your bets on [antiquarian.GetTitledFirstName] appreciating physical beauty above loyalties."
 smuggle_artifact_ongoing.1001.d: "I'll look into other possibilities instead."

 smuggle_artifact_ongoing_notification.1001.success: "[antiquarian.GetTitledFirstName] Accepts the Bribe"
 smuggle_artifact_ongoing_notification.1001.failure: "[antiquarian.GetTitledFirstName] Refuses the Bribe"
