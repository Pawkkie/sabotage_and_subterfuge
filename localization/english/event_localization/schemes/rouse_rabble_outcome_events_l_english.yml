 rouse_rabble_outcome.0005.t: "Rousing the Soul"
 rouse_rabble_outcome.0005.desc: "Who'd have thought that cheering and motivating the public could be so invigorating? There's food, there's drink, there's cheer... the common man looking out for one another, rallying against a sense of oppression.\n\nI may have started this plan with other motivations, but the plight of the people has become my own!"
