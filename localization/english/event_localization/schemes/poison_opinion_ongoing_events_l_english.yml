l_english:
 poison_opinion_ongoing.1001.t: "Poison Opinion: [target.GetLiege.GetCulture.GetNameNoTooltip] Culture"
 poison_opinion_ongoing.1001.desc: "A commoner of [target.GetCulture.GetNameNoTooltip] heritage has been accosted in the streets of [capital.GetNameNoTooltip] over some minor offense.\n\nBy blaming a radical sect of [target.GetLiege.GetCulture.GetNameNoTooltip] upstarts for the trouble, I could perhaps convince [target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)], as [target.GetCulture.GetNameNoTooltip] as the victims, that perhaps their liege is more disagreeable than they might expect."
 poison_opinion_ongoing.1001.a: "The [target.GetLiege.GetCulture.GetCollectiveNounNoTooltip] are directly responsible."
 poison_opinion_ongoing.1001.b: "This is just an unfortunate accident."

 poison_opinion_ongoing.1002.t: "Poison Opinion: Spilling the Tea"
 poison_opinion_ongoing.1002.desc: "I've been invited to afternoon tea with [target_spouse.GetName], [target.GetNamePossessive] spouse.\n\nThe occasion is a pleasant and gossip-laden affair, and it doesn't take long for [target_spouse.GetShortUIName] to let slip some juicy comments about [target.GetLiege.GetName]. Surely this can be leveraged to my advantage..."
 poison_opinion_ongoing.1002.a: "Do go on..."
 poison_opinion_ongoing.1002.b: "I heard [target.GetLiege.GetSheHe] once did something horrible..."
