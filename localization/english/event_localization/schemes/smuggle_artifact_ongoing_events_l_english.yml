l_english:
 smuggle_artifact_event_title:1 "Steal Artifact:"
 smuggle_artifact_ongoing.1001.t:0 "$smuggle_artifact_event_title$ The Antiquarian"
 smuggle_artifact_ongoing.1001.desc:0 "One of the obvious hurdles to retrieving the artifact, is [target.GetTitledFirstNamePossessive] antiquarian, [antiquarian.GetTitledFirstName].\n\nThere are, of course, multiple ways to... #EMP deal#! with a person, but I wonder if [antiquarian.GetFirstNameNoTooltip] is the type of person whom I could persuade to look the other way by offering a suitable bribe."
 smuggle_artifact_ongoing.1001.a:0 "Gold is the universal language of bribery."
 smuggle_artifact_ongoing.1001.a.tt:0 "You believe [antiquarian.GetTitledFirstNamePossessive] loyalty can be bought with riches..."
 smuggle_artifact_ongoing.1001.b:0 "Perhaps an artifact for an artifact?"
 smuggle_artifact_ongoing.1001.b.tt:0 "[antiquarian.GetTitledFirstName] will agree to an even "trade.""
 smuggle_artifact_ongoing.1001.c:0 "An introduction to [random_beauty.GetTitledFirstName] might prove... #EMP stimulating#!."
 smuggle_artifact_ongoing.1001.c.tt:0 "You're hedging your bets on [antiquarian.GetTitledFirstName] appreciating physical beauty above loyalties."
 smuggle_artifact_ongoing.1001.d:0 "I'll look into other possibilities instead."

 smuggle_artifact_ongoing_notification.1001.success:0 "[antiquarian.GetTitledFirstName] Accepts the Bribe"
 smuggle_artifact_ongoing_notification.1001.failure:0 "[antiquarian.GetTitledFirstName] Refuses the Bribe"
