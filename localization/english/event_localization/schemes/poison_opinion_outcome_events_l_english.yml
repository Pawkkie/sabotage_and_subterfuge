l_english:
 poison_opinion_outcome.1001.t:0 "Sway: An Opportunity"
 poison_opinion_outcome.1001.desc:0 "In my attempts to align [target.GetTitledFirstName] to my interests, I have found an opportunity. I think I could argue that our goals are, in fact, the same. As I dictate my next letter..."
 poison_opinion_outcome.1001.a:0 "...I emphasize those shared interests."
 poison_opinion_outcome.1001.a.success:0 "[target.GetFirstNameNoTooltip] is convinced"
 poison_opinion_outcome.1001.a.failure:0 "[target.GetFirstNameNoTooltip] sees through my efforts"
 poison_opinion_outcome.1001.b:0 "...I try to maintain subtlety."

 poison_opinion_outcome.1002.t:0 "Sway: Religious Convictions"
 poison_opinion_outcome.1002.same_faith:0 "I have gotten an idea in my attempts to align [target.GetTitledFirstName] to my interests.\n\nWith the right arguments, I may be able to convince [target.GetHerHim] that I am acting not merely in my own interest, but in the interest of [ROOT.Char.GetFaith.HighGodNameAlternate] [ROOT.Char.GetFaith.HighGodHerselfHimself]!"
 poison_opinion_outcome.1002.other_faith:0 "I have gotten an idea in my attempts to align [target.GetTitledFirstName] to my interests.\n\nPerhaps I could argue that it is in the interest of all [target.GetFaith.GetAdherentNamePlural] to support me, rather than any other [ROOT.Char.GetFaith.GetAdjective] ruler?"
 poison_opinion_outcome.1002.a:0 "I believe I can make a very convincing argument."
 poison_opinion_outcome.1002.b:0 "Perhaps I should keep to diplomatic niceties."

 poison_opinion_outcome.1003.t:0 "Sway: Pushing Luck"
 poison_opinion_outcome.1003.desc:0 "I finish reading the latest letter from [target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] and smile – [target.GetSheHe] seems to have warmed to me at last.\n\nWhile this is a success I am tempted to use this opportunity to try and get even closer..."
 poison_opinion_outcome.1003.a:0 "Time to put my diplomatic skills to the test!"
 poison_opinion_outcome.1003.a.success:0 "[target.GetSheHe|U] appreciates the effort"
 poison_opinion_outcome.1003.a.failure:0 "[target.GetSheHe|U] is insulted"
 poison_opinion_outcome.1003.a_friend:0 "I will let [friend.GetFirstNameNoTooltip] handle this."
 poison_opinion_outcome.1003.b:0 "This victory is enough."

 poison_opinion_outcome.2001.t:0 "Sway: A Misunderstanding"
 poison_opinion_outcome.2001.opening:0 "It seems that my diplomatic overtures towards [target.GetTitledFirstName] have caused a major misunderstanding! I have received a letter which makes it clear that [target.GetSheHe] thinks I have been pursuing a different goal entirely..."
 poison_opinion_outcome.2001.not_interested_relation:0 "\n\n"I am your [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('target'))], for [target.GetFaith.HighGodNamePossessive] sake!""
 poison_opinion_outcome.2001.not_interested_romantically:0 "\n\n"While I am flattered, I find your interest inappropriate for a [ROOT.Char.GetWomanMan] of your station.""
 poison_opinion_outcome.2001.not_interested_horses:0 "\n\n"I will not be selling my purebred horses, no matter how many letters of flattery you send!""
 poison_opinion_outcome.2001.not_interested_toll_exemptions:0 "\n\n"I cannot grant you toll exemptions, no matter how much trade you promise!""
 poison_opinion_outcome.2001.not_interested_friend:0 "\n\n"It sounds as if what you truly need is a friend, and I am afraid I cannot be that to you. However, I can recommend that you—""
 poison_opinion_outcome.2001.not_interested_relics:0 "\n\n"I will not give you any of my relics, no matter how many times you might pray for me!""
 poison_opinion_outcome.2001.end:0 "\n\nI do not need to read on to get the point."
 poison_opinion_outcome.2001.a:0 "This is all a big misunderstanding!"

 poison_opinion_outcome.2002.t:0 "Sway: Nefarious Plotting"
 poison_opinion_outcome.2002.desc:0 ""My [ROOT.Char.GetLadyLord]! [target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] has ended all conversation with you."\n\nSeeing my sudden interest, and the amount of correspondence, as a sign of nefarious plans it appears as if [target.GetSheHe] is under the impression that I am plotting against [target.GetHerHim]!"
 poison_opinion_outcome.2002.a:0 "I was just trying to make a good impression..."

 poison_opinion_outcome.1004.t: "A Pledge of Loyalty"
 poison_opinion_outcome_magnanimity.1004.desc: ""My [ROOT.Char.GetTitleTierName]", [target.GetName] says, "I can see now that I was wrong to doubt you. Your magnanimity does you credit in these trying times, when we should all bond together for the good of the realm." [target.GetSheHe|U] bows before me, and seems sincere indeed. Perhaps I have truly swayed [target.GetHerHim] to my side."
 poison_opinion_outcome_blessed.1004.desc: ""My [ROOT.Char.GetLadyLord]", [target.GetName] declares, bowing deeply. "It may be that you are indeed blessed by [ROOT.GetCharacter.GetFaith.HighGodName], as some say, or maybe your words just hit their mark out of pure chance, but what matters is that I am moved by our recent interactions. We need to hold the realm together during this turmoil, and I will be here for you.""
 poison_opinion_outcome_grudgingly.1004.desc: ""My [ROOT.Char.GetTitleTierName]", [target.GetName] says grudgingly, "it seems clear to me now, with mutual enemies all around, that we should make an effort to trust each other. Therefore, I bow before you, and profess my loyalty once more."" 
 poison_opinion_outcome_flattery.1004.desc: ""Oh great [ROOT.Char.GetTitleTierName]", [target.GetName] says, bowing. "You in whose shadow I am fortunate to stand, my merciful and glorious liege, how I regret ever doubting you. I distance myself from any unfortunate things, real or imagined, that I am known to have said about you.""
 poison_opinion_outcome_dharmic.1004.desc: ""Oh [ROOT.Char.GetTitleTierName]", [target.GetName] declares solemnly. "Every realm needs a ruler above others, the one who spins the wheel, who can see beyond this fleeting world of flesh and folly. It may be indeed that you are that [ROOT.Char.GetTitleTierName], and therefore, I will forget my doubts and my vanity, and renew my pledge to you.""
 poison_opinion_outcome_caliph.1004.desc: "[target.GetName] meets my gaze for merely a moment, before bowing deeply. "You are the [ROOT.Char.GetTitleTierName], my liege, and the rightful leader of the #italic ummah#!. I have had my doubts, I will not deny it, but I cannot let the cause of the faithful be imperiled. I have not forgotten the pledge I made to you, and will not falter again.""
 poison_opinion_outcome.1004.a: "Very well...but I will be keeping my eyes on you!"
 poison_opinion_outcome.1004.b: "All is forgiven."
