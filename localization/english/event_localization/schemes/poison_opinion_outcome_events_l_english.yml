l_english:
 poison_opinion_outcome.1001.t: "Poison Opinion: An Opportunity"
 poison_opinion_outcome.1001.desc: "In my attempts to position [target.GetTitledFirstNamePossessive] interests against those of [target.GetHerHis] liege, I have found an opportunity. I think I could argue that their goals are, in fact, diametrically opposed. As I dictate my next letter..."
 poison_opinion_outcome.1001.a: "...I emphasize those incompatible interests."
 poison_opinion_outcome.1001.a.success: "[target.GetFirstNameNoTooltip] is convinced"
 poison_opinion_outcome.1001.a.failure: "[target.GetFirstNameNoTooltip] sees through my efforts"
 poison_opinion_outcome.1001.b: "...I try to maintain subtlety."

 poison_opinion_outcome.1002.t: "Poison Opinion: Religious Convictions"
 poison_opinion_outcome.1002.same_faith: "I have gotten an idea in my attempts to align [target.GetTitledFirstName] against [target.GetHerHis] liege's interests.\n\nWith the right arguments, I may be able to convince [target.GetHerHim] that [target.GetSheHe] is acting not merely in [target.GetHerHis] own interest, but in the interest of [ROOT.Char.GetFaith.HighGodNameAlternate] [ROOT.Char.GetFaith.HighGodHerselfHimself]!"
 poison_opinion_outcome.1002.other_faith: "I have gotten an idea in my attempts to align [target.GetTitledFirstName] against [target.GetHerHis] liege's interests.\n\nPerhaps I could argue that it is in the interest of all [target.GetFaith.GetAdherentNamePlural] to break free from the shackles of [target.GetLiege.GetFaith.Name] rule insofar as they are able?"
 poison_opinion_outcome.1002.a: "I believe I can make a very convincing argument."
 poison_opinion_outcome.1002.b: "Perhaps I should keep to diplomatic niceties."

 poison_opinion_outcome.1003.t: "Poison Opinion: Pushing Luck"
 poison_opinion_outcome.1003.desc: "I finish reading the latest letter from [target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] and smile – [target.GetSheHe] seems to have become icy towards [target.GetHerHis] liege at last.\n\nWhile this is a success I am tempted to use this opportunity to try and drive them even further apart..."
 poison_opinion_outcome.1003.a: "Time to put my diplomatic skills to the test!"
 poison_opinion_outcome.1003.a.success: "[target.GetSheHe|U] is further emboldened"
 poison_opinion_outcome.1003.a.failure: "[target.GetSheHe|U] gets the wrong interpretation"
 poison_opinion_outcome.1003.a_friend: "I will let [fatale_name.GetFirstNameNoTooltip] handle this."
 poison_opinion_outcome.1003.b: "This victory is enough."

 poison_opinion_outcome.2001.t: "Poison Opinion: A Misunderstanding"
 poison_opinion_outcome.2001.opening: "It seems that my diplomatic overtures towards [target.GetTitledFirstName] have caused a major misunderstanding! I have received a letter which makes it clear that [target.GetSheHe] thinks I have been pursuing a different goal entirely..."
 poison_opinion_outcome.2001.not_interested_relation: "\n\n"I am your [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('target'))], for [target.GetFaith.HighGodNamePossessive] sake!""
 poison_opinion_outcome.2001.not_interested_romantically: "\n\n"While I am flattered, I find your interest inappropriate for a [ROOT.Char.GetWomanMan] of your station.""
 poison_opinion_outcome.2001.not_interested_horses: "\n\n"I will not be selling my purebred horses, no matter how many letters of flattery you send!""
 poison_opinion_outcome.2001.not_interested_toll_exemptions: "\n\n"I cannot grant you toll exemptions, no matter how much trade you promise!""
 poison_opinion_outcome.2001.not_interested_friend: "\n\n"It sounds as if what you truly need is a friend, and I am afraid I cannot be that to you. However, I can recommend that you—""
 poison_opinion_outcome.2001.not_interested_relics: "\n\n"I will not give you any of my relics, no matter how many times you might pray for me!""
 poison_opinion_outcome.2001.end: "\n\nI do not need to read on to get the point."
 poison_opinion_outcome.2001.a: "This is all a big misunderstanding!"

 poison_opinion_outcome.2002.t: "Poison Opinion: Nefarious Plotting"
 poison_opinion_outcome.2002.desc: ""My [ROOT.Char.GetLadyLord]! [target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] has ended all conversation with you."\n\nSeeing my sudden interest, and the amount of correspondence, as a sign of nefarious plans it appears as if [target.GetSheHe] is under the impression that I am plotting against [target.GetHerHim]!"
 poison_opinion_outcome.2002.a: "I guess in a sense they aren't wrong..."
