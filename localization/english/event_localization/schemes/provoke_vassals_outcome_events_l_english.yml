l_english:

 ## Success and secret
 provoke_vassals_outcome.0001.t: "Whispers from Abroad"
 provoke_vassals_outcome.0001.desc: "A guest recently drifted through my court, a traveler crossing the continent seeking fortune and adventure. I overheard them speaking with my courtiers in hushed tones about the rebellious faction of a vassal from [target.GetCapitalLocation.GetTitle.GetNameNoTier].\n\nIt appears no one can figure out what has emboldened them so suddenly, but an uprising seems unavoidable, and [target.GetShortUIName] is scrambling to get the situation under control. Our efforts worked perfectly!"
 provoke_vassals_outcome.0001.a: "Independence!"
 provoke_vassals_outcome.0001.b: "Dissolution!"

 ## Success and discovered
 provoke_vassals_outcome.0002.t: "Suspicions from Abroad"
 provoke_vassals_outcome.0002.desc: "A guest recently drifted through my court, a traveler crossing the continent seeking fortune and adventure. I overheard them speaking with my courtiers in hushed tones about the rebellious faction of a vassal from [target.GetCapitalLocation.GetTitle.GetNameNoTier].\n\nThey kept stealing glances in my direction, a gaze of biting distaste. It is no mystery what has emboldened them so suddenly, but an uprising seems unavoidable, and [target.GetShortUIName] is furious."
 provoke_vassals_outcome.0002.a: "Independence!"
 provoke_vassals_outcome.0002.b: "Dissolution!"

 ## Unsuccessful and secret
 provoke_vassals_outcome.0003.t: "Unkindled Hearts"
 provoke_vassals_outcome.0003.desc: "A guest recently drifted through my court, a traveler crossing the continent seeking fortune and adventure. I overheard them speaking with my courtiers about the vassals of [target.GetCapitalLocation.GetTitle.GetNameNoTier], and their redoubled patriotism in the face of adversity.\n\nIn spite of our best efforts, they are content with their lot in life."
 provoke_vassals_outcome.0003.a: "At least, for now..."

 ## Unsuccessful and discovered
 provoke_vassals_outcome.0004.t: "Hardened Minds"
 provoke_vassals_outcome.0004.desc: "A guest recently drifted through my court, a traveler crossing the continent seeking fortune and adventure. I overheard them speaking with my courtiers about the vassals of [target.GetCapitalLocation.GetTitle.GetNameNoTier], and their redoubled patriotism in the face of adversity.\n\nThey kept stealing glances in my direction, a gaze of biting distaste. It is no mystery that I attempted to drive them to rebellion, and [target.GetShortUIName] is furious."
 provoke_vassals_outcome.0004.a: "We'll get them eventually!"
