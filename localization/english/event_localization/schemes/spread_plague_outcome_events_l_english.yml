l_english:

 ## Success and secret
 spread_plague_outcome.0001.t: "I Am Become Death"
 spread_plague_outcome.0001.desc: "[master_assassin_name.GetUIName] has just returned after an extended absence. It seems the contaminants [master_assassin_name.GetSheHe] planted have borne fruit. [master_assassin_name.GetSheHe|U] lingered a few days in the region before returning home to see whether the plan had worked, and word of illness spreading rapidly reached [master_assassin_name.GetHerHim] quickly in the local markets.\n\nWho's to say how far the [epidemic|E] may spread from here, but it is clear we have started something that is now out of our hands."
 spread_plague_outcome.0001.a: "Let it leave chaos in its wake!"

 ## Success and discovered
 spread_plague_outcome.0002.t: "Death Comes Announced"
 spread_plague_outcome.0002.desc: "[master_assassin_name.GetUIName] has just returned after an extended absence. It seems the contaminants [master_assassin_name.GetSheHe] planted have borne fruit. [master_assassin_name.GetSheHe|U] lingered a few days in the region before returning home to see whether the plan had worked, and word of illness spreading rapidly reached [master_assassin_name.GetHerHim] quickly in the local markets.\n\nUnfortunately [master_assassin_name.GetSheHe] was stopped on the way out of town, and while [master_assassin_name.GetSheHe] managed to escape, some incriminating evidence conclusively implicating me in the plot was dropped and left behind."
 spread_plague_outcome.0002.a: "At least the plan worked!"

 ## Unsuccessful and secret
 spread_plague_outcome.0003.t: "Hygiene Prevails"
 spread_plague_outcome.0003.desc: "[master_assassin_name.GetUIName] has just returned after an extended absence. It seems the contaminants [master_assassin_name.GetSheHe] planted failed to bear fruit. [master_assassin_name.GetSheHe|U] lingered a few days in the region before returning home to see whether the plan had worked, and not a word of illness reached [master_assassin_name.GetHerHim] in any of the local markets.\n\nPerhaps our contaminants were too weak or applied too conservatively, who's to say."
 spread_plague_outcome.0003.a: "Next time they won't be so lucky..."

 ## Unsuccessful and discovered
 spread_plague_outcome.0004.t: "Gifts Ungiven"
 spread_plague_outcome.0004.desc: "[master_assassin_name.GetUIName] has just returned after an extended absence. It seems the contaminants [master_assassin_name.GetSheHe] planted have borne fruit. [master_assassin_name.GetSheHe|U] lingered a few days in the region before returning home to see whether the plan had worked, and and not a word of illness reached [master_assassin_name.GetHerHim] in any of the local markets.\n\nPerhaps our contaminants were too weak or applied too conservatively, who's to say.\n\nUnfortunately [master_assassin_name.GetSheHe] was stopped on the way out of town, and while [master_assassin_name.GetSheHe] managed to escape, some incriminating evidence conclusively implicating me in the plot was dropped and left behind."
 spread_plague_outcome.0004.a: "Well this is a disaster..."
