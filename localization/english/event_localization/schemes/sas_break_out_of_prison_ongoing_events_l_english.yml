l_english:
 # Scouting the Grounds
 break_out_of_prison_ongoing.0001.t: "Scouting the Grounds"
 break_out_of_prison_ongoing.0001.desc: "A benefit of rescuing prisoners rather than stealing valuables is that rulers don't hide their prisoners, they put them in prisons. And it isn't difficult to figure out where a prison is if you ask the right people. Fortunately, [smuggler.GetShortUIName] knows the right people.\n\nWe can't linger long or the men on duty might be suspicious, but it's worth getting a sense of what we can while we're here, as it may be the only opportunity we have to scout the place out."
 break_out_of_prison_ongoing.0001.a: "Focus on entrances and exits"
 break_out_of_prison_ongoing.0001.b: "Focus on the hiding spots"
 break_out_of_prison_ongoing.0001.c: "Map out a rough layout"

 # The Key Takeaway
 break_out_of_prison_ongoing.0002.t: "The Key Takeaway"
 break_out_of_prison_ongoing.0002.desc: "A necessity for orchestrating a prison break is first breaking into the prison, and to do that we need to find a way in. Discretion is paramount so we can pull this off without giving ourselves away.\n\nThere are a few options available to use; we can get [smuggler.GetShortUIName] to go in on [smuggler.GetHerHis] own to try to make off with the key undetected, we can attempt to bribe the guards into looking the other way, or we can rely entirely on light footed creativity."
 break_out_of_prison_ongoing.0002.a: "Steal the key"
 break_out_of_prison_ongoing.0002.b: "Bribe the guards"
 break_out_of_prison_ongoing.0002.c: "Go with the flow"

 # Getting the Band Together
 break_out_of_prison_ongoing.0003.t: "Getting the Band Together"
 break_out_of_prison_ongoing.0003.desc: "The day of the escape attempt is nearing, and plans are well in place. [smuggler.GetShortUIName] believes we'd benefit from adding one more member to the team, but [smuggler.GetSheHe] has left it up to me to decide what sort of talent we should pursue."
 break_out_of_prison_ongoing.0003.a: "A thieving sort will do"
 break_out_of_prison_ongoing.0003.b: "Perhaps a locksmith, just in case"
 break_out_of_prison_ongoing.0003.c: "Some muscle is always a good backup plan"
