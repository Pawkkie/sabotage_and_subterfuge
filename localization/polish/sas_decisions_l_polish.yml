 # House of Sabotage and Subterfuge
 sas_house_of_sabotage_and_subterfuge_decision: "Dom sabotażu i podstępu" #deepl:346655493
 sas_house_of_sabotage_and_subterfuge_decision_desc: "Twój dom ugruntował swoją pozycję jako wzór sabotażu i podstępu, działając w ciemnościach zaułków i balkonów o północy, aby realizować własne ambicje. Długie dziedzictwo uwodzenia i tkania sieci leży przed tobą, jeśli chcesz zaryzykować." #deepl:3271742632
