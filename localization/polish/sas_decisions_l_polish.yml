 # Special Operations Training
 sas_special_operations_training_decision: "Szkolenie w zakresie operacji specjalnych" #deepl:3167735659
 sas_special_operations_training_decision_desc: "Adaptacja jest kluczem do przetrwania w cieniu. Koncentrując się na dzieleniu się wiedzą w podziemiu, nasi agenci mogą rozwinąć mistrzostwo w swoim rzemiośle, stając się bardziej samowystarczalnymi w znajdowaniu tego, co możemy tylko przypuszczać, że jest ich własnymi, wysoce skrupulatnymi strumieniami dochodów, jednocześnie rozwijając naszą sieć wpływów." #deepl:3538227294
 sas_special_operations_training_decision_tooltip: "Przeszkolenie przestępców i [sas_spies|E], aby byli bardziej pewni siebie uczestnicząc w [hostile_schemes|E]" #deepl:3991151590
