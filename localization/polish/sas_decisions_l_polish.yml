 # Expand Spy Network
 sas_expand_spy_network_decision: "Rozbudowa sieci szpiegowskiej" #deepl:1918218917
 sas_expand_spy_network_decision_desc: "Jedyne dwa sposoby, w jakie pająk może rozszerzyć swoją sieć, to poświęcić więcej czasu na tkanie lub zaangażować więcej pająków. Podczas gdy nasza [sas_spy_network|E] miała skromne, ale udane początki, możemy jeszcze rozszerzyć nasz zasięg, wplątując władców daleko i szeroko i wykorzystując ich najściślej trzymane sekrety na naszą korzyść." #deepl:2680910805
 sas_expand_spy_network_decision_tooltip: "Zwiększ liczbę i możliwości [sas_spy_network|E] " #deepl:1080571400
 sas_expand_spy_network_decision_confirm: "Pajęczyna rośnie!" #deepl:2491328231
 sas_expand_spy_network_double_spies.tt: "Możesz zatrudnić podwójną liczbę [sas_spies|E]" #deepl:3951820473
 sas_expand_spy_network_child_spies.tt: "Możesz zatrudniać dzieci w wieku co najmniej 8 lat jako [sas_spies|E]" #deepl:594091579
 sas_expand_spy_network_innovation_spies.tt: "Twój [sas_spies|E] może ukraść obywatelskie lub wojskowe [innovations|E] z ich sądów zamieszkania, jeśli jesteś [culture_head|E]" #deepl:2188457974
 sas_expand_spy_network_have_enough_spies_tt: "Zatrudniasz co najmniej 3 pracowników [sas_spies|E]" #deepl:769462268
 sas_expand_spy_network_have_paid_spies_tt: "Kupiłeś co najmniej 3 [secrets|E] od [sas_spies|E]" #deepl:4061259209

 # Establish Criminal Underground
 sas_establish_criminal_underground_decision: "Ustanowienie podziemia przestępczego" #deepl:1225823486
 sas_establish_criminal_underground_decision_desc: "Wykładanie wszystkich kart na stół to z pewnością jeden ze sposobów na rządzenie, ale jeśli chodzi o międzynarodową dyplomację, z pewnością łatwiej jest trzymać asa lub dwa ukryte w rękawie. Po co zwisać bezwładnie ze sznurków przyzwoitości i przyzwoitości, kiedy można być mistrzem marionetek?" #deepl:1579221697
