 rabble_rouser_court_position_desc: "Zamiłowany do podburzania, Rabble Rouser ma talent do wchodzenia w odpowiedni tłum i rozpalania go. Może podróżować do innych królestw i wzniecać bunty chłopskie lub powstania wasali, albo pozostać w domu i szerzyć dobrą nowinę o swojej doskonałości." #deepl:3014080276
