 # Rouse Rabble task
 rabble_rouser_task_rouse_rabble: "Rouse Rabble" #deepl:4205226659
 rabble_rouser_task_rouse_rabble_desc: "Podburzyć motłoch na innym dworze, doprowadzając do zamieszek chłopskich i potencjalnie buntu na pełną skalę." #deepl:47285353
 # or otherwise unavailable, such as by traveling, being imprisoned, or leading an army
 allow_rouse_rabble_scheme_tt: "Można użyć [rouse_rabble_scheme|E]. To zadanie musi być aktywne, aby zarówno rozpocząć, jak i kontynuować schemat.\n[GetScheme('rouse_rabble').GetTypeName] [scheme|E] [success_chance|E] :\n@scheme_success_icon! #P  +0%#! do @scheme_success_icon!#P  +20%#! (w oparciu o [aptitude|E])." #deepl:2048036236

