 DRAGON_DESIGNER_EXPORT_VALUES: "#T Kopiuj zawartość zdarzenia#!\n Skopiuje zawartość tekstu zdarzenia do schowka.\n\n Tekst zdarzenia będzie zawierał efekt skryptu, który jest gotowy do umieszczenia w pliku #high import_dragon_dna.txt#!.\n\n@warning_icon! #X Użyj przycisku  Regeneruj zawartość zdarzenia  (przycisk odświeżania na lewo od tego), aby zregenerować tekst zdarzenia i uzyskać najnowsze wartości z konfiguratora.#! #T #! #X #!" #deepl:1364123390
 DRAGON_DESIGNER_IMPORT_VALUES: "#T Import DNA z pliku#!\n Przed użyciem tego przycisku upewnij się, że:\n$BULLET_WITH_TAB$ Ten folder został utworzony: #high %USERPROFILE%/Documents/Paradox Interactive/Crusader Kings III/run#! - utwórz folder, jeśli nie istnieje.\n$BULLET_WITH_TAB$W folderze #high run#! znajduje się plik o nazwie #high import_dragon_dna.txt#!.\n$BULLET_WITH_TAB$ W pliku #high import_dragon_dna.txt#! znajduje się efekt #high import_dragon_dna = {}#!.\n\n@warning_icon! #X Należy pamiętać, że spowoduje to uruchomienie każdego efektu w pliku, upewnij się, że masz w nim tylko to, co chcesz uruchomić#!" #deepl:3791460998

