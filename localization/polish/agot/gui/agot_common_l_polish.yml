 DRAGON_DESIGNER_STORE_DNA_TOOLTIP: "#T Zachowaj DNA smoka#!\n Zachowaj ustawienia DNA znajdujące się obecnie w kreatorze konfiguracji.\n\n@warning_icon! #X Wartości te zostaną utracone w przypadku śmierci postaci#!" #deepl:924222140
