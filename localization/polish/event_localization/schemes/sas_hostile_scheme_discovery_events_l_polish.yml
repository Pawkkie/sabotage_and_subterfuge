 sas_hostile_scheme_discovery.2001.t: "Program na [ROOT.Char.Custom('GetCourt')|U]" #deepl:3607653157
 sas_hostile_scheme_discovery.2001.intro: "Mój [spymaster.GetCouncilTitle] przyszedł do mnie z poważnymi wieściami. Chociaż nie wiemy jeszcze, kto," #deepl:4082077002
 sas_hostile_scheme_discovery.2001.intro_no_spymaster: "Dotarły do mnie poważne wieści. Chociaż nie wiadomo jeszcze, kto," #deepl:3279496608
 sas_hostile_scheme_discovery.2001.fallback: "ktoś spiskuje przeciwko" #deepl:3932481048
 sas_hostile_scheme_discovery.2001.rouse: "ktoś podburza chłopski motłoch należący do królestwa" #deepl:1810264608
 sas_hostile_scheme_discovery.2001.target_other: "Mój [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('target'))], [target.GetTitledFirstName]!" #deepl:3121120145
 sas_hostile_scheme_discovery.2001.target_spymaster: "[target.GetHerHim]\n\n Nie wiedzą, z kim mają do czynienia, z moim . Myślą, że mogą mnie zabić  ? Pokażę im. O tak, pokażę. [ROOT.Char.GetLadyLord] #EMP #!" #deepl:4001813834
 sas_hostile_scheme_discovery.2001.target_me: "ja!" #deepl:4031713392
 sas_hostile_scheme_discovery.2001.a: "Musimy powstrzymać złoczyńcę, który za tym stoi!" #deepl:148308102

 sas_hostile_scheme_discovery.3002.t: "Odkryty program" #deepl:385952488
 sas_hostile_scheme_discovery.3002.desc: "Istnienie mojego spisku na [scheme.GetFullActionName] zostało odkryte!\n\n Chociaż mój udział nie jest jeszcze znany, znacznie utrudni to realizację moich planów." #deepl:3976066101
 sas_hostile_scheme_discovery.3002.a: "Przekleństwa!" #deepl:1623550253

 sas_hostile_scheme_discovery.3003.t: "Odkryte zaangażowanie" #deepl:2924354761
 sas_hostile_scheme_discovery.3003.desc: "[target.Custom2('MyCharacterIntroduction', ROOT.Char)|U] odkrył, że to ja jestem mózgiem spisku" #deepl:1505803270
 sas_hostile_scheme_discovery.3003.rouse: "by podburzyć chłopski motłoch należący do [target.GetHerHim]!" #deepl:2089024288
 sas_hostile_scheme_discovery.3003.provoke: "aby sprowokować [target.GetHerHis] wasali!" #deepl:2832962550
 sas_hostile_scheme_discovery.3003.smuggle: "przemycić artefakt należący do [target.GetHerHim]!" #deepl:2229529354
 sas_hostile_scheme_discovery.3003.plague: "rozprzestrzeniać zarazę w królestwie [target.GetHerHis]!" #deepl:44403764
 sas_hostile_scheme_discovery.3003.fallback: "przeciwko [target.GetHerHim]!" #deepl:1408398656
 sas_hostile_scheme_discovery.3003.a: "To musiało być nieporozumienie!" #deepl:2938075201
