 sas_hostile_scheme_discovery.1002.t: "Schemer odkryty!" #deepl:2806885743
 sas_hostile_scheme_discovery.1002.intro: "Mój [spymaster.GetCouncilTitle] przyszedł do mnie z poważnymi wieściami: to jest [owner.Custom2('MyCharacterIntroduction', ROOT.Char)]" #deepl:116762934
 sas_hostile_scheme_discovery.1002.intro_no_spymaster: "Dotarły do mnie poważne wieści: [owner.Custom2('MyCharacterIntroduction', ROOT.Char)]" #deepl:782412105
