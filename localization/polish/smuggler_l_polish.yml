 # Court Position
 smuggler_court_position: "Przemytnik" #deepl:2327268886
 smuggler_court_position_desc: "Jeśli potrzebujesz przetransportować towary z jednego punktu do drugiego, przemytnik może ci pomóc. Choć nie jest to bezwzględnie wymagane, podejrzane towary to ich specjalność. Przemytnik umożliwia planowanie napadów i kradzieży artefaktów, a także wzmacnianie własnych sieci transportowych." #deepl:760391573
 smuggler_custom_effect_description_scheme: "$BULLET$Może zezwolić na dostęp do strony [GetScheme('smuggle_artifact').GetTypeName] [hostile_scheme|E]" #deepl:732188162
 smuggler_custom_effect_description_demand_payment: "$BULLET$Odblokowuje interakcję [demand_payment|E] " #deepl:1175097164
 smuggler_custom_effect_description_raiding_spoils: "$BULLET$Zwiększa [gold_i][gold|E] zdobywane podczas plądrowania gospodarstwa." #deepl:1646000165

