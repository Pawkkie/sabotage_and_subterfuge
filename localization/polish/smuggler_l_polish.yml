 smuggler_task_plan_heist: "Plan napadu" #deepl:3591742283
 smuggler_task_plan_heist_desc: "Zaplanuj kradzież określonego artefaktu, pozwalając sobie i swojej załodze pracować nad przemyceniem go z ich sali sądowej do twojej." #deepl:3024560060
 allow_steal_artifact_scheme_tt: "Może użyć interakcji [plan_heist_interaction|E], aby włączyć [smuggle_artifact_scheme|E] przeciwko celowi. To zadanie musi być aktywne, aby zarówno rozpocząć, jak i kontynuować schemat.\n[GetScheme('smuggle_artifact').GetTypeName] [scheme|E] [success_chance|E] :\n@scheme_success_icon! #P  +0%#! do @scheme_success_icon!#P  +20%#! (na podstawie [aptitude|E])" #deepl:4121225388

