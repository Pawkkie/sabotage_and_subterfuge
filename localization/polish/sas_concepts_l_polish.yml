 game_concept_sas_spy: "Szpieg" #deepl:287978883
 game_concept_sas_spies: "Szpiedzy" #deepl:396918230
 game_concept_sas_spy_desc: "Szpiedzy to agenci, którzy mogą pracować w dowolnym sądzie i informować swojego pracodawcę o odkrytych tajemnicach. Ich pracodawca może poznać każdy z tych sekretów, uiszczając niewielką opłatę.\n\n Grupa agentów pracujących dla jednego pracodawcy nazywana jest [sas_spy_network|E]." #deepl:821312495
 game_concept_sas_spy_network: "Sieć szpiegowska" #deepl:1689171219
 game_concept_sas_spy_network_desc: "Zbiór [sas_spies|E] pracujących dla tego samego pracodawcy. Sieć ta może być rozwijana za pomocą interakcji Rekrutuj szpiegów bezpośrednio na kwalifikujących się postaciach lub za pomocą interakcji Sprawdź szpiegów na konkretnym władcy, aby zbadać jego dwór pod kątem możliwości.\n\n Szpiedzy na innych dworach są naturalnie rekrutowani przez [spymaster|E] za pomocą zadania rady Znajdź sekrety i mogą zostać odkryci na twoim dworze za pomocą zadania rady Zakłóć schematy.\n\nSkuteczność [sas_spy_network|E] może zostać zwiększona poprzez podjęcie określonych decyzji, z takimi efektami jak zwiększenie maksymalnej liczby szpiegów, zwiększenie skłonności dworzan do oferowania swoich usług lub umożliwienie szpiegom odkrycia [innovations|E]." #deepl:784788192
