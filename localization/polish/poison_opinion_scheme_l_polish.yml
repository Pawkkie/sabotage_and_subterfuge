l_polish:
 poison_opinion: "Poison Opinion" #deepl:489149273
 poison_opinion_action: "Poison Opinion" #deepl:489149273
 poison_opinion_desc: "Spróbuję zatruć [SCHEME.GetTargetCharacter.GetShortUINameNoTooltip] opinię o ich władcy, wywołując zamieszanie na ich dworach." #deepl:879276979
 poison_opinion_desc_general: "Poison Opinion to [personal_scheme|E], który próbuje zmniejszyć opinię celu o jego bezpośrednim [liege|E]. Schemat ten opiera się głównie na własnych [intrigue|E] i umiejętnościach [femme_fatale_court_position|E]. Ponieważ nie jest to [hostile_scheme|E], nie jest to [secret_scheme_single|E] i nie używa [agents|E].\n\n W przeciwieństwie do większości schematów, ale podobnie jak Sway [personal_scheme|E], Poison Opinion uruchamia się ponownie po zakończeniu. Utracona opinia kumuluje się, więc utrzymanie jej aktywnej sprawi, że [scheme_target|E] będzie coraz mniej lubił swojego władcę.\n\n Skuteczne cele tego schematu z negatywnymi opiniami o swoim władcy będą bardziej skłonne do przyłączenia się do frakcji utworzonych za pomocą [provoke_vassals_scheme|E] [hostile_scheme|E] ." #deepl:3487439977
 POISON_OPINION_SUCCESS_DESC: "[TARGET_CHARACTER.GetShortUINamePossessive] [opinion|E] ich [liege|E] zmniejszy się o #P [CHARACTER.MakeScope.ScriptValue('poison_opinion_opinion_decrease_per_success')|V0]#!" #deepl:3069811390
 I_AM_BLOCKED_FROM_POISONING_OPINION_OF_THIS_CHARACTER: "Nie można zatruwać opinii [TARGET_CHARACTER.GetShortUIName], gdy [TARGET_CHARACTER.GetSheHe] jest na mnie zirytowany" #deepl:2782953671
 poison_opinion_success_message: "[target.GetShortUINameNoTooltip]opinia została zatruta" #deepl:3652779230
 poison_opinion_failed_message: "[target.GetShortUINameNoTooltip]opinia nie została zatruta" #deepl:2085687335

