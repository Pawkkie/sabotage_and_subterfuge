 game_concept_sas_nation_fracturing_factions: "Фракции распада" #deepl:1435560010
 game_concept_sas_nation_fracturing_faction_desc: "Члены $game_concept_sas_nation_fracturing_faction$ стремятся уничтожить королевство своего сеньора. В случае успеха все они станут [independent|E], а их [liege|E] потеряют [primary_title|E] и другие [titles|E] того же [title_tier|E]." #deepl:881141905
