 game_concept_sas_spy: "Шпион" #deepl:287978883
 game_concept_sas_spies: "Шпионы" #deepl:396918230
 game_concept_sas_spy_desc: "Шпионы - это агенты, которые могут находиться в любом дворе и сообщать своему работодателю о найденных секретах. Их работодатель может узнать любой из этих секретов, заплатив небольшое вознаграждение.\n\n Коллективная группа агентов, работающих на одного работодателя, называется [sas_spy_network|E]." #deepl:821312495
 game_concept_sas_spy_network: "Шпионская сеть" #deepl:1689171219
 game_concept_sas_spy_network_desc: "Коллекция [sas_spies|E], работающая на одного работодателя. Эту сеть можно развить, используя взаимодействие "Завербовать шпиона" на подходящих персонажах напрямую или используя взаимодействие "Проверить на наличие шпионов" на конкретном правителе, чтобы изучить его двор на предмет возможностей.\n\n Шпионы при других дворах естественным образом вербуются [spymaster|E] с помощью задания совета "Найти секреты", а также могут быть обнаружены при вашем дворе с помощью задания совета "Нарушить схемы".\n\nЭффективность [sas_spy_network|E] можно повысить, принимая определенные решения, например, увеличить максимальное количество шпионов, повысить вероятность того, что придворные предложат свои услуги, или позволить шпионам обнаружить [innovations|E]." #deepl:784788192
