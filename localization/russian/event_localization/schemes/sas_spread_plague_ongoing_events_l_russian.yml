l_russian:
 # Disease Selection
 spread_plague_ongoing.0001.t: "Выбери свой яд" #deepl:1509455538
 spread_plague_ongoing.0001.desc: "Приняв решение попытаться начать [epidemic|E] в [target.GetUINamePossessive] королевствах, остается только выбрать способ нападения.\n\n [master_assassin_name.GetUIName] говорит мне, что у нас есть доступ к выброшенным постельным принадлежностям и одежде несчастной души, пострадавшей от локального случая оспы, что может сработать.\n\n Мы также можем пойти более прямым путем - испачкать местный водопровод или, возможно, испортить их кладовые каким-нибудь токсичным грибком [master_assassin_name.GetShortUIName], который есть у них в запасе." #deepl:3077033759
 spread_plague_ongoing.0001.a: "Используйте загрязненную подстилку" #deepl:4127637097
 spread_plague_ongoing.0001.b: "Почва для водоснабжения" #deepl:2448500050
 spread_plague_ongoing.0001.c: "Испортить их запасы" #deepl:1128175886

 spread_plague_ongoing.0001.smallpox.tt: "Попытка распространения оспы в регионе" #deepl:1300419820
 spread_plague_ongoing.0001.bloody_flux.tt: "Попытка распространить Кровавый поток в регионе" #deepl:899066176
 spread_plague_ongoing.0001.holy_fire.tt: "Попытка распространить Священный огонь в регионе" #deepl:3626240989

 # Smallpox
 spread_plague_ongoing.0002.t: "Теплые объятия смерти" #deepl:4204373679
 spread_plague_ongoing.0002.desc: "[master_assassin_name.GetUIName] нашел торговца в [target_title.GetNameNoTier], заинтересованного в приобретении базовой одежды, постельного белья и других тканей.\n\n Это прекрасная возможность быстро доставить в регион больше заразы, но работать с ней дольше, чем нужно, опасно, и есть вероятность, что источник чумы будет выведен на нас." #deepl:2992183165
 spread_plague_ongoing.0002.a: "Смешайте загрязненные предметы с грузом" #deepl:616711320
 spread_plague_ongoing.0002.b: "Это может вызвать слишком много подозрений." #deepl:1742241824

 # Bloody Flux
 spread_plague_ongoing.0003.t: "Вода, которую вы ждете" #deepl:2554096488
 spread_plague_ongoing.0003.desc: "[master_assassin_name.GetUIName] Он отследил источник воды в [target_title.GetNameNoTier] вверх по реке и нашел идеальное место для сброса загрязняющих веществ.\n\n Мы должны быть в полной безопасности от обнаружения, вопрос только в том, будет ли вода течь так, как мы хотим.\n\n В качестве альтернативы мы можем попробовать более прямой подход и сбросить их прямо у главного входа в город под покровом темноты. Хотя это гораздо рискованнее." #deepl:388755539
 spread_plague_ongoing.0003.a: "Сбросьте их вверх по течению" #deepl:4071425817
 spread_plague_ongoing.0003.b: "Бросьте их в городе" #deepl:43844615

 # Holy Fire
 spread_plague_ongoing.0004.t: "Грибок среди нас" #deepl:572678244
 spread_plague_ongoing.0004.desc: "[master_assassin_name.GetUIName] приобрел особый вид грибка, споры которого могут привести к ужасным симптомам, если их проглотить. Если мы сможем доставить его в какую-нибудь захолустную кладовую на [target_title.GetNameNoTier], распространение оттуда должно пойти само собой.\n\n Однако добраться до продовольственных магазинов не так-то просто, поэтому проще попытаться распространить грибок непосредственно на полях. Это менее рискованно, но и, вероятно, менее вероятно, что удастся." #deepl:113464637
 spread_plague_ongoing.0004.a: "Проникните в кладовую" #deepl:1335639939
 spread_plague_ongoing.0004.b: "Испортить поля" #deepl:4137778007
