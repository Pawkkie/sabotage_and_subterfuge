 smuggle_artifact_ongoing.1001.desc: "Одним из очевидных препятствий на пути к поиску артефакта является [target.GetTitledFirstNamePossessive] антиквар, [antiquarian.GetTitledFirstName].\n\n Конечно, существует множество способов... #EMP разобраться#! с человеком, но мне интересно, [antiquarian.GetFirstNameNoTooltip] ли он из тех, кого я смогу убедить посмотреть на ситуацию с другой стороны, предложив подходящую взятку." #deepl:4232957168
 smuggle_artifact_ongoing.1001.a: "Золото - универсальный язык подкупа." #deepl:947102797
