l_russian:
 # Invited to a feast
 rouse_rabble_ongoing.0001.t: "Приглашенные на праздник" #deepl:1441220718
 rouse_rabble_ongoing.0001.desc: "Старейшина, возглавляющий большую крестьянскую семью на сельской окраине [target_title.GetNameNoTier], пригласил [rouser_name.GetShortUIName] на пир в честь местного праздника. Когда [rouser_name.GetShortUIName] дал понять, что они благосклонны к предложению и напишут своему работодателю, чтобы сообщить о позднем возвращении, приглашение было передано мне.\n\n Эти крестьяне понятия не имеют, что я принимаю в этом участие, и мое присутствие может стать для них шоком... но также и сильным проявлением поддержки их дела, особенно если мы сядем за стол на равных." #deepl:2676334559
 rouse_rabble_ongoing.0001.a: "Я присоединюсь к празднику." #deepl:2695719965
 rouse_rabble_ongoing.0001.b: "Я пришлю подарок" #deepl:3810044038
 rouse_rabble_ongoing.0001.c: "Я не должен вмешиваться" #deepl:1759156705

 # The liege sends relief
 rouse_rabble_ongoing.0002.t: "Сеньор посылает помощь" #deepl:2093183175
 rouse_rabble_ongoing.0002.desc: "[rouser_name.GetShortUIName] сообщил мне, что недавно в некоторых сельских поселениях [target_title.GetNameNoTier] произошел пожар, в результате которого сгорели зернохранилище и близлежащие постройки. Это серьезно подорвало продовольственные запасы крестьян.\n\n [target.GetShortUIName] приказал направить в пострадавшие районы помощь в виде продовольствия и строительных материалов. Предложение нашей поддержки будет способствовать доброй воле и стабилизации масс... Может быть, вместо этого мы наймем наемников, чтобы перехватить и уничтожить доставку по пути?\n\n Может быть, это слишком далеко..." #deepl:1680985283
 rouse_rabble_ongoing.0002.a: "Перехватить доставку" #deepl:1927831992
 rouse_rabble_ongoing.0002.b: "Одобрить доставку" #deepl:2208938163
 rouse_rabble_ongoing.0002.c: "Просто посмотрим, что произойдет" #deepl:4098838832

 # Connecting with the youth
 rouse_rabble_ongoing.0003.t: "Связь с молодежью" #deepl:2985966255
 rouse_rabble_ongoing.0003.desc: "Похоже, что [rouser_name.GetShortUIName] попросили помочь устроить ярмарку для местной крестьянской молодежи! Времени на то, чтобы заполнить его каким-нибудь занятием, хватит на целый полдень.\n\n Сегодняшняя молодежь - это завтрашние революционеры. Может быть, это возможность посеять семена, которые принесут нам наибольшую пользу?" #deepl:2713189345
 rouse_rabble_ongoing.0003.a: "Спланируйте шуточное сражение" #deepl:146267889
 rouse_rabble_ongoing.0003.b: "Проведите охотничий турнир" #deepl:991081673
 rouse_rabble_ongoing.0003.c: "Проведите семинар по культурному обмену" #deepl:2194861974

 # Staging a protest
 rouse_rabble_ongoing.0004.t: "Устроить акцию протеста" #deepl:2463182722
 rouse_rabble_ongoing.0004.desc: "Недавно я прочитал роман, в котором герои, богатые дворяне, маскировались в одежде и поведении, чтобы слиться с крестьянством.\n\n Мне пришло в голову, что мы могли бы сделать это в [target_title.GetNameNoTier], и послать несколько членов нашего двора, чтобы устроить мирный протест, потенциально превращая его в насилие по мере его нарастания." #deepl:3630176459
 rouse_rabble_ongoing.0004.a: "Давайте раскачаем лодку" #deepl:4217286068
 rouse_rabble_ongoing.0004.b: "Возможно, это лучше оставить для фантастики." #deepl:726165040

 # A rowdy tavern
 rouse_rabble_ongoing.0005.t: "Таверна для буйных" #deepl:226345630
 rouse_rabble_ongoing.0005.desc: "Я тайно отправился в таверну в районе [target_title.GetNameNoTier], где работает [rouser_name.GetShortUIName], чтобы получить свежие новости от [rouser_name.GetHerHim]. Таверна была переполнена и бурлила, как ведьмин котел\n\n Над какофонией раздается голос солдата королевства, который слишком глубоко погружен в свои кубки и разговаривает с крестьянами. По группе прокатывается ропот недовольства, но никто не хочет к нему подойти." #deepl:960826830
 rouse_rabble_ongoing.0005.a: "Встань и выруби ему свет." #deepl:1867440387
 rouse_rabble_ongoing.0005.b: "Добавьте топлива в ропот недовольства" #deepl:954247850
 rouse_rabble_ongoing.0005.c: "Помогите солдату вернуться домой" #deepl:131614521
 rouse_rabble_ongoing.0005.d: "Потягивайте свой напиток и наблюдайте." #deepl:1953099562

 # An interesting missive
 rouse_rabble_ongoing.0006.t: "Интересное послание" #deepl:4215557738
 rouse_rabble_ongoing.0006.desc: "Я получил письмо от, невероятно, [target.GetShortUIName]. Тон льстивый и сердечный, правитель проверяет [target.GetHerHis] современников.\n\n Интересна концовка. Похоже, [target.GetSheHe] имеет дело с некоторыми волнениями крестьянства и спрашивает моего мнения о том, как лучше поступить. Понятно, что я не под подозрением, но это может дать возможность." #deepl:640877473
 rouse_rabble_ongoing.0006.a: "Раздавите их" #deepl:2237847967
 rouse_rabble_ongoing.0006.b: "Дайте им немного слабины" #deepl:693808399

 # A Costly Suggestion
 rouse_rabble_ongoing.0007.t: "Дорогостоящее предложение" #deepl:869688950
 rouse_rabble_ongoing.0007.desc: "Один из агентов недавно предложил мне, что было бы разумно попытаться подать пример крестьянского восстания. Под этим они подразумевают использование нашего королевства в качестве сияющего маяка того, к чему должны стремиться крестьяне всего мира. [rouser_name.GetShortUIName] Затем мы можем использовать нашу добрую милость в качестве конкретного доказательства того, что перемены возможны.\n\n Это не обойдется без затрат, поскольку мы, очевидно, должны сами изменить то, как мы взаимодействуем с массами. Стоит ли это делать только ради этого?" #deepl:2964475064
 rouse_rabble_ongoing.0007.a: "Снизить налоги" #deepl:96913909
 rouse_rabble_ongoing.0007.b: "Снизить сборы" #deepl:26427300
 rouse_rabble_ongoing.0007.c: "Дайте им немного свободного времени" #deepl:874460699
 rouse_rabble_ongoing.0007.d: "Боже, нет!" #deepl:162677040

 # Who's the rouser
 rouse_rabble_ongoing.0008.t: "Кто здесь буйный?!" #deepl:1707284294
 rouse_rabble_ongoing.0008.desc: "Богохульство! Малярство! Какая апокалиптически глупая идея! Откуда вообще взялось это предложение, я не могу понять, о чем они вообще думают!\n\n Наверное, [rouser_name.GetShortUIName] здесь профессионал, но неужели? ПРАВДА?! Неужели у них такая родословная, что они видят достоинства подобных идей?\n\n Я не могу этого понять, но нам все равно нужно определиться с планом действий." #deepl:564414791
 rouse_rabble_ongoing.0008.a: "Они знают, что делают" #deepl:3356801487
 rouse_rabble_ongoing.0008.b: "Я отменяю этот бред." #deepl:1872803170
 rouse_rabble_ongoing.0008.c: "Я уверен, что мы сможем найти компромисс." #deepl:730623529

 # Crossing the border
 rouse_rabble_ongoing.0009.t: "Пойман при пересечении границы" #deepl:2951116650
 rouse_rabble_ongoing.0009.desc: "Пересекая границу [target_title.GetNameNoTier], [rouser_name.GetShortUIName] столкнулся с полосой невезения в виде обычного патруля солдат, бродящих по сельской местности.\n\n Они машут рукой, чтобы [rouser_name.GetHerHim] подошел, не срочно и не недоброжелательно, но с нерешительным любопытством. Это более отдаленная часть региона, и прохожих здесь очень мало.\n\n Не так уж и необычно, что люди бродят по окрестностям, но это настолько необычно, что может произвести впечатление на солдат, если ситуация не будет решена тактично." #deepl:4133707670
 rouse_rabble_ongoing.0009.a: "Ложь о цели" #deepl:3028399027
 rouse_rabble_ongoing.0009.b: "Заведите непринужденную беседу" #deepl:2801380731
 rouse_rabble_ongoing.0009.c: "Предложите взятку" #deepl:1256381302

 # Burning too bright
 rouse_rabble_ongoing.0010.t: "Пламя горит слишком ярко" #deepl:1391488323
 rouse_rabble_ongoing.0010.desc: "Работа с крестьянством в [target_title.GetNameNoTier], похоже, идет хорошо... возможно, даже слишком хорошо.\n\n Очевидно, что их пыл рискует перекинуться на другие регионы, не в последнюю очередь на наш собственный.\n\n Мы можем использовать наших людей внутри, чтобы попытаться немного остудить ситуацию, но это будет иметь последствия." #deepl:4227841483
 rouse_rabble_ongoing.0010.a: "Поощряйте интенсивность" #deepl:3207464489
 rouse_rabble_ongoing.0010.b: "Облегчить" #deepl:1458867344
