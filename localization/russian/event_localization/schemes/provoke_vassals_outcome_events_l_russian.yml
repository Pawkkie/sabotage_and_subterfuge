 ## Success and secret
 provoke_vassals_outcome.0001.t: "Шепот из-за границы" #deepl:3047973896
 provoke_vassals_outcome.0001.desc: "Недавно при моем дворе появился гость - путешественник, пересекающий континент в поисках удачи и приключений. Я подслушал их разговор с моими придворными на повышенных тонах о мятежной фракции вассала из [target.GetCapitalLocation.GetTitle.GetNameNoTier].\n\n Похоже, никто не может понять, что так внезапно придало им сил, но восстание кажется неизбежным, и [target.GetShortUIName] пытается взять ситуацию под контроль. Наши усилия сработали идеально!" #deepl:2513943596
 provoke_vassals_outcome.0001.a: "Независимость!" #deepl:2406401908
 provoke_vassals_outcome.0001.b: "Растворение!" #deepl:3036861717

 ## Success and discovered
 provoke_vassals_outcome.0002.t: "Подозрения из-за границы" #deepl:3269684831
 provoke_vassals_outcome.0002.desc: "Недавно при моем дворе появился гость - путешественник, пересекающий континент в поисках удачи и приключений. Я подслушал их разговор с моими придворными в тиши о мятежной фракции вассала из [target.GetCapitalLocation.GetTitle.GetNameNoTier].\n\n Они украдкой бросали взгляды в мою сторону - взгляды, полные язвительного отвращения. Неизвестно, что так внезапно придало им сил, но восстание, похоже, неизбежно, и [target.GetShortUIName] в ярости." #deepl:1773624934
 provoke_vassals_outcome.0002.a: "Независимость!" #deepl:2406401908
 provoke_vassals_outcome.0002.b: "Растворение!" #deepl:3036861717

 ## Unsuccessful and secret
 provoke_vassals_outcome.0003.t: "Неразделенные сердца" #deepl:3841976415
 provoke_vassals_outcome.0003.desc: "Недавно при моем дворе побывал гость - путешественник, пересекший континент в поисках удачи и приключений. Я подслушал их разговор с моими придворными о вассалах [target.GetCapitalLocation.GetTitle.GetNameNoTier], и их удвоенном патриотизме перед лицом невзгод.\n\n Несмотря на все наши усилия, они довольны своей участью в жизни." #deepl:3943223082
 provoke_vassals_outcome.0003.a: "По крайней мере, пока..." #deepl:4023036666

 ## Unsuccessful and discovered
 provoke_vassals_outcome.0004.t: "Закаленные умы" #deepl:3138284672
 provoke_vassals_outcome.0004.desc: "Недавно при моем дворе появился гость - путешественник, пересекающий континент в поисках удачи и приключений. Я подслушал их разговор с моими придворными о вассалах [target.GetCapitalLocation.GetTitle.GetNameNoTier], и их удвоенном патриотизме перед лицом невзгод.\n\n Они бросали в мою сторону взгляды, полные язвительной неприязни. Не секрет, что я пытался подтолкнуть их к восстанию, и [target.GetShortUIName] в ярости." #deepl:2115999962
 provoke_vassals_outcome.0004.a: "В конце концов, мы их получим!" #deepl:1078680228
