l_russian:
 roused_rabble_faction_started_tt: "В ближайший год или около того этот сброд создаст крестьянскую [faction|E] и поднимет восстание. Вы получите известие до начала восстания." #deepl:895772584

 ## Success and secret
 rouse_rabble_outcome.0001.t: "Шепот из-за границы" #deepl:3047973896
 rouse_rabble_outcome.0001.desc: "Недавно при моем дворе побывал гость - путешественник, пересекший континент в поисках удачи и приключений. Я подслушал, как он говорил с моими придворными на повышенных тонах о пылающем пламени восстания, которое они видели в крестьянстве [target.GetCapitalLocation.GetTitle.GetNameNoTier].\n\n Похоже, никто не может понять, что так внезапно придало им сил, но восстание кажется неизбежным, и [target.GetShortUIName] едва ли это осознает. Наши усилия сработали идеально!" #deepl:3390693042
 rouse_rabble_outcome.0001.a: "Пусть их костры горят ярко!" #deepl:1790369756
 rouse_rabble_outcome.0001.prog: "Вы и ваш [rabble_rouser|E] продвигаетесь к [GetTrait('lifestyle_reveler').GetName( GetNullCharacter )] [trait|E]" #deepl:2576651623

 ## Success and discovered
 rouse_rabble_outcome.0002.t: "Подозрения из-за границы" #deepl:3269684831
 rouse_rabble_outcome.0002.desc: "Недавно при моем дворе появился гость - путешественник, пересекший континент в поисках удачи и приключений. Я подслушал их разговор с моими придворными на тихих тонах о пылающем пламени восстания, которое они увидели в крестьянстве [target.GetCapitalLocation.GetTitle.GetNameNoTier].\n\n Они украдкой бросали взгляды в мою сторону, в которых сквозило язвительное отвращение. Неизвестно, что так внезапно придало им сил, но восстание кажется неизбежным, и [target.GetShortUIName] в ярости." #deepl:1463922575
 rouse_rabble_outcome.0002.a: "Пусть их костры горят ярко!" #deepl:1790369756

 ## Unsuccessful and secret
 rouse_rabble_outcome.0003.t: "Неразделенные сердца" #deepl:3841976415
 rouse_rabble_outcome.0003.desc: "Недавно при моем дворе побывал гость - путешественник, пересекший континент в поисках удачи и приключений. Я подслушал их разговор с моими придворными о крестьянстве [target.GetCapitalLocation.GetTitle.GetNameNoTier], и их удвоенном патриотизме перед лицом невзгод.\n\n Несмотря на все наши усилия, крестьяне довольны своей участью в жизни." #deepl:556202482
 rouse_rabble_outcome.0003.a: "По крайней мере, пока..." #deepl:4023036666

 ## Unsuccessful and discovered
 rouse_rabble_outcome.0004.t: "Закаленные умы" #deepl:3138284672
 rouse_rabble_outcome.0004.desc: "Недавно при моем дворе побывал гость - путешественник, пересекший континент в поисках удачи и приключений. Я подслушал их разговор с моими придворными о крестьянстве [target.GetCapitalLocation.GetTitle.GetNameNoTier], и их удвоенном патриотизме перед лицом невзгод.\n\n Они постоянно бросали в мою сторону взгляды, полные язвительной неприязни. Нет никакой тайны в том, что я пытался подтолкнуть их к восстанию, и [target.GetShortUIName] в ярости." #deepl:2395136914
 rouse_rabble_outcome.0004.a: "В конце концов, мы их получим!" #deepl:1078680228

 ## Gained Reveler trait
 rouse_rabble_outcome.0005.t: "Пробуждение души" #deepl:3339457466
 rouse_rabble_outcome.0005.desc: "Кто бы мог подумать, что подбадривание и мотивация публики могут быть такими бодрящими? Есть еда, есть напитки, есть веселье... простые люди заботятся друг о друге, объединяясь против чувства угнетения.\n\n Возможно, я начинал этот план с другими мотивами, но участь народа стала моей собственной!" #deepl:4271649516
 rouse_rabble_outcome.0005.a: "Я с нетерпением жду возможности поднять за них тост при следующей нашей встрече!" #deepl:3505615210
 rouse_rabble_outcome.0005.b: "Я должен держать себя на расстоянии..." #deepl:2837144994

