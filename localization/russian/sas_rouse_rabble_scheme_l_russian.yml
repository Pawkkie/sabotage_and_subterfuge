 rouse_rabble: "Rouse Rabble" #deepl:4205226659
 rouse_rabble_desc: "Настройте крестьян королевства против его правителей" #deepl:161189800
 rouse_rabble_desc_general: "$rouse_rabble$ это [hostile_scheme|E], который пытается подтолкнуть крестьян в королевстве цели к восстанию против своего сеньора. Для его осуществления требуется нанять [rabble_rouser_court_position|E] [court_position|E] , а вы и ваша цель должны управлять королевствами как минимум [duchy|E] уровня.\n\n Если в какой-то момент [rabble_rouser_court_position|E] окажется безработным или сменит задание, план будет отменен." #deepl:2019029114
 # or otherwise unavailable, such as by traveling, being imprisoned, or leading an army
