 poison_opinion_desc: "Я попытаюсь отравить [SCHEME.GetTargetCharacter.GetShortUINameNoTooltip]'мнение об их сеньоре, вызвав беспорядок в их дворах." #deepl:879276979
 poison_opinion_desc_general: "Poison Opinion - это [personal_scheme|E], который пытается снизить мнение цели о ее непосредственном [liege|E]. Эта схема в первую очередь полагается на ваши собственные [intrigue|E] и способности вашего [femme_fatale_court_position|E]. Поскольку это не [hostile_scheme|E], она не [secret_scheme_single|E] и не использует [agents|E].\n\n В отличие от большинства схем, но как и Sway [personal_scheme|E], Poison Opinion перезапускается после завершения. Потерянное от него мнение накапливается, поэтому, если держать его активным, [scheme_target|E] будет нравиться своему сеньору все меньше и меньше.\n\n Успешные цели этой схемы с негативным мнением о своем сеньоре будут с большей вероятностью присоединяться к фракциям, созданным с помощью [provoke_vassals_scheme|E] [hostile_scheme|E] ." #deepl:3487439977
 POISON_OPINION_SUCCESS_DESC: "[TARGET_CHARACTER.GetShortUINamePossessive] [opinion|E] их [liege|E] уменьшится на #P [CHARACTER.MakeScope.ScriptValue('poison_opinion_opinion_decrease_per_success')|V0]#!" #deepl:3069811390
 I_AM_BLOCKED_FROM_POISONING_OPINION_OF_THIS_CHARACTER: "Вы не можете отравить мнение [TARGET_CHARACTER.GetShortUIName], пока [TARGET_CHARACTER.GetSheHe] раздражается на меня." #deepl:2782953671
