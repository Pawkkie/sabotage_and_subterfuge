 agot_spy_network.0210.t: "Мой [ROOT.Char.GetLadyLord]," #deepl:2169612167
 agot_spy_network.0210.desc: "Мне удалось раздобыть секрет, который [secret_holder.GetTitledFirstName] пытается защитить в суде [courtowner.GetShortUINamePossessive]. Я передам найденные мною улики, но только если моя служба будет справедливо вознаграждена." #deepl:294115213
 agot_spy_network.0210.a: "Я должен знать все!" #deepl:877721287
 agot_spy_network.0210.b: "Мне это неинтересно." #deepl:2813068183
 agot_spy_network.0210.c: "У меня нет монеты..." #deepl:175325562

 agot_spy_network.0400.t: "Шпион был завербован" #deepl:351168471
 agot_spy_network.0400.desc: "[councillor.GetTitledFirstName] нашел человека, готового шпионить для вас при дворе [target_character.GetShortUINamePossessive]." #deepl:3378650470
 agot_spy_network.0400.a: "[new_spy.GetTitledFirstName] будет служить мне верой и правдой." #deepl:1274442422

 agot_spy_network.0500.t: "Обнаружен шпион" #deepl:977083122
 agot_spy_network.0500.desc: "[councillor.GetTitledFirstName] обнаружил шпиона! [discovered_spy.GetTitledFirstName] был пойман за поиском секретов в самых темных уголках вашего двора." #deepl:725801880
 agot_spy_network.0500.a: "Кто вас послал?" #deepl:2381662331

 agot_spy_network.0510.t: "Вас обнаружили!" #deepl:3792558933
 agot_spy_network.0510.desc: "Каким-то образом они узнали! Меня раскрыли, когда я шпионил для [discovered_spy_employer.GetTitledFirstName]. Теперь моя жизнь под угрозой. Может быть, я смогу выжить, если расскажу им, кто меня нанял?" #deepl:3491980837
 agot_spy_network.0510.a: "Милосердие! Я вам все расскажу!" #deepl:1040764062
 agot_spy_network.0510.b: "Мои губы остаются запечатанными!" #deepl:4091804868

 agot_spy_network.0520.t: "Обнаружен шпион" #deepl:977083122
 agot_spy_network.0520.flipped.desc: "[discovered_spy.GetTitledFirstName] добровольно раскрыл, кто за тобой шпионит, умоляя о пощаде: это был [discovered_spy_employer.GetTitledFirstName]!" #deepl:706259308
 agot_spy_network.0520.loyal.desc: "[discovered_spy.GetTitledFirstName] отказывается раскрыть, кто за вами шпионил." #deepl:4116753664
 agot_spy_network.0520.desc: "Как вы хотите поступить с предателем?" #deepl:1989995004
 agot_spy_network.0520.a: "[discovered_spy.GetTitledFirstNameNoTooltip] должен гнить в камере." #deepl:952618794
 agot_spy_network.0520.b: "За это преступление предусмотрено только одно наказание: смерть!" #deepl:272277589
 agot_spy_network.0520.c: "Я буду милосерден. Но эти интриги должны прекратиться!" #deepl:1546398863

 agot_spy_network.0600.t: "Ваш шпион был обнаружен!" #deepl:3648032057
 agot_spy_network.0600.desc: "Тайные сообщения, которые мы получали с [discovered_spy.GetTitledFirstName], внезапно прекратились. Похоже, навыков [discovered_spy.GetHerHis] оказалось недостаточно, чтобы избежать разоблачения." #deepl:761471447
 agot_spy_network.0600.flipped.desc: "Хуже того, [discovered_spy.GetTitledFirstName] раскрыл ваше участие!" #deepl:3841062910
 agot_spy_network.0600.a: "[discovered_spy.GetSheHe|U] был недостаточно осторожен!" #deepl:3995574791

 agot_spy_network.0700.t: "Нанят шпион" #deepl:149732041
 agot_spy_network.0700.desc: "[recipient.GetTitledFirstName] пополнил ряды вашей разросшейся шпионской сети." #deepl:2555271758
 agot_spy_network.0700.a: "Влияние растет как сорняк..." #deepl:2693232088

 agot_spy_network.0800.t: "Шпиона можно нанять" #deepl:3044204003
 agot_spy_network.0800.desc: "Ваш шпионский мастер нашел нового потенциального шпиона в суде [recipient.GetTitledFirstNamePossessive]. [potential_new_spy.GetTitledFirstName] может быть убежден присоединиться к вашей шпионской сети." #deepl:1672923704
 agot_spy_network.0800.a: "Я должен связаться с [potential_new_spy.GetTitledFirstName] в ближайшее время..." #deepl:3077370088

