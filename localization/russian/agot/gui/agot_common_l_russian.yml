 DRAGON_DESIGNER_STORE_DNA_TOOLTIP: "#T Сохранить ДНК дракона#!\n Сохраните настройки ДНК, находящиеся в данный момент в кастомайзере.\n\n@warning_icon! #X Вы потеряете эти значения, если ваш персонаж умрет.#!" #deepl:924222140
 DRAGON_DESIGNER_APPLY_DNA_TOOLTIP: "#T Применить сохраненную ДНК#!\n Применить сохраненные настройки ДНК к кастомайзеру." #deepl:2671363870
 DRAGON_DESIGNER_UNDO_DNA_TOOLTIP: "#T Отменить примененную ДНК#!\n Восстановите настройки ДНК в настройщике до значений, которые они имели до применения." #deepl:326668943
 DRAGON_DESIGNER_EXPORT_VALUES: "#T Копировать содержимое события#!\n Копирует содержимое текста события в буфер обмена.\n\n Текст события будет содержать заскриптованный эффект, который вы можете поместить в файл #high import_dragon_dna.txt#!.\n\n@warning_icon! #X Пожалуйста, используйте кнопку  Regenerate event contents  (кнопка обновления слева от этой) для регенерации текста события и получения последних значений из кастомайзера.#! #T #! #X #!" #deepl:1364123390
 DRAGON_DESIGNER_IMPORT_VALUES: "#T Импорт ДНК из файла#!\n Перед использованием этой кнопки убедитесь в следующем:\n$BULLET_WITH_TAB$ Создается папка: #high %USERPROFILE%/Documents/Paradox Interactive/Crusader Kings III/run#! - создайте папку, если она не существует.\n$BULLET_WITH_TAB$Внутри папки #high run#! находится файл с именем #high import_dragon_dna.txt#!.\n$BULLET_WITH_TAB$ Внутри файла #high import_dragon_dna.txt#! находится эффект #high import_dragon_dna = {}#!.\n\n@warning_icon! #X Обратите внимание, что при этом сработают все эффекты в файле, поэтому убедитесь, что в нем есть только те, которые вы хотите запустить.#!" #deepl:3791460998

