 smuggler_court_position_desc: "Если вам нужно перевезти товар из одной точки в другую, контрабандист сможет обеспечить вам связь. Хотя это и не является обязательным, сомнительные товары - их специализация. Контрабандист позволяет планировать ограбления и похищать артефакты, а также укреплять собственные транспортные сети." #deepl:760391573
