 allow_steal_artifact_scheme_tt: "Может использовать взаимодействие [plan_heist_interaction|E] для включения [smuggle_artifact_scheme|E] против цели. Эта задача должна быть активна как для начала, так и для продолжения схемы.\n[GetScheme('smuggle_artifact').GetTypeName] [scheme|E] [success_chance|E] :\n@scheme_success_icon! #P  +0%#! - @scheme_success_icon!#P  +20%#! (на основе [aptitude|E])" #deepl:4121225388

