 # Court Position
 rabble_rouser_court_position: "Бунтарь" #deepl:63230416
 rabble_rouser_court_position_desc: "Любитель пошуметь, он умеет найти общий язык с нужными людьми и разжечь их. Они могут отправиться в другие королевства и подстрекать крестьянские бунты или восстания вассалов, а могут остаться дома и распространять добрые вести о вашем превосходстве." #deepl:3014080276
 rabble_rouser_custom_effect_description: "$BULLET$Можно получить доступ к сайтам [GetScheme('rouse_rabble').GetTypeName] и [GetScheme('provoke_vassals').GetTypeName] [hostile_scheme|E] s" #deepl:3829337143

