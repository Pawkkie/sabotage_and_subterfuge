 agot_spy_network.0200.interface.employer.t: "Un espía revela un secreto" #deepl:168050903
 agot_spy_network.0200.interface.employer.desc: "Uno de sus espías en la corte [courtowner.GetTitledFirstNamePossessive] reveló un secreto que podría ser útil." #deepl:3645310449

 agot_spy_network.0201.interface.employer.t: "El espía revela información" #deepl:1319764910
 agot_spy_network.0201.interface.employer.desc: "Uno de tus espías reveló información personal y militar sobre el dueño de su corte." #deepl:3546164191

