 agot_spy_network.0210.t: "Mi [ROOT.Char.GetLadyLord]," #deepl:2169612167
 agot_spy_network.0210.desc: "Fui capaz de obtener un secreto [secret_holder.GetTitledFirstName] está tratando de proteger en [courtowner.GetShortUINamePossessive] tribunal. Entregaré las pruebas que encontré, pero sólo si mi servicio es justamente recompensado." #deepl:294115213
 agot_spy_network.0210.a: "¡Necesito saberlo todo!" #deepl:877721287
 agot_spy_network.0210.b: "No me interesa." #deepl:2813068183
 agot_spy_network.0210.c: "No tengo la moneda..." #deepl:175325562

 agot_spy_network.0400.t: "Se reclutó a un espía" #deepl:351168471
 agot_spy_network.0400.desc: "[councillor.GetTitledFirstName] ha encontrado una persona dispuesta a espiar para usted en [target_character.GetShortUINamePossessive] corte." #deepl:3378650470
 agot_spy_network.0400.a: "[new_spy.GetTitledFirstName] me servirá bien." #deepl:1274442422

 agot_spy_network.0500.t: "Descubierto un espía" #deepl:977083122
 agot_spy_network.0500.desc: "[councillor.GetTitledFirstName] ¡ha descubierto a un espía! [discovered_spy.GetTitledFirstName] fue sorprendido buscando secretos en los rincones más oscuros de su corte." #deepl:725801880
 agot_spy_network.0500.a: "¿Quién te envía?" #deepl:2381662331

 agot_spy_network.0510.t: "¡Te han descubierto!" #deepl:3792558933
 agot_spy_network.0510.desc: "De alguna manera, ¡lo descubrieron! Me descubrieron espiando para [discovered_spy_employer.GetTitledFirstName]. Ahora mi vida está en peligro. ¿Quizás pueda sobrevivir a esto si les digo quién me contrató?" #deepl:3491980837
 agot_spy_network.0510.a: "¡Piedad! ¡Te lo contaré todo!" #deepl:1040764062
 agot_spy_network.0510.b: "¡Mis labios permanecen sellados!" #deepl:4091804868

 agot_spy_network.0520.t: "Descubierto un espía" #deepl:977083122
 agot_spy_network.0520.flipped.desc: "[discovered_spy.GetTitledFirstName] expuso voluntariamente quién le espiaba, suplicando clemencia: ¡fue [discovered_spy_employer.GetTitledFirstName]!" #deepl:706259308
 agot_spy_network.0520.loyal.desc: "[discovered_spy.GetTitledFirstName] se niega a exponer quién le estaba espiando." #deepl:4116753664
 agot_spy_network.0520.desc: "¿Cómo quieres proceder con el traidor?" #deepl:1989995004
 agot_spy_network.0520.a: "[discovered_spy.GetTitledFirstNameNoTooltip] debe pudrirse en una celda." #deepl:952618794
 agot_spy_network.0520.b: "Sólo hay un castigo para este crimen: ¡la muerte!" #deepl:272277589
 agot_spy_network.0520.c: "Seré misericordioso. ¡Pero esta intriga debe terminar!" #deepl:1546398863

 agot_spy_network.0600.t: "Su espía ha sido descubierto" #deepl:3648032057
 agot_spy_network.0600.desc: "Los informes clandestinos que recibíamos de [discovered_spy.GetTitledFirstName] han cesado de repente. Parece que las habilidades de [discovered_spy.GetHerHis] no fueron suficientes para evitar ser descubiertos." #deepl:761471447
 agot_spy_network.0600.flipped.desc: "Peor aún, ¡ [discovered_spy.GetTitledFirstName] reveló tu participación!" #deepl:3841062910
 agot_spy_network.0600.a: "[discovered_spy.GetSheHe|U] ¡no fue lo suficientemente cuidadoso!" #deepl:3995574791

 agot_spy_network.0700.t: "Se contrató a un espía" #deepl:149732041
 agot_spy_network.0700.desc: "[recipient.GetTitledFirstName] se ha unido a las filas de su extensa red de espionaje." #deepl:2555271758
 agot_spy_network.0700.a: "La influencia crece como la mala hierba..." #deepl:2693232088

 agot_spy_network.0800.t: "Se puede contratar a un espía" #deepl:3044204003
 agot_spy_network.0800.desc: "Su jefe de espionaje encontró un nuevo espía potencial en la corte [recipient.GetTitledFirstNamePossessive]. [potential_new_spy.GetTitledFirstName] podría ser convencido para unirse a su red de espionaje." #deepl:1672923704
 agot_spy_network.0800.a: "[potential_new_spy.GetTitledFirstName] sería el recluta perfecto." #deepl:2663696361
 agot_spy_network.0800.b: "Quizá debería seguir buscando en otra parte..." #deepl:1091849013

 hostile_scheme_discovery_spy.2001.intro: "Mi jefe de espías, [spymaster.GetTitledFirstName], ha descubierto los preparativos de un plan contra mí en el tribunal de [courtowner.GetTitledFirstNamePossessive]. Aunque todavía no sabemos quién," #deepl:2805483937
 potential_spy_in_court: "Un personaje de esta corte está dispuesto a espiar para ti." #deepl:3390703719

