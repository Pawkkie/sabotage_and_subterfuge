 DRAGON_DESIGNER_EXPORT_VALUES: "#T Copiar contenido del evento#!\n Copiará el contenido del texto del evento a tu portapapeles.\n\n El texto del evento contendrá un efecto con guión que está listo para que lo pongas dentro de un archivo #high import_dragon_dna.txt#!.\n\n@warning_icon! #X Por favor usa el botón  Regenerar contenido del evento  (el botón de refrescar a la izquierda de este) para regenerar el texto del evento y obtener los valores más recientes del personalizador.#! #T #! #X #!" #deepl:1364123390
 DRAGON_DESIGNER_IMPORT_VALUES: "#T Importar ADN desde un archivo#!\n Asegúrate de lo siguiente antes de usar este botón:\n$BULLET_WITH_TAB$ Se crea esta carpeta: #high %USERPROFILE%/Documents/Paradox Interactive/Crusader Kings III/run#! - crea la carpeta si no existe.\n$BULLET_WITH_TAB$Hay un archivo llamado #high import_dragon_dna.txt#! dentro de la carpeta #high run#!.\n$BULLET_WITH_TAB$ Hay un efecto #high import_dragon_dna = {}#! dentro del archivo #high import_dragon_dna.txt#!.\n\n@warning_icon! #X Por favor, ten en cuenta que esto disparará todos los efectos del archivo, asegúrate de que sólo tienes lo que quieres ejecutar dentro de él.#!" #deepl:3791460998

