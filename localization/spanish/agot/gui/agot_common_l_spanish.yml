 DRAGON_DESIGNER_STORE_DNA_TOOLTIP: "#T Almacenar ADN de Dragón#!\n Almacena los ajustes de ADN actualmente en el personalizador.\n\n@warning_icon! #X Perderás estos valores si tu personaje muere#!" #deepl:924222140
