 poison_opinion: "Opinión sobre el veneno" #deepl:489149273
 poison_opinion_action: "Opinión sobre el veneno" #deepl:489149273
 poison_opinion_desc: "Voy a tratar de envenenar [SCHEME.GetTargetCharacter.GetShortUINameNoTooltip]'s opinión de su señor, causando desorden en sus tribunales." #deepl:879276979
 poison_opinion_desc_general: "Opinión envenenada es un [personal_scheme|E] que intenta reducir la opinión del objetivo sobre su [liege|E] directo. Este esquema depende principalmente de su propio [intrigue|E] y de las habilidades de su [femme_fatale_court_position|E]. Como no es un [hostile_scheme|E], no es [secret_scheme_single|E] y no usa [agents|E].\n\n A diferencia de la mayoría de los esquemas pero como el Sway [personal_scheme|E], Poison Opinion se reinicia al completarse. La opinión que se pierde con ella se acumula, por lo que mantenerla activa hará que a los [scheme_target|E] les guste cada vez menos su señor.\n\n Los objetivos de esta estratagema que tengan una opinión negativa de su señor serán más propensos a unirse a facciones creadas a través del [provoke_vassals_scheme|E] [hostile_scheme|E] ." #deepl:3487439977
 POISON_OPINION_SUCCESS_DESC: "[TARGET_CHARACTER.GetShortUINamePossessive] [opinion|E] de su [liege|E] disminuirá en #P [CHARACTER.MakeScope.ScriptValue('poison_opinion_opinion_decrease_per_success')|V0]#!" #deepl:3069811390
 I_AM_BLOCKED_FROM_POISONING_OPINION_OF_THIS_CHARACTER: "No se puede envenenar la opinión [TARGET_CHARACTER.GetShortUIName] mientras [TARGET_CHARACTER.GetSheHe] me irrita" #deepl:2782953671
 poison_opinion_success_message: "[target.GetShortUINameNoTooltip]La opinión pública ha sido envenenada" #deepl:3652779230
 poison_opinion_failed_message: "[target.GetShortUINameNoTooltip]no ha sido envenenada" #deepl:2085687335

