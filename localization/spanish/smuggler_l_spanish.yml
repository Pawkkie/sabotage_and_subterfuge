 smuggler_task_plan_heist: "Plan Heist" #deepl:3591742283
 smuggler_task_plan_heist_desc: "Planea el robo de un artefacto específico, dejando que tú y tu equipo trabajéis para sacarlo de su corte y llevarlo a la tuya." #deepl:3024560060
 allow_steal_artifact_scheme_tt: "Puede utilizar la interacción [plan_heist_interaction|E] para activar la [smuggle_artifact_scheme|E] contra un objetivo. Esta tarea debe estar activa tanto para iniciar como para continuar el esquema.\n[GetScheme('smuggle_artifact').GetTypeName] [scheme|E] [success_chance|E] :\n@scheme_success_icon! #P  +0%#! a @scheme_success_icon!#P  +20%#! (basado en [aptitude|E])" #deepl:4121225388

