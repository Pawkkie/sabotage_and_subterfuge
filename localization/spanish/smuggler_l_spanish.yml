 # Court Position
 smuggler_court_position: "Contrabandista" #deepl:2327268886
 smuggler_court_position_desc: "Si necesita trasladar mercancías de un punto a otro, el contrabandista puede conectarle. Aunque no es estrictamente necesario, las mercancías dudosas son su especialidad. El contrabandista permite planear atracos y robar artefactos, así como reforzar tus propias redes de transporte." #deepl:760391573
 smuggler_custom_effect_description_scheme: "$BULLET$Puede permitir el acceso a la [GetScheme('smuggle_artifact').GetTypeName] [hostile_scheme|E]" #deepl:732188162
 smuggler_custom_effect_description_demand_payment: "$BULLET$Desbloquea la interacción [demand_payment|E] " #deepl:1175097164
 smuggler_custom_effect_description_raiding_spoils: "$BULLET$Aumenta [gold_i][gold|E] obtenido al saquear una explotación" #deepl:1646000165

