 game_concept_sas_spy: "Espía" #deepl:287978883
 game_concept_sas_spies: "Espías" #deepl:396918230
 game_concept_sas_spy_desc: "Los espías son agentes que pueden trabajar en cualquier tribunal y que informan a su empleador cuando encuentran secretos. Su empleador puede conocer cualquiera de estos secretos pagando una pequeña cuota.\n\n El grupo colectivo de agentes que trabajan para un empleador se denomina [sas_spy_network|E]." #deepl:821312495
 game_concept_sas_spy_network: "Red de espionaje" #deepl:1689171219
 game_concept_sas_spy_network_desc: "Una colección de [sas_spies|E] todos trabajando para el mismo patrón. Esta red puede crecer usando la interacción Reclutar Espía directamente en los personajes elegibles, o usando la interacción Buscar Espías en un gobernante en particular para investigar su corte en busca de oportunidades.\n\n Los espías en otras cortes son reclutados naturalmente por un [spymaster|E] usando la tarea del consejo Encontrar Secretos, y pueden ser descubiertos en tu corte usando la tarea del consejo Desbaratar Planes.\n\nLa eficacia de un [sas_spy_network|E] puede mejorarse tomando ciertas decisiones, con efectos como aumentar el número máximo de espías, hacer que los cortesanos estén más dispuestos a ofrecer sus servicios o permitir que los espías descubran [innovations|E]." #deepl:784788192
