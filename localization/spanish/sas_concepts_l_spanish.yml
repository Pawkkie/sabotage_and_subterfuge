 game_concept_sas_nation_fracturing_faction_desc: "Los miembros de $game_concept_sas_nation_fracturing_faction$ intentan destruir el reino de su señor. Si tienen éxito, todos se convertirán en [independent|E], y su [liege|E] perderá su [primary_title|E] y otros [titles|E] del mismo [title_tier|E]." #deepl:881141905
