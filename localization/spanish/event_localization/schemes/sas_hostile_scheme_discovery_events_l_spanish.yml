 sas_hostile_scheme_discovery.3002.t: "Esquema descubierto" #deepl:385952488
 sas_hostile_scheme_discovery.3002.desc: "Se ha descubierto la existencia de mi complot para [scheme.GetFullActionName]!\n\n Aunque aún no se conoce mi implicación, esto hará mucho más difícil que mis planes fructifiquen." #deepl:3976066101
 sas_hostile_scheme_discovery.3002.a: "¡Maldición!" #deepl:1623550253

