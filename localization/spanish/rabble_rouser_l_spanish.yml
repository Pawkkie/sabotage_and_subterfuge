 # Rouse Rabble task
 rabble_rouser_task_rouse_rabble: "Rouse Rabble" #deepl:4205226659
 rabble_rouser_task_rouse_rabble_desc: "Despierta a la chusma de otra corte, provocando disturbios campesinos y potencialmente una revuelta a gran escala." #deepl:47285353
 # or otherwise unavailable, such as by traveling, being imprisoned, or leading an army
 allow_rouse_rabble_scheme_tt: "Puede utilizar el [rouse_rabble_scheme|E]. Esta tarea debe estar activa tanto para iniciar como para continuar el esquema.\n[GetScheme('rouse_rabble').GetTypeName] [scheme|E] [success_chance|E] :\n@scheme_success_icon! #P  +0%#! a @scheme_success_icon!#P  +20%#! (basado en [aptitude|E])" #deepl:2048036236

