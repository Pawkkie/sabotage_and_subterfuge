 rabble_rouser_court_position_desc: "Deseoso de agitar la olla, el alborotador tiene un don para meterse entre la gente adecuada y encenderla. Puede viajar a otros reinos e incitar revueltas de campesinos o levantamientos de vasallos, o quedarse en casa y difundir tu excelencia." #deepl:3014080276
