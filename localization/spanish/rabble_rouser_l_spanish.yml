 allow_provoke_vassals_scheme_tt: "Puede utilizar el [provoke_vassals_scheme|E]. Esta tarea debe estar activa tanto para iniciar como para continuar el esquema.\n[GetScheme('provoke_vassals').GetTypeName] [scheme|E] [success_chance|E] :\n@scheme_success_icon! #P  +0%#! a @scheme_success_icon!#P  +20%#! (basado en [aptitude|E])" #deepl:3928875385

