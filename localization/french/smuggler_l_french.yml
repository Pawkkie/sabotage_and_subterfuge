 # Monitor Supplies
 smuggler_task_monitor_supplies: "Fournitures pour moniteurs" #deepl:2707686834
 smuggler_task_monitor_supplies_desc: "Gardez un œil sur la logistique du royaume, en veillant à ce que les opérations restent sûres et efficaces." #deepl:2420428664
 increased_smuggle_artifact_defense_tt: "Ennemi [GetScheme('smuggle_artifact').GetTypeName] [scheme|E] [success_chance|E] :\n@scheme_success_icon! #P  -0%#! à @scheme_success_icon!#P  -20%#! (basé sur [aptitude|E])" #deepl:1035613496

 # Monitor Camp Supplies
