l_french:
 poison_opinion: "Avis sur les poisons" #deepl:489149273
 poison_opinion_action: "Avis sur les poisons" #deepl:489149273
 poison_opinion_desc: "Je vais tenter d'empoisonner l'opinion de [SCHEME.GetTargetCharacter.GetShortUINameNoTooltip]'s sur leur seigneur, en semant le trouble dans leurs cours." #deepl:879276979
 poison_opinion_desc_general: "Poison Opinion est un site [personal_scheme|E] qui tente de réduire l'opinion de la cible à l'égard de son interlocuteur direct [liege|E]. Ce stratagème repose principalement sur votre propre [intrigue|E] et sur les capacités de votre [femme_fatale_court_position|E]. Comme il ne s'agit pas d'un [hostile_scheme|E], il n'est pas [secret_scheme_single|E] et n'utilise pas [agents|E].\n\n Contrairement à la plupart des stratagèmes, mais comme le Sway [personal_scheme|E], Poison Opinion redémarre dès qu'il est terminé. L'opinion perdue s'accumule, de sorte qu'en la gardant active, les [scheme_target|E] aimeront de moins en moins leur suzerain.\n\n Les cibles de ce stratagème qui ont une opinion négative de leur suzerain seront plus susceptibles de rejoindre les factions créées par le biais de [provoke_vassals_scheme|E] [hostile_scheme|E] ." #deepl:3487439977
 POISON_OPINION_SUCCESS_DESC: "[TARGET_CHARACTER.GetShortUINamePossessive] [opinion|E] de leur [liege|E] diminuera de #P [CHARACTER.MakeScope.ScriptValue('poison_opinion_opinion_decrease_per_success')|V0]#!" #deepl:3069811390
 I_AM_BLOCKED_FROM_POISONING_OPINION_OF_THIS_CHARACTER: "Vous ne pouvez pas empoisonner l'opinion [TARGET_CHARACTER.GetShortUIName] alors que [TARGET_CHARACTER.GetSheHe] est irrité contre moi." #deepl:2782953671
 poison_opinion_success_message: "[target.GetShortUINameNoTooltip]L'opinion du député a été empoisonnée" #deepl:3652779230
 poison_opinion_failed_message: "[target.GetShortUINameNoTooltip]L'opinion du président de la Commission n'a pas été empoisonnée" #deepl:2085687335

