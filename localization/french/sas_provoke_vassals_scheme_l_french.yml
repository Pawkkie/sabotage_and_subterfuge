 # Scheme modifiers
 PROVOKE_VASSALS_AMBITIOUS: "[GetTrait('ambitious').GetName( GetPlayer )]: $VALUE|=+0$" #deepl:1541796170

 # Scheme info
 provoke_vassals: "Provoquer les vassaux" #deepl:2492283152
 provoke_vassals_desc: "Retourner les vassaux d'un royaume contre leur seigneur" #deepl:2344881514
 provoke_vassals_desc_general: "$provoke_vassals$ est un [hostile_scheme|E] qui tente d'encourager les vassaux du royaume de la cible à se révolter contre leur seigneur. Pour entreprendre ce projet, il faut être employé par un [rabble_rouser_court_position|E] [court_position|E] , et vous et votre cible devez tous deux être à la tête de royaumes d'au moins [duchy|E].\n\n Si, à un moment donné, le [rabble_rouser_court_position|E] se retrouve au chômage ou change de tâche, le projet sera annulé." #deepl:596805607
 # or otherwise unavailable, such as by traveling, being imprisoned, or leading an army
 provoke_vassals_action: "Provoquer les vassaux de" #deepl:3048438145

 PROVOKE_VASSALS_SUCCESS_DESC: "Les vassaux ont été provoqués, incitant à l'insurrection" #deepl:4113621917
 PROVOKE_VASSALS_DISCOVERY_DESC: "Vous pouvez continuer à provoquer les vassaux dans le royaume [TARGET_CHARACTER.GetShortUINamePossessiveNoTooltip]." #deepl:2391768

 max_provoke_vassals_schemes_add: "Max [GetScheme('provoke_vassals').GetTypeName] [schemes|E]" #deepl:2813395320

