 game_concept_sas_nation_fracturing_faction_desc: "Les membres de $game_concept_sas_nation_fracturing_faction$ cherchent à détruire le royaume de leur seigneur. S'ils réussissent, ils deviendront tous [independent|E], et leur [liege|E] perdra son [primary_title|E] et les autres [titles|E] du même [title_tier|E]." #deepl:881141905
