 game_concept_sas_spy: "Espion" #deepl:287978883
 game_concept_sas_spies: "Espions" #deepl:396918230
 game_concept_sas_spy_desc: "Les espions sont des agents qui peuvent être basés dans n'importe quelle cour et qui font rapport à leur employeur lorsqu'ils découvrent des secrets. Leur employeur peut apprendre n'importe lequel de ces secrets en payant une petite redevance.\n\n Le groupe collectif d'agents travaillant pour un employeur s'appelle [sas_spy_network|E]." #deepl:821312495
 game_concept_sas_spy_network: "Réseau d'espionnage" #deepl:1689171219
 game_concept_sas_spy_network_desc: "Un ensemble de [sas_spies|E] travaillant tous pour le même employeur. Ce réseau peut être développé en utilisant l'interaction Recruter un espion sur les personnages éligibles directement, ou en utilisant l'interaction Vérifier les espions sur un dirigeant particulier pour enquêter sur sa cour afin de trouver des opportunités.\n\n Les espions dans d'autres cours sont naturellement recrutés par un [spymaster|E] en utilisant la tâche de conseil Trouver des secrets, et peuvent être découverts dans votre cour en utilisant la tâche de conseil Perturber les complots.\n\nL'efficacité d'un [sas_spy_network|E] peut être améliorée en prenant certaines décisions, avec des effets tels que l'augmentation du nombre maximum d'espions, rendant les courtisans plus enclins à offrir leurs services, ou permettant aux espions de découvrir [innovations|E]." #deepl:784788192
