 DRAGON_DESIGNER_STORE_DNA_TOOLTIP: "#T Store Dragon DNA#!\n Stocke les paramètres d'ADN actuellement dans le personnalisateur.\n\n@warning_icon! #X Vous perdrez ces valeurs si votre personnage meurt#!" #deepl:924222140
 DRAGON_DESIGNER_APPLY_DNA_TOOLTIP: "#T Apply Stored DNA#!\n Appliquer les paramètres d'ADN stockés au personnalisateur." #deepl:2671363870
 DRAGON_DESIGNER_UNDO_DNA_TOOLTIP: "#T Undo Applied DNA#!\n Restaurer les paramètres d'ADN dans le customizer aux valeurs qu'ils avaient avant l'application." #deepl:326668943
 DRAGON_DESIGNER_EXPORT_VALUES: "#T Copier le contenu de l'événement#!\n Copie le contenu du texte de l'événement dans votre presse-papiers.\n\n Le texte de l'événement contient un effet scénarisé prêt à être inséré dans un fichier #high import_dragon_dna.txt#!.\n\n@warning_icon! #X Veuillez utiliser le bouton  Régénérer le contenu de l'événement  (le bouton de rafraîchissement à gauche de celui-ci) pour régénérer le texte de l'événement et obtenir les valeurs les plus récentes du personnalisateur.#! #T #! #X #!" #deepl:1364123390
 DRAGON_DESIGNER_IMPORT_VALUES: "#T Importer de l'ADN à partir d'un fichier#!\n Assurez-vous des points suivants avant d'utiliser ce bouton :\n$BULLET_WITH_TAB$ Ce dossier est créé : #high %USERPROFILE%/Documents/Paradox Interactive/Crusader Kings III/run#! - créez le dossier s'il n'existe pas.\n$BULLET_WITH_TAB$Il y a un fichier nommé #high import_dragon_dna.txt#! dans le dossier #high run#!.\n$BULLET_WITH_TAB$ Il y a un effet #high import_dragon_dna = {}#! dans le fichier #high import_dragon_dna.txt#!.\n\n@warning_icon! #X Veuillez noter que cela déclenchera tous les effets du fichier, assurez-vous que vous n'avez que ce que vous voulez exécuter à l'intérieur.#!" #deepl:3791460998

