 # Expand Spy Network
 sas_expand_spy_network_decision: "Développer le réseau d'espionnage" #deepl:1918218917
 sas_expand_spy_network_decision_desc: "Les deux seules façons pour une araignée d'étendre sa toile sont de passer plus de temps à tisser ou d'impliquer plus d'araignées. Si notre site [sas_spy_network|E] a connu des débuts modestes mais fructueux, nous pourrons encore étendre notre champ d'action, mêler des dirigeants de tous horizons et tirer parti de leurs secrets les plus intimes à notre avantage." #deepl:2680910805
 sas_expand_spy_network_decision_tooltip: "Augmentez le nombre et la capacité de votre [sas_spy_network|E] " #deepl:1080571400
 sas_expand_spy_network_decision_confirm: "La toile d'araignée grandit !" #deepl:2491328231
 sas_expand_spy_network_double_spies.tt: "Vous pouvez employer le double du nombre de [sas_spies|E]" #deepl:3951820473
 sas_expand_spy_network_child_spies.tt: "Vous pouvez employer des enfants âgés d'au moins 8 ans comme [sas_spies|E]" #deepl:594091579
 sas_expand_spy_network_innovation_spies.tt: "Votre [sas_spies|E] peut voler des biens civiques ou militaires [innovations|E] auprès de leurs tribunaux de résidence si vous êtes un [culture_head|E]" #deepl:2188457974
