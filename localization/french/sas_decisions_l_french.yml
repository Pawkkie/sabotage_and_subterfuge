 sas_recruit_malefactor_decision: "Recruter un malfaiteur" #deepl:1281019616
 sas_recruit_malefactor_decision_desc: "Le bon fonctionnement d'un réseau criminel clandestin nécessite le travail de nombreuses personnes. Je vais dépêcher mes serviteurs loin à la ronde pour trouver des candidats adéquats pour nos postes vacants les plus importants." #deepl:1735662004
 sas_recruit_malefactor_decision_tooltip: "Recherche d'un personnage pour remplir une [court_position|E] pertinente pour le criminel clandestin contre rémunération\n\n #weak  Par exemple, vous pouvez engager un [GetCourtPositionType('rabble_rouser_court_position').GetName]#!" #deepl:790010884
