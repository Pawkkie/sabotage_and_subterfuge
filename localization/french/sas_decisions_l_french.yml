 sas_special_operations_training_spies_likely_to_join_schemes.tt: "Vos [sas_spies|E] sont plus susceptibles de rejoindre vos [hostile_schemes|E] en tant que [agents|E]" #deepl:2830788156
 sas_special_operations_training_rabble_rouser_likely_to_join_schemes.tt: "Votre [rabble_rouser_court_position|E] est plus susceptible de rejoindre votre [hostile_schemes|E] en tant que [agent|E]" #deepl:1181319785
