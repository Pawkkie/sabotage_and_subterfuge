 sas_expand_spy_network_have_paid_spies_tt: "Vous avez acheté au moins 3 [secrets|E] sur [sas_spies|E]" #deepl:4061259209

 # Establish Criminal Underground
 sas_establish_criminal_underground_decision: "Création d'un réseau clandestin de criminels" #deepl:1225823486
 sas_establish_criminal_underground_decision_desc: "Jouer cartes sur table est certainement une façon de gouverner, mais en matière de diplomatie internationale, il est certainement plus facile de garder un ou deux as cachés dans sa manche. Pourquoi s'accrocher aux ficelles du décorum et de la bienséance quand on peut être le marionnettiste ?" #deepl:1579221697
 sas_establish_criminal_underground_decision_tooltip: "Encourager l'emploi de crapules et de [sas_spies|E] dans votre tribunal" #deepl:3565047867
 sas_establish_criminal_underground_decision_confirm: "Dansons dans l'obscurité !" #deepl:764817339
 sas_establish_criminal_underground_spy_network.tt: "Permet d'utiliser le site [sas_spies|E] dans le cadre d'un projet de développement durable. [sas_spy_network|E]" #deepl:417099671
