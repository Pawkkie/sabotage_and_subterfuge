 # House of Sabotage and Subterfuge
 sas_house_of_sabotage_and_subterfuge_decision: "Une maison de sabotage et de subterfuges" #deepl:346655493
 sas_house_of_sabotage_and_subterfuge_decision_desc: "Votre maison s'est fermement établie comme un parangon de sabotage et de subterfuge, travaillant dans l'obscurité des ruelles et des balcons de minuit pour servir ses propres ambitions. Un long héritage de séduction et de tissage de toile s'offre à vous, si vous êtes prêt à vous lancer." #deepl:3271742632
 sas_house_of_sabotage_and_subterfuge_decision_tooltip: "Cimenter l'héritage de sabotage et de subterfuge de votre maison" #deepl:3420083984
 sas_house_of_sabotage_and_subterfuge_decision_confirm: "Nous ne faisons qu'un avec les ombres !" #deepl:1602826360
 sas_house_of_sabotage_and_subterfuge_schemes_tt: "Vous avez accompli au moins 8 [hostile_schemes|E]" #deepl:2029350009
