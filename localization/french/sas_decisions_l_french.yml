 # Special Operations Training
 sas_special_operations_training_decision: "Formation aux opérations spéciales" #deepl:3167735659
 sas_special_operations_training_decision_desc: "L'adaptation est la clé de la survie dans l'ombre. En se concentrant sur le partage des connaissances dans l'underground, nos agents peuvent développer une maîtrise de leur métier, devenant plus autonomes dans la recherche de ce que nous ne pouvons que supposer être leurs propres sources de revenus très scrupuleuses, tout en développant notre réseau d'influence." #deepl:3538227294
 sas_special_operations_training_decision_tooltip: "Former les criminels et [sas_spies|E] pour qu'ils soient plus confiants dans leur participation à des projets de développement. [hostile_schemes|E]" #deepl:3991151590
