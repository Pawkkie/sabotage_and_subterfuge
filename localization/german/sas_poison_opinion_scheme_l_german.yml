l_german:
 poison_opinion: "Meinung zum Thema Gift" #deepl:489149273
 poison_opinion_action: "Meinung zum Thema Gift" #deepl:489149273
 poison_opinion_desc: "Ich werde versuchen, die Meinung von [SCHEME.GetTargetCharacter.GetShortUINameNoTooltip] über ihren Lehnsherrn zu vergiften und Unruhe an ihren Höfen zu stiften." #deepl:879276979
 poison_opinion_desc_general: "Poison Opinion ist eine [personal_scheme|E], die versucht, die Meinung der Zielperson über ihre direkte [liege|E] zu verringern. Dieses Schema stützt sich in erster Linie auf Ihre eigene [intrigue|E] und die Fähigkeiten Ihrer [femme_fatale_court_position|E]. Da es sich nicht um ein [hostile_scheme|E] handelt, ist es nicht [secret_scheme_single|E] und verwendet nicht [agents|E].\n\n Im Gegensatz zu den meisten Schemata, aber wie das Sway [personal_scheme|E], startet Poison Opinion nach Beendigung neu. Die dadurch verlorene Meinung stapelt sich, so dass die [scheme_target|E] ihren Lehnsherrn immer weniger mögen.\n\n Erfolgreiche Ziele dieses Schemas mit negativer Meinung über ihren Lehnsherrn schließen sich eher Fraktionen an, die durch [provoke_vassals_scheme|E] [hostile_scheme|E] geschaffen wurden." #deepl:3487439977
 POISON_OPINION_SUCCESS_DESC: "[TARGET_CHARACTER.GetShortUINamePossessive] [opinion|E] ihrer [liege|E] wird sich um #P [CHARACTER.MakeScope.ScriptValue('poison_opinion_opinion_decrease_per_success')|V0]#!" #deepl:3069811390
 I_AM_BLOCKED_FROM_POISONING_OPINION_OF_THIS_CHARACTER: "Sie können die Meinung [TARGET_CHARACTER.GetShortUIName] nicht vergiften, während [TARGET_CHARACTER.GetSheHe] sich über mich ärgert." #deepl:2782953671
 poison_opinion_success_message: "[target.GetShortUINameNoTooltip]Meinung vergiftet wurde" #deepl:3652779230
 poison_opinion_failed_message: "[target.GetShortUINameNoTooltip]Meinung nicht vergiftet wurde" #deepl:2085687335

