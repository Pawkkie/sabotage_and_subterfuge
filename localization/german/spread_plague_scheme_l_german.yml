 spread_plague_desc: "Säen Sie die Saat für eine [epidemic|E] in der Hauptstadt des Ziellandes." #deepl:1153062815
 spread_plague_desc_general: "$spread_plague$ ist eine [hostile_scheme|E], die versucht, in der Hauptstadt des Ziels eine [epidemic|E] von unterschiedlicher Schwere zu starten. Dazu muss ein [master_assassin_court_position|E] [court_position|E] eingestellt werden, und die Zielperson muss für ein Reich von mindestens [county|E] verantwortlich sein.\n\n Wenn der [master_assassin_court_position|E] zu irgendeinem Zeitpunkt arbeitslos wird oder die Aufgabe wechselt, wird der Plan abgebrochen." #deepl:2819109603
 SPREAD_PLAGUE_SUCCESS_DESC: "Die Saat der Seuche ist gelegt, und eine [epidemic|E] wird wachsen." #deepl:177361638
 SPREAD_PLAGUE_DISCOVERY_DESC: "Du kannst weiterhin die Pest im Reich [TARGET_CHARACTER.GetShortUINamePossessiveNoTooltip] verbreiten." #deepl:865020768

