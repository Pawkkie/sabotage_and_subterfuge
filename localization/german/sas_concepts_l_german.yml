 game_concept_sas_spy: "Spionage" #deepl:287978883
 game_concept_sas_spies: "Spione" #deepl:396918230
 game_concept_sas_spy_desc: "Spione sind Agenten, die an jedem beliebigen Ort tätig sein können und ihrem Arbeitgeber Bericht erstatten, wenn sie Geheimnisse entdeckt haben. Ihr Arbeitgeber kann diese Geheimnisse gegen eine geringe Gebühr in Erfahrung bringen.\n\n Die kollektive Gruppe von Agenten, die für einen Arbeitgeber arbeiten, wird [sas_spy_network|E] genannt." #deepl:821312495
 game_concept_sas_spy_network: "Spionage-Netzwerk" #deepl:1689171219
 game_concept_sas_spy_network_desc: "Eine Sammlung von [sas_spies|E], die alle für denselben Arbeitgeber arbeiten. Dieses Netzwerk kann durch die Interaktion "Spion rekrutieren" bei geeigneten Charakteren oder durch die Interaktion "Nach Spionen suchen" bei einem bestimmten Herrscher erweitert werden, um dessen Hof nach Möglichkeiten zu durchsuchen.\n\n Spione an anderen Höfen werden natürlich von einem [spymaster|E] mit der Ratsaufgabe "Geheimnisse finden" rekrutiert und können an deinem Hof mit der Ratsaufgabe "Schemata stören" entdeckt werden.\n\nDie Effektivität von [sas_spy_network|E] kann durch bestimmte Entscheidungen erhöht werden, z. B. durch die Erhöhung der maximalen Anzahl von Spionen, die Erhöhung der Bereitschaft von Höflingen, ihre Dienste anzubieten, oder die Möglichkeit für Spione, [innovations|E] zu entdecken." #deepl:784788192
