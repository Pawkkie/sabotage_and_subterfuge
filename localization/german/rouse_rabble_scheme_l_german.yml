 # Scheme info
 rouse_rabble: "Lausepöbel" #deepl:4205226659
 rouse_rabble_desc: "Die Bauern eines Reiches gegen seine Herrscher aufbringen" #deepl:161189800
 rouse_rabble_desc_general: "$rouse_rabble$ ist eine [hostile_scheme|E], die versucht, die Bauern im Reich des Ziels zum Aufstand gegen ihren Lehnsherrn zu ermutigen. Es erfordert die Beschäftigung eines [rabble_rouser_court_position|E] [court_position|E] , um durchgeführt zu werden, und Sie und Ihr Ziel müssen beide über Reiche von mindestens [duchy|E] Rang verfügen.\n\n Wenn der [rabble_rouser_court_position|E] zu irgendeinem Zeitpunkt arbeitslos wird oder die Aufgabe wechselt, wird der Plan abgebrochen." #deepl:2019029114
 # or otherwise unavailable, such as by traveling, being imprisoned, or leading an army
 rouse_rabble_action: "Wecken Sie den Pöbel der" #deepl:2624184007

 ROUSE_RABBLE_SUCCESS_DESC: "Der Pöbel ist aufgewühlt und hat einen Bauernaufstand angezettelt." #deepl:1199245697
 ROUSE_RABBLE_DISCOVERY_DESC: "Sie können weiterhin den Pöbel im Bereich [TARGET_CHARACTER.GetShortUINamePossessiveNoTooltip] aufstacheln." #deepl:211674071

 max_rouse_rabble_schemes_add: "Max [GetScheme('rouse_rabble').GetTypeName] [schemes|E]" #deepl:3448259929

