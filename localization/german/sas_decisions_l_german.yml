 sas_establish_criminal_underground_decision_desc: "Alle Karten auf den Tisch zu legen ist sicherlich eine Möglichkeit zu regieren, aber wenn es um internationale Diplomatie geht, ist es sicherlich einfacher, ein oder zwei Asse im Ärmel zu haben. Warum sollte man an den Fäden von Anstand und Korrektheit baumeln, wenn man der Puppenspieler sein kann?" #deepl:1579221697
