 sas_recruit_malefactor_decision: "Malefactor rekrutieren" #deepl:1281019616
 sas_recruit_malefactor_decision_desc: "Ein gut funktionierender krimineller Untergrund erfordert die Arbeit vieler Hände. Ich werde meine Diener weit und breit aussenden, um geeignete Kandidaten für unsere wichtigsten Stellen zu finden." #deepl:1735662004
