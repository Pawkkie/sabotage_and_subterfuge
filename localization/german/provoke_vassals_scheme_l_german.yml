 provoke_vassals_desc_general: "$provoke_vassals$ ist eine [hostile_scheme|E], die versucht, die Vasallen im Reich des Ziels zu einer Revolte gegen ihren Lehnsherrn zu ermutigen. Dazu muss ein [rabble_rouser_court_position|E] [court_position|E] angestellt werden, und Sie und Ihr Ziel müssen beide über Reiche von mindestens [duchy|E] Rang verfügen.\n\n Wenn der [rabble_rouser_court_position|E] zu irgendeinem Zeitpunkt arbeitslos wird oder seine Aufgabe wechselt, wird der Plan abgebrochen." #deepl:596805607
 # or otherwise unavailable, such as by traveling, being imprisoned, or leading an army
 provoke_vassals_action: "Provoziere die Vasallen von" #deepl:3048438145

