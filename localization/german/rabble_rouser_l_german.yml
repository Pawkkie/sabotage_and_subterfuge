 # Court Position
 rabble_rouser_court_position: "Aufwiegler" #deepl:63230416
 rabble_rouser_court_position_desc: "Der Pöbler hat ein Händchen dafür, die richtigen Leute anzusprechen und sie anzustacheln. Er kann in andere Reiche reisen und Bauernrevolten oder Vasallenaufstände anzetteln, oder zu Hause bleiben und das gute Wort von deiner Exzellenz verbreiten." #deepl:3014080276
 rabble_rouser_custom_effect_description: "$BULLET$Kann den Zugriff auf [GetScheme('rouse_rabble').GetTypeName] und [GetScheme('provoke_vassals').GetTypeName] ermöglichen [hostile_scheme|E]s" #deepl:3829337143

