 # Court Position
 smuggler_court_position: "Schmuggler" #deepl:2327268886
 smuggler_court_position_desc: "Wenn Sie Waren von einem Ort zum anderen transportieren müssen, kann der Schmuggler Ihnen die Verbindung herstellen. Auch wenn dies nicht unbedingt erforderlich ist, sind zweifelhafte Waren ihre Spezialität. Der Schmuggler ermöglicht die Planung von Raubüberfällen und den Diebstahl von Artefakten und stärkt Ihre eigenen Transportnetzwerke." #deepl:760391573
 smuggler_custom_effect_description_scheme: "$BULLET$Kann den Zugriff auf die Website [GetScheme('smuggle_artifact').GetTypeName] ermöglichen. [hostile_scheme|E]" #deepl:732188162
 smuggler_custom_effect_description_demand_payment: "$BULLET$Schaltet die [demand_payment|E] Interaktion frei" #deepl:1175097164
 smuggler_custom_effect_description_raiding_spoils: "$BULLET$Erhöht [gold_i][gold|E] die Einnahmen beim Plündern eines Betriebs" #deepl:1646000165

