 # Rouse Rabble task
 smuggler_task_plan_heist: "Plan Raub" #deepl:3591742283
 smuggler_task_plan_heist_desc: "Sie planen den Raub eines bestimmten Artefakts und lassen Sie und Ihr Team daran arbeiten, es aus ihrem Gerichtssaal in Ihren zu schmuggeln." #deepl:3024560060
 allow_steal_artifact_scheme_tt: "Kann die [plan_heist_interaction|E] Interaktion nutzen, um die [smuggle_artifact_scheme|E] gegen ein Ziel zu aktivieren. Diese Aufgabe muss aktiv sein, um das Schema sowohl zu starten als auch fortzusetzen.\n[GetScheme('smuggle_artifact').GetTypeName] [scheme|E] [success_chance|E] :\n@scheme_success_icon! #P  +0%#! bis @scheme_success_icon!#P  +20%#! (basierend auf [aptitude|E])" #deepl:4121225388

