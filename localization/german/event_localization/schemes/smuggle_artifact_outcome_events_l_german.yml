l_german:
 smuggle_artifact_outcome.1001.t: "$smuggle_artifact_event_title$ Erfolgreich!" #deepl:4085025392
 smuggle_artifact_outcome.1001.desc: "Ich fühle einen großen Anflug von Stolz und kann mir ein Grinsen nicht verkneifen, als mir das Artefakt präsentiert wird, das ich für mich beanspruchen wollte. Das [artifact.GetName] hat einen neuen Besitzer!\n\n Obwohl es vielleicht ein wenig abgenutzt und schmutzig von den Mühen der Befreiung ist, kann ich es nicht lassen, mit meinen Fingern über die luxuriöse Oberfläche dieses gestohlenen Gegenstands zu streichen... das [artifact.GetName], ein schöner Preis!" #deepl:1782732239
 smuggle_artifact_outcome.1001.a: "Sie ist in ihrem neuen Zuhause willkommen!" #deepl:1504214141

 smuggle_artifact_outcome.1002.t: "$smuggle_artifact_event_title$ Gestohlenes Artefakt!" #deepl:2182870559
 smuggle_artifact_outcome.1002.desc: "Heute hatte ich Lust, mein [artifact_to_steal.GetName] zu bewundern ... aber zu meinem Entsetzen musste ich feststellen, dass es weg ist! #EMP Weg!#!\n \n Nach fieberhaften Nachforschungen meldet sich ein Diener und sagt, dass [owner.GetName] den dreisten Diebstahl inszeniert hat! In der Tat soll [owner.GetSheHe] oft davon geschwärmt haben, wie viel besser das [artifact_to_steal.GetName] im Besitz von [owner.GetHerHis] aussehen würde..." #deepl:3399866452
 smuggle_artifact_outcome.1002.a: "Verflucht sei dieser verachtenswerte Dieb!" #deepl:1123972848

 smuggle_artifact_outcome.2001.t: "$smuggle_artifact_event_title$ Versagen" #deepl:4260889525
 smuggle_artifact_outcome.2001: "Meine ausgeklügelte Infiltration verlief wie geplant, aber die [artifact.GetName] konnte nicht gefunden werden!\n\n Wurde sie bewegt? Versteckt? Entweder hat dummes Glück mein Ziel gerettet... oder meine inkompetenten Lakaien wurden geschickt ausmanövriert. In Panik vor diesem völligen Fehlschlag werden sie mir nicht weiter helfen. Mein Preis bleibt bei seinem Besitzer..." #deepl:662514981
 smuggle_artifact_outcome.2001.a: "Ich kann das nicht glauben! #EMP Inakzeptabel!#!" #deepl:3003932934

