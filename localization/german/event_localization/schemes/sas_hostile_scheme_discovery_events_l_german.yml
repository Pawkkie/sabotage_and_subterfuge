 sas_hostile_scheme_discovery.1002.t: "Schemer entdeckt!" #deepl:2806885743
 sas_hostile_scheme_discovery.1002.intro: "Meine [spymaster.GetCouncilTitle] hat mir eine schlimme Nachricht überbracht: Es ist [owner.Custom2('MyCharacterIntroduction', ROOT.Char)]" #deepl:116762934
 sas_hostile_scheme_discovery.1002.intro_no_spymaster: "Mich hat eine schlimme Nachricht erreicht: [owner.Custom2('MyCharacterIntroduction', ROOT.Char)]" #deepl:782412105
 sas_hostile_scheme_discovery.1002.rouse: "das den Bauernpöbel aus dem Reich der" #deepl:2701494178
 sas_hostile_scheme_discovery.1002.fallback: "die sich gegen" #deepl:3376091286
 sas_hostile_scheme_discovery.1002.a: "Der [owner.Custom('InsultAdjective')] Unhold!" #deepl:2541491147

 sas_hostile_scheme_discovery.2001.t: "Ein Schema bei [ROOT.Char.Custom('GetCourt')|U]" #deepl:3607653157
 sas_hostile_scheme_discovery.2001.intro: "Meine [spymaster.GetCouncilTitle] hat mir eine schlimme Nachricht überbracht. Wir wissen zwar noch nicht, wer," #deepl:4082077002
 sas_hostile_scheme_discovery.2001.intro_no_spymaster: "Mich hat eine schlimme Nachricht erreicht. Es ist zwar noch nicht bekannt, wer," #deepl:3279496608
 sas_hostile_scheme_discovery.2001.fallback: "jemand schmiedet ein Komplott gegen" #deepl:3932481048
 sas_hostile_scheme_discovery.2001.rouse: "jemand den bäuerlichen Pöbel aus dem Reich der" #deepl:1810264608
 sas_hostile_scheme_discovery.2001.target_other: "mein [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('target'))], [target.GetTitledFirstName]!" #deepl:3121120145
 sas_hostile_scheme_discovery.2001.target_spymaster: "[target.GetHerHim]!\n\n Sie wissen nicht, mit wem sie es zu tun haben, mein [ROOT.Char.GetLadyLord]. Sie denken, sie können #EMP mich#! töten? Ich werde es ihnen zeigen. Oh ja, das werde ich." #deepl:4001813834
 sas_hostile_scheme_discovery.2001.target_me: "mich!" #deepl:4031713392
 sas_hostile_scheme_discovery.2001.a: "Wir müssen den Schurken, der dahinter steckt, stoppen!" #deepl:148308102

 sas_hostile_scheme_discovery.3002.t: "Schema aufgedeckt" #deepl:385952488
 sas_hostile_scheme_discovery.3002.desc: "Die Existenz meines Komplotts [scheme.GetFullActionName] wurde aufgedeckt!\n\n Auch wenn meine Beteiligung noch nicht bekannt ist, wird es dadurch sehr viel schwieriger, meine Pläne zu verwirklichen." #deepl:3976066101
 sas_hostile_scheme_discovery.3002.a: "Verflucht!" #deepl:1623550253

 sas_hostile_scheme_discovery.3003.t: "Beteiligung aufgedeckt" #deepl:2924354761
 sas_hostile_scheme_discovery.3003.desc: "[target.Custom2('MyCharacterIntroduction', ROOT.Char)|U] hat herausgefunden, dass ich der Drahtzieher hinter dem Komplott bin." #deepl:1505803270
 sas_hostile_scheme_discovery.3003.rouse: "um den Bauernpöbel von [target.GetHerHim] aufzurütteln!" #deepl:2089024288
 sas_hostile_scheme_discovery.3003.provoke: "[target.GetHerHis] Vasallen zu provozieren!" #deepl:2832962550
 sas_hostile_scheme_discovery.3003.smuggle: "um ein Artefakt zu schmuggeln, das [target.GetHerHim] gehört!" #deepl:2229529354
 sas_hostile_scheme_discovery.3003.plague: "um die Pest im Reich [target.GetHerHis] zu verbreiten!" #deepl:44403764
 sas_hostile_scheme_discovery.3003.fallback: "gegen [target.GetHerHim]!" #deepl:1408398656
 sas_hostile_scheme_discovery.3003.a: "Das muss ein Missverständnis gewesen sein!" #deepl:2938075201
