 agot_spy_network.0200.interface.employer.t: "Spionin lüftet Geheimnis" #deepl:168050903
 agot_spy_network.0200.interface.employer.desc: "Einer eurer Spione am Hof [courtowner.GetTitledFirstNamePossessive] hat ein Geheimnis gelüftet, das sich als nützlich erweisen könnte." #deepl:3645310449

 agot_spy_network.0201.interface.employer.t: "Spionin enthüllt Informationen" #deepl:1319764910
 agot_spy_network.0201.interface.employer.desc: "Einer Ihrer Spione hat persönliche und militärische Informationen über den Besitzer des Hofes preisgegeben." #deepl:3546164191

 agot_spy_network.0200.interface.spymaster.t: "Spionin lüftet Geheimnis" #deepl:168050903
 agot_spy_network.0200.interface.spymaster.desc: "Einer eurer Spione am Hof [courtowner.GetTitledFirstNamePossessive] hat ein Geheimnis gelüftet, das sich als nützlich erweisen könnte." #deepl:3645310449

 agot_spy_network.0210.t: "Meine [ROOT.Char.GetLadyLord]," #deepl:2169612167
 agot_spy_network.0210.desc: "Ich konnte ein Geheimnis ausfindig machen, das [secret_holder.GetTitledFirstName] unter [courtowner.GetShortUINamePossessive] zu schützen versucht. Ich werde die Beweise, die ich gefunden habe, aushändigen, aber nur, wenn meine Dienste angemessen vergütet werden." #deepl:294115213
 agot_spy_network.0210.a: "Ich muss alles wissen!" #deepl:877721287
 agot_spy_network.0210.b: "Ich bin nicht interessiert." #deepl:2813068183
 agot_spy_network.0210.c: "Ich habe die Münze nicht..." #deepl:175325562

 agot_spy_network.0400.t: "Ein Spion wurde rekrutiert" #deepl:351168471
 agot_spy_network.0400.desc: "[councillor.GetTitledFirstName] hat eine Person gefunden, die bereit ist, für Sie am Hof [target_character.GetShortUINamePossessive] zu spionieren." #deepl:3378650470
 agot_spy_network.0400.a: "[new_spy.GetTitledFirstName] wird mir gute Dienste leisten." #deepl:1274442422

 agot_spy_network.0500.t: "Ein Spion wurde enttarnt" #deepl:977083122
 agot_spy_network.0500.desc: "[councillor.GetTitledFirstName] hat einen Spion entdeckt! [discovered_spy.GetTitledFirstName] wurde bei der Suche nach Geheimnissen in den dunkelsten Ecken eures Hofes erwischt." #deepl:725801880
 agot_spy_network.0500.a: "Wer hat Sie geschickt?" #deepl:2381662331

 agot_spy_network.0510.t: "Du wurdest entdeckt!" #deepl:3792558933
 agot_spy_network.0510.desc: "Irgendwie haben sie es herausgefunden! Ich wurde beim Spionieren für [discovered_spy_employer.GetTitledFirstName] entdeckt. Jetzt ist mein Leben in Gefahr. Vielleicht kann ich das überleben, wenn ich ihnen sage, wer mich angeheuert hat?" #deepl:3491980837
 agot_spy_network.0510.a: "Gnade! Ich werde dir alles erzählen!" #deepl:1040764062
 agot_spy_network.0510.b: "Meine Lippen bleiben versiegelt!" #deepl:4091804868

 agot_spy_network.0520.t: "Ein Spion wurde enttarnt" #deepl:977083122
 agot_spy_network.0520.flipped.desc: "[discovered_spy.GetTitledFirstName] Sie haben bereitwillig preisgegeben, wer Sie ausspioniert hat und um Gnade gebeten: es war [discovered_spy_employer.GetTitledFirstName]!" #deepl:706259308
 agot_spy_network.0520.loyal.desc: "[discovered_spy.GetTitledFirstName] sich weigert, zu enthüllen, wer Sie bespitzelt hat." #deepl:4116753664
 agot_spy_network.0520.desc: "Wie wollen Sie mit dem Verräter verfahren?" #deepl:1989995004
 agot_spy_network.0520.a: "[discovered_spy.GetTitledFirstNameNoTooltip] muss in einer Zelle verrotten." #deepl:952618794
 agot_spy_network.0520.b: "Für dieses Verbrechen gibt es nur eine Strafe: den Tod!" #deepl:272277589
 agot_spy_network.0520.c: "Ich werde barmherzig sein. Aber diese Intrige muss aufhören!" #deepl:1546398863

 agot_spy_network.0600.t: "Ihr Spion wurde enttarnt!" #deepl:3648032057
 agot_spy_network.0600.desc: "Die geheimen Berichte, die wir von [discovered_spy.GetTitledFirstName] erhalten haben, haben plötzlich aufgehört. Offenbar waren die Fähigkeiten von [discovered_spy.GetHerHis] nicht ausreichend, um eine Entdeckung zu vermeiden." #deepl:761471447
 agot_spy_network.0600.flipped.desc: "Schlimmer noch: [discovered_spy.GetTitledFirstName] hat Ihre Beteiligung aufgedeckt!" #deepl:3841062910
 agot_spy_network.0600.a: "[discovered_spy.GetSheHe|U] war nicht vorsichtig genug!" #deepl:3995574791

 agot_spy_network.0700.t: "Ein Spion wurde angeheuert" #deepl:149732041
 agot_spy_network.0700.desc: "[recipient.GetTitledFirstName] hat sich in die Reihen Ihres ausgedehnten Spionagenetzes eingereiht." #deepl:2555271758
 agot_spy_network.0700.a: "Einfluss wächst wie Unkraut..." #deepl:2693232088

 agot_spy_network.0800.t: "Ein Spion kann angeheuert werden" #deepl:3044204003
 agot_spy_network.0800.desc: "Ihr Spionagemeister hat einen potenziellen neuen Spion am Hof [recipient.GetTitledFirstNamePossessive] gefunden. [potential_new_spy.GetTitledFirstName] könnte überzeugt werden, Ihrem Spionagenetz beizutreten." #deepl:1672923704
 agot_spy_network.0800.a: "[potential_new_spy.GetTitledFirstName] wäre der perfekte Rekrut!" #deepl:2663696361
 agot_spy_network.0800.b: "Vielleicht sollte ich woanders weitersuchen..." #deepl:1091849013

 hostile_scheme_discovery_spy.2001.intro: "Mein Spionagemeister [spymaster.GetTitledFirstName] hat die Vorbereitungen für ein Komplott gegen mich auf [courtowner.GetTitledFirstNamePossessive] entdeckt. Wir wissen zwar noch nicht, wer," #deepl:2805483937
 potential_spy_in_court: "Eine Figur in diesem Gericht ist bereit, für Sie zu spionieren." #deepl:3390703719

