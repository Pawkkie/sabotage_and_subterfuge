 DRAGON_DESIGNER_STORE_DNA_TOOLTIP: "#T Drachen-DNA speichern#!\n Speichert die DNA-Einstellungen, die sich derzeit im Customizer befinden.\n\n@warning_icon! #X Sie verlieren diese Werte, wenn Ihr Charakter stirbt.#!" #deepl:924222140
 DRAGON_DESIGNER_APPLY_DNA_TOOLTIP: "#T Gespeicherte DNA anwenden#!\n Wenden Sie die gespeicherten DNA-Einstellungen auf den Customizer an." #deepl:2671363870
 DRAGON_DESIGNER_UNDO_DNA_TOOLTIP: "#T Angewandte DNA rückgängig machen#!\n Setzen Sie die DNA-Einstellungen im Customizer auf die Werte zurück, die sie vor der Anwendung hatten." #deepl:326668943
 DRAGON_DESIGNER_EXPORT_VALUES: "#T Inhalt des Ereignisses kopieren#!\n Kopiert den Inhalt des Ereignistextes in die Zwischenablage.\n\n Der Ereignistext enthält einen geskripteten Effekt, den Sie in eine #high import_dragon_dna.txt#! Datei einfügen können.\n\n@warning_icon! #X Bitte verwenden Sie die Schaltfläche  Ereignisinhalte neu generieren  (die Aktualisierungsschaltfläche links von dieser Schaltfläche), um den Ereignistext neu zu generieren und die neuesten Werte aus dem Customizer zu erhalten#! #T #! #X #!" #deepl:1364123390
 DRAGON_DESIGNER_IMPORT_VALUES: "#T DNA aus einer Datei importieren#!\n Vergewissern Sie sich, bevor Sie diese Schaltfläche verwenden:\n$BULLET_WITH_TAB$ Dieser Ordner wird erstellt: #high %USERPROFILE%/Documents/Paradox Interactive/Crusader Kings III/run#! - erstellen Sie den Ordner, wenn er nicht existiert.\n$BULLET_WITH_TAB$Es gibt eine Datei namens #high import_dragon_dna.txt#! im Ordner #high run#!.\n$BULLET_WITH_TAB$ Es gibt einen #high import_dragon_dna = {}#! Effekt in der #high import_dragon_dna.txt#! Datei.\n\n@warning_icon! #X Bitte beachten Sie, dass dadurch jeder Effekt in der Datei ausgelöst wird. Stellen Sie sicher, dass Sie nur die Effekte in der Datei haben, die Sie ausführen möchten.#!" #deepl:3791460998

