 artifact_black_book_desc: "#medium Dein [heir|E] erbt dein bekanntes [secrets|E], wenn es ausgerüstet ist, solange dein Haus ein Haus der Sabotage und der List ist.#!\n \n Dieses kleine Buch der Sünden und Einflüsterungen ist weniger ein Buch als ein in Leder eingewickelter Dolch, der die Macht haben könnte, einen Gefallen zu erbitten, einen Vasallen zu erpressen oder ein Reich zu stürzen. Wahrscheinlich ist es das Beste, es nicht zu verlieren." #deepl:855029849
