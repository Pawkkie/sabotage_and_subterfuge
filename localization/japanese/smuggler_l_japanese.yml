 # Court Position
 smuggler_court_position: "密輸業者" #deepl:2327268886
 smuggler_court_position_desc: "ある地点から別の地点へ商品を移動させる必要がある場合、密輸業者はそれを手配することができる。厳密には必要ではないが、怪しげな商品は彼らの得意分野である。密輸業者は、強盗計画やアーティファクトの窃盗を可能にするだけでなく、あなた自身の輸送網を強化することもできる。" #deepl:760391573
 smuggler_custom_effect_description_scheme: "$BULLET$ [GetScheme('smuggle_artifact').GetTypeName] 。[hostile_scheme|E]" #deepl:732188162
 smuggler_custom_effect_description_demand_payment: "$BULLET$ [demand_payment|E] インタラクションを解き放つ" #deepl:1175097164
 smuggler_custom_effect_description_raiding_spoils: "$BULLET$ [gold_i][gold|E] 所持品を略奪した際に得られる報酬が増加する。" #deepl:1646000165

