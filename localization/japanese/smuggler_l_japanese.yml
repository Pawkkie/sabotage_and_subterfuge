 # Rouse Rabble task
 smuggler_task_plan_heist: "強盗計画" #deepl:3591742283
 smuggler_task_plan_heist_desc: "特定のアーティファクトの強奪を計画し、そのアーティファクトを彼らの法廷から自分の法廷に密輸するために、あなたとクルーに仕事をさせる。" #deepl:3024560060
 allow_steal_artifact_scheme_tt: "[plan_heist_interaction|E] インタラクションを使用して、ターゲットに対して[smuggle_artifact_scheme|E] を有効にすることができる。\n[GetScheme('smuggle_artifact').GetTypeName] [scheme|E] [success_chance|E] :\n@scheme_success_icon! #P  +0%#! to@scheme_success_icon!#P  +20%#! ([aptitude|E] に基づく)" #deepl:4121225388

