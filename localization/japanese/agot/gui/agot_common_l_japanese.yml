 DRAGON_DESIGNER_EXPORT_VALUES: "#T Copy event contents#!\n イベントテキストの内容をクリップボードにコピーします。\n\n イベントテキストにはスクリプト効果が含まれ、#high import_dragon_dna.txt#! ファイルの中に入れることができます。\n\n@warning_icon! #X #! #T  Regenerate event contents  button (refresh button to this one)を使ってイベントテキストを再生成し、カスタマイザーから最新の値を取得してください。#! #X #!" #deepl:1364123390
 DRAGON_DESIGNER_IMPORT_VALUES: "#T ファイルから DNA をインポートする#!\n このボタンを使用する前に以下のことを確認してください：\n$BULLET_WITH_TAB$ このフォルダが作成されます：#high %USERPROFILE%/Documents/Paradox Interactive/Crusader Kings III/run#! - フォルダが存在しない場合は作成してください。\n$BULLET_WITH_TAB$ #high  #high run フォルダの中に import_dragon_dna.txt というファイルがあります。   import_dragon_dna = {} import_dragon_dna.txt ファイルの中に import_dragon_dna = {} エフェクトがあります。これはファイル内のすべてのエフェクトを発火させますので、実行したいものだけをファイル内に入れるようにしてください。#! #high #!\n$BULLET_WITH_TAB$ #high #!#!\n\n@warning_icon! #X #!" #deepl:3791460998

