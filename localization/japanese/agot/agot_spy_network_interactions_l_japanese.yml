 agot_spy_network.0210.t: "私の[ROOT.Char.GetLadyLord] 、" #deepl:2169612167
 agot_spy_network.0210.desc: "[secret_holder.GetTitledFirstName] が[courtowner.GetShortUINamePossessive] 裁判所で守ろうとしている秘密を入手することができた。私が見つけた証拠を渡しますが、私の奉仕が正当に報われる場合に限ります。" #deepl:294115213
 agot_spy_network.0210.a: "I need to know everything!"
 agot_spy_network.0210.b: "興味はない。" #deepl:2813068183
 agot_spy_network.0210.c: "コインを持ってないんだ...。" #deepl:175325562

 agot_spy_network.0400.t: "スパイがリクルートされた" #deepl:351168471
 agot_spy_network.0400.desc: "[councillor.GetTitledFirstName] [target_character.GetShortUINamePossessive] 、あなたのためにスパイをしてくれる人を見つけた。" #deepl:3378650470
 agot_spy_network.0400.a: "[new_spy.GetTitledFirstName] は私のために役立つだろう。" #deepl:1274442422

 agot_spy_network.0500.t: "スパイ発見" #deepl:977083122
 agot_spy_network.0500.desc: "[councillor.GetTitledFirstName] スパイを発見しました！[discovered_spy.GetTitledFirstName] 、あなたの宮廷の最も暗い隅で秘密を探っているところを捕まりました。" #deepl:725801880
 agot_spy_network.0500.a: "Who sent you?"

 agot_spy_network.0510.t: "あなたは発見された" #deepl:3792558933
 agot_spy_network.0510.desc: "どういうわけかバレてしまった！[discovered_spy_employer.GetTitledFirstName] のためにスパイをしていたことがバレたんだ。今、私の人生は危険にさらされている。誰に雇われたのか言えば、生き延びられるかも？" #deepl:3491980837
 agot_spy_network.0510.a: "マーシーすべて話す" #deepl:1040764062
 agot_spy_network.0510.b: "My lips remain sealed!"

 agot_spy_network.0520.t: "A Spy Was Discovered"
 agot_spy_network.0520.flipped.desc: "[discovered_spy.GetTitledFirstName] 誰があなたをスパイしていたかを自ら暴露し、慈悲を乞うた。[discovered_spy_employer.GetTitledFirstName] ！" #deepl:706259308
 agot_spy_network.0520.loyal.desc: "[discovered_spy.GetTitledFirstName] 誰があなたをスパイしていたかを暴露することを拒否する。" #deepl:4116753664
 agot_spy_network.0520.desc: "裏切り者をどうする？" #deepl:1989995004
 agot_spy_network.0520.a: "[discovered_spy.GetTitledFirstNameNoTooltip] must rot in a cell."
 agot_spy_network.0520.b: "この罪に対する罰はただ一つ、死である！" #deepl:272277589
 agot_spy_network.0520.c: "私は慈悲深い。しかし、この陰謀は止めなければならない！" #deepl:1546398863

 agot_spy_network.0600.t: "あなたのスパイが発見された" #deepl:3648032057
 agot_spy_network.0600.desc: "The clandestine reports we received from [discovered_spy.GetTitledFirstName] have suddenly stopped. It appears [discovered_spy.GetHerHis] skills were not enough to avoid discovery."
 agot_spy_network.0600.flipped.desc: "さらに悪いことに、[discovered_spy.GetTitledFirstName] 、あなたの関与が明らかになった！" #deepl:3841062910
 agot_spy_network.0600.a: "[discovered_spy.GetSheHe|U] 慎重さが足りなかった！" #deepl:3995574791

 agot_spy_network.0700.t: "スパイが雇われた" #deepl:149732041
 agot_spy_network.0700.desc: "[recipient.GetTitledFirstName] has joined the ranks of your sprawling spy network."
 agot_spy_network.0700.a: "影響力は雑草のように育つ...。" #deepl:2693232088

 agot_spy_network.0800.t: "A Spy Can Be Hired"
 agot_spy_network.0800.desc: "Your spymaster found a potential new spy at [recipient.GetTitledFirstNamePossessive] court. [potential_new_spy.GetTitledFirstName] might be convinced to join your spy network."
 agot_spy_network.0800.a: "[potential_new_spy.GetTitledFirstName] 。" #deepl:3077370088

