 # Scheme info
 rouse_rabble: "ラウス・ラブル" #deepl:4205226659
 rouse_rabble_desc: "農民を支配者に敵対させる" #deepl:161189800
 rouse_rabble_desc_general: "$rouse_rabble$ は[hostile_scheme|E] 、ターゲットの領地の農民を奮い立たせて彼らの家臣に反乱を起こさせようとするものである。[rabble_rouser_court_position|E] [court_position|E] の雇用が必要であり、あなたとターゲットは共に少なくとも[duchy|E] 階層の領地を担当していなければならない。\n\n [rabble_rouser_court_position|E] が失業したり仕事を交代したりした場合、計画は中止される。" #deepl:2019029114
 # or otherwise unavailable, such as by traveling, being imprisoned, or leading an army
 rouse_rabble_action: "を奮い立たせる" #deepl:2624184007

 ROUSE_RABBLE_SUCCESS_DESC: "農民の反乱を扇動し、民衆を奮い立たせた。" #deepl:1199245697
 ROUSE_RABBLE_DISCOVERY_DESC: "[TARGET_CHARACTER.GetShortUINamePossessiveNoTooltip] の領域で暴徒を煽り続けることができる。" #deepl:211674071

 max_rouse_rabble_schemes_add: "マックス[GetScheme('rouse_rabble').GetTypeName] [schemes|E]" #deepl:3448259929

