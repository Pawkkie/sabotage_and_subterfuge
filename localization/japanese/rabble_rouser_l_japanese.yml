 rabble_rouser_court_position_desc: "煽動に熱心なRabble Rouserは、適切な群衆の中に入って彼らを煽動するコツを心得ている。彼らは他領域に赴き、農民の反乱や家臣の反乱を扇動することもできるし、家に留まり、あなたの優秀さを広めることもできる。" #deepl:3014080276
