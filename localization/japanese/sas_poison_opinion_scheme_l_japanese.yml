 poison_opinion_desc: "私は、[SCHEME.GetTargetCharacter.GetShortUINameNoTooltip] 、彼らの家臣の意見を害し、彼らの法廷を混乱させるつもりだ。" #deepl:879276979
 poison_opinion_desc_general: "ポイズン・オピニオンとは、[personal_scheme|E] 、ターゲットの直接の[liege|E] に対する評価を下げようとするものである。このスキームは主に、あなた自身の[intrigue|E] と、あなたの[femme_fatale_court_position|E] の能力に依存する。[hostile_scheme|E] ではないので[secret_scheme_single|E] ではなく、[agents|E] も使わない。\n\n ほとんどのスキームとは異なるが、Sway[personal_scheme|E] のように、Poison Opinion は完了するとリスタートする。ポイズンオピニオンによって失われたオピニオンはスタッ クするので、このスキームを有効にしておくと、[scheme_target|E] は自分の家臣をあまり好まなくなる。\n\n このスキームの成功者は自分の家臣に否定的なオピニオンを持つので、[provoke_vassals_scheme|E] [hostile_scheme|E] によって作られた派閥に参加しやすくなる。" #deepl:3487439977
 POISON_OPINION_SUCCESS_DESC: "[TARGET_CHARACTER.GetShortUINamePossessive] [opinion|E] の[liege|E] 。#P [CHARACTER.MakeScope.ScriptValue('poison_opinion_opinion_decrease_per_success')|V0]#!" #deepl:3069811390
 I_AM_BLOCKED_FROM_POISONING_OPINION_OF_THIS_CHARACTER: "[TARGET_CHARACTER.GetShortUIName] [TARGET_CHARACTER.GetSheHe] が私に苛立っている間は、意見に毒を盛ることはできない。" #deepl:2782953671
