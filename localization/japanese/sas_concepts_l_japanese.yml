 game_concept_sas_spy_desc: "スパイとは、どの裁判所にも駐在できる諜報員のことで、秘密を発見すると雇い主に報告する。彼らの雇い主は、少額の報酬を支払うことで、これらの秘密のいずれかを知ることができる。\n\n 1人の雇い主のために働くエージェントの集団は、[sas_spy_network|E] と呼ばれる。" #deepl:821312495
 game_concept_sas_spy_network: "スパイ・ネットワーク" #deepl:1689171219
 game_concept_sas_spy_network_desc: "[sas_spies|E] 同じ雇い主のもとで働くスパイの集まり。\n\n 他の宮廷にいるスパイは、[spymaster|E] によって秘密を探す評議会タスクを使って自然にリクルートされ、あなたの宮廷では陰謀を打ち砕く評議会タスクを使って発見することができる。\n\n [sas_spy_network|E] の効力は、特定の決定を行うことで強化することができ、その効果は、スパイの最大数を増やす、廷臣が喜んでサービスを提供しやすくする、スパイが を発見できるようにする、などである。[innovations|E]" #deepl:784788192
