 sas_hostile_scheme_discovery.2001.rouse: "の領域に属する農民の群衆を奮い立たせている。" #deepl:1810264608
 sas_hostile_scheme_discovery.2001.target_other: "my[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('target'))],[target.GetTitledFirstName] ！" #deepl:3121120145
 sas_hostile_scheme_discovery.2001.target_spymaster: "[target.GetHerHim]！\n\n 彼らは相手が誰なのか分かっていない、私の[ROOT.Char.GetLadyLord] 。 彼らは私を殺せると思っている#EMP #! ?見せてやる。そうだ。" #deepl:4001813834
 sas_hostile_scheme_discovery.2001.target_me: "私だ！" #deepl:4031713392
 sas_hostile_scheme_discovery.2001.a: "この背後にいる悪党を止めなければならない！" #deepl:148308102

 sas_hostile_scheme_discovery.3002.t: "発見されたスキーム" #deepl:385952488
 sas_hostile_scheme_discovery.3002.desc: "[scheme.GetFullActionName] 、私の陰謀の存在が発覚した！\n\n 私の関与はまだ知られていないが、これで私の計画を実現するのはかなり難しくなるだろう。" #deepl:3976066101
 sas_hostile_scheme_discovery.3002.a: "呪いだ！" #deepl:1623550253

 sas_hostile_scheme_discovery.3003.t: "関与の発覚" #deepl:2924354761
