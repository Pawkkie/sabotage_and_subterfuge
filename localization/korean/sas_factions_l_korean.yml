 provoked_independence_faction_war: "독립 진영" #deepl:3839543735

 # Provoked Dissolution War
 provoked_dissolution_faction_war: "해산 진영" #deepl:3327982817

 # Faction gave up
 sas_faction_demand.1011.t: "지상에서 들어올린 적 없음" #deepl:10412173
 sas_faction_demand.1011.desc: "우리가 도발한 가신들은 [target.GetShortUIName] 그들의 야망을 추진하기에 충분한 지원을 모으지 못했고, 왕국은 불행히도 여전히 안정적입니다.\n\n 그들이 결성한 파벌의 마지막 흔적은 이제 해산했습니다." #deepl:3369401508
 sas_faction_demand.1011.a: "다른 문제로 넘어갈 시간" #deepl:396143665

 # War Ended in Victory
 sas_faction_demand.1012.t: "가신들이 승리하다" #deepl:52932465
 sas_faction_demand.1012.desc: "우리가 도발한 가신들이 전쟁에서 승리했습니다 [defender.GetShortUIName]! 혼란을 틈타서 왕국의 일부를 차지할 수 있을지도 모르죠." #deepl:1568465405
 sas_faction_demand.1012.a: "더 나은 결과를 기대하며 겁을 먹을 수도 있었어요." #deepl:3309798585

 # War Ended in White Peace
 sas_faction_demand.1013.t: "가신은 손익분기점을 넘깁니다" #deepl:1192072973
 sas_faction_demand.1013.desc: "우리가 도발한 가신들이 [defender.GetShortUIName] 에 대해 백기를 들었습니다! 이로 인해 지역이 어느 정도 불안정해졌을 수 있으며 관계가 회복되는 데 시간이 걸릴 수 있습니다." #deepl:789636467
 sas_faction_demand.1013.a: "너무 빠르지 않기를 바랍니다." #deepl:3735457413

 # War Ended in Defeat
 sas_faction_demand.1014.t: "가신이 패배했습니다" #deepl:3897891145
 sas_faction_demand.1014.desc: "우리가 도발한 가신들이 패배했습니다 [defender.GetShortUIName]. 이 결과는 안타깝지만 완전히 예상치 못한 것은 아닙니다. 이 시련에서 필요한 모든 것을 얻었기를 바랍니다." #deepl:2998637062
 sas_faction_demand.1014.a: "다른 문제로 넘어갈 시간" #deepl:396143665

 # Demand being sent
 sas_faction_demand.1015.t: "가신들이 요구를 보낼 것입니다" #deepl:97930989
 sas_faction_demand.1015.desc: "우리가 도발한 [target.GetShortUIName] 의 가신들이 지지자들을 모아 군대를 일으켰습니다. 드디어 때가 왔습니다! 왕국이 분열되거나 전쟁이 일어날 것입니다. 전자는 전쟁이 일어나면 자명하겠지만, 후자는...\n\n 이제 흥미진진하겠군요!" #deepl:776082749
 sas_faction_demand.1015.a: "드럼 연주 부탁드립니다..." #deepl:659307981

 # War Declared
 sas_faction_demand.1016.t: "그렇게 시작됩니다" #deepl:3272443967
 sas_faction_demand.1016.desc: "전쟁이 시작됩니다! 가신 반란이 본격화되고 왕국은 분쟁으로 불타고 있습니다. 어떻게 될까요?" #deepl:47654385
 sas_faction_demand.1016.a: "시간이 지나봐야 알겠지만..." #deepl:4070009588
 