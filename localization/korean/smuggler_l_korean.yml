l_korean:
 # Court Position
 smuggler_court_position: "밀수업자" #deepl:2327268886
 smuggler_court_position_desc: "한 지점에서 다른 지점으로 물품을 이동해야 하는 경우 밀수꾼을 연결해줄 수 있습니다. 반드시 필요한 것은 아니지만, 의심스러운 물품은 이들의 전문 분야입니다. 밀수업자를 통해 강도 계획과 유물 절도를 할 수 있을 뿐만 아니라 자체 운송 네트워크를 강화할 수도 있습니다." #deepl:760391573
 smuggler_custom_effect_description_scheme: "$BULLET$ [GetScheme('smuggle_artifact').GetTypeName] 에 대한 액세스를 허용할 수 있습니다. [hostile_scheme|E]" #deepl:732188162
 smuggler_custom_effect_description_demand_payment: "$BULLET$ [demand_payment|E] 상호 작용을 잠금 해제합니다." #deepl:1175097164

