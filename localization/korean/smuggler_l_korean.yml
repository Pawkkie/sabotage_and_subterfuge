 smuggler_task_plan_heist_desc: "특정 유물의 강탈을 계획하고, 당신과 당신의 승무원들이 그 유물을 법정에서 당신의 법정으로 밀반입하도록 하세요." #deepl:3024560060
 allow_steal_artifact_scheme_tt: "[plan_heist_interaction|E] 상호 작용을 사용하여 대상에 대해 [smuggle_artifact_scheme|E] 을 활성화할 수 있습니다. \n [GetScheme('smuggle_artifact').GetTypeName] [scheme|E] [success_chance|E] :\n@scheme_success_icon! #P  +0%#! ~ @scheme_success_icon!#P  +20%#! ( [aptitude|E] 기준 )" #deepl:4121225388

