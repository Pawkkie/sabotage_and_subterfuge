 agot_spy_network.0210.t: "내 [ROOT.Char.GetLadyLord]," #deepl:2169612167
 agot_spy_network.0210.desc: "[courtowner.GetShortUINamePossessive] 법정에서 [secret_holder.GetTitledFirstName] 이 보호하려고 하는 비밀을 입수할 수 있었습니다. 제가 찾은 증거를 넘기되, 제 봉사에 대한 정당한 보상을 받는 경우에만 넘기겠습니다." #deepl:294115213
 agot_spy_network.0210.a: "모든 것을 알아야 합니다!" #deepl:877721287
 agot_spy_network.0210.b: "관심이 없습니다." #deepl:2813068183
 agot_spy_network.0210.c: "동전이 없는데..." #deepl:175325562

 agot_spy_network.0400.t: "스파이가 모집되었습니다" #deepl:351168471
 agot_spy_network.0400.desc: "[councillor.GetTitledFirstName] [target_character.GetShortUINamePossessive] 법원에서 당신을 위해 스파이할 사람을 찾았습니다." #deepl:3378650470
 agot_spy_network.0400.a: "[new_spy.GetTitledFirstName] 는 저에게 도움이 될 것입니다." #deepl:1274442422

 agot_spy_network.0500.t: "스파이가 발견되었습니다" #deepl:977083122
 agot_spy_network.0500.desc: "[councillor.GetTitledFirstName] 스파이를 발견했습니다! [discovered_spy.GetTitledFirstName] 법원의 가장 어두운 구석에서 비밀을 찾던 스파이가 잡혔습니다." #deepl:725801880
 agot_spy_network.0500.a: "누가 보냈나요?" #deepl:2381662331

 agot_spy_network.0510.t: "당신은 발견되었습니다!" #deepl:3792558933
 agot_spy_network.0510.desc: "어떻게든 알아냈습니다! [discovered_spy_employer.GetTitledFirstName] 을 위해 스파이 활동을 하다 발각되었습니다. 이제 제 목숨이 위험에 처했습니다. 누가 저를 고용했는지 말하면 살아남을 수 있을까요?" #deepl:3491980837
 agot_spy_network.0510.a: "자비! 다 말해줄게요!" #deepl:1040764062
 agot_spy_network.0510.b: "내 입술은 봉인되어 있습니다!" #deepl:4091804868

 agot_spy_network.0520.t: "스파이가 발견되었습니다" #deepl:977083122
 agot_spy_network.0520.flipped.desc: "[discovered_spy.GetTitledFirstName] 누가 당신을 염탐하고 있는지 기꺼이 폭로하며 자비를 구걸했습니다: [discovered_spy_employer.GetTitledFirstName]!" #deepl:706259308
 agot_spy_network.0520.loyal.desc: "[discovered_spy.GetTitledFirstName] 누가 나를 감시했는지 밝히기를 거부합니다." #deepl:4116753664
 agot_spy_network.0520.desc: "배신자를 어떻게 처리하고 싶으신가요?" #deepl:1989995004
 agot_spy_network.0520.a: "[discovered_spy.GetTitledFirstNameNoTooltip] 는 셀에서 썩어야 합니다." #deepl:952618794
 agot_spy_network.0520.b: "이 범죄에 대한 처벌은 단 하나, 사형뿐입니다!" #deepl:272277589
 agot_spy_network.0520.c: "자비를 베풀겠습니다. 하지만 이 계략은 멈춰야 합니다!" #deepl:1546398863

 agot_spy_network.0600.t: "스파이가 발각되었습니다!" #deepl:3648032057
 agot_spy_network.0600.desc: "[discovered_spy.GetTitledFirstName] 으로부터 받은 비밀 제보가 갑자기 중단되었습니다. [discovered_spy.GetHerHis] 기술로는 발각을 피하기에 충분하지 않은 것 같습니다." #deepl:761471447
 agot_spy_network.0600.flipped.desc: "더 큰 문제는 [discovered_spy.GetTitledFirstName] 에서 귀하의 개입이 밝혀졌다는 것입니다!" #deepl:3841062910
 agot_spy_network.0600.a: "[discovered_spy.GetSheHe|U] 충분히 주의하지 않았습니다!" #deepl:3995574791

 agot_spy_network.0700.t: "스파이가 고용되었습니다" #deepl:149732041
 agot_spy_network.0700.desc: "[recipient.GetTitledFirstName] 이 거대한 스파이 네트워크의 대열에 합류했습니다." #deepl:2555271758
 agot_spy_network.0700.a: "잡초처럼 자라는 영향력..." #deepl:2693232088

 agot_spy_network.0800.t: "스파이 고용 가능" #deepl:3044204003
 agot_spy_network.0800.desc: "스파이 마스터가 잠재적인 새 스파이를 발견했습니다 [recipient.GetTitledFirstNamePossessive] 법원. [potential_new_spy.GetTitledFirstName] 스파이 네트워크에 가입하도록 설득할 수 있습니다." #deepl:1672923704
 agot_spy_network.0800.a: "[potential_new_spy.GetTitledFirstName] 완벽한 인재가 될 것입니다!" #deepl:2663696361
 agot_spy_network.0800.b: "다른 곳을 계속 찾아야 할지도 모르겠네요..." #deepl:1091849013

