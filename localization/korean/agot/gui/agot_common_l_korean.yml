 DRAGON_DESIGNER_EXPORT_VALUES: "#T 이벤트 내용 복사#!\n 이벤트 텍스트의 내용을 클립보드에 복사합니다.\n\n 이벤트 텍스트에는 #high import_dragon_dna.txt#! 파일에 넣을 수 있는 스크립트 효과가 포함됩니다.\n\n@warning_icon! #X #!  이벤트 내용 재생성  버튼(이 버튼 왼쪽에 있는 새로 고침 버튼)을 사용하여 이벤트 텍스트를 재생성하고 커스터마이저에서 가장 최근 값을 가져옵니다. #T #! #X #!" #deepl:1364123390
 DRAGON_DESIGNER_IMPORT_VALUES: "#T 파일에서 DNA 가져오기#!\n 이 버튼을 사용하기 전에 다음을 확인하세요:\n$BULLET_WITH_TAB$ 이 폴더가 생성됩니다: #high %사용자 프로필%/문서/패러독스 인터랙티브/크루세이더 킹 III/실행#! - 폴더가 없는 경우 폴더를 생성합니다.\n$BULLET_WITH_TAB$ #high run 폴더 안에 import_dragon_dna.txt 파일이 있습니다.   import_dragon_dna = {} 효과 파일 안에 import_dragon_dna = {} 효과가 있습니다. 이렇게 하면 파일에 있는 모든 이펙트가 실행되므로 그 안에 실행하려는 이펙트만 있는지 확인하세요.#! #high #!\n$BULLET_WITH_TAB$ #high #!#! #high \n\n@warning_icon! #X #!" #deepl:3791460998

