 DRAGON_DESIGNER_STORE_DNA_TOOLTIP: "#T 드래곤 DNA 저장#!\n 현재 커스터마이저에 있는 DNA 설정을 저장합니다.\n\n@warning_icon! #X 캐릭터가 사망하면 이 값을 잃게 됩니다.#!" #deepl:924222140
