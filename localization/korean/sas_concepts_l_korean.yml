 game_concept_sas_spy: "Spy" #deepl:287978883
 game_concept_sas_spies: "스파이" #deepl:396918230
 game_concept_sas_spy_desc: "스파이란 어느 법원에서든 활동할 수 있는 요원으로, 비밀을 발견하면 고용주에게 보고합니다. 고용주는 소정의 수수료를 지불하면 이러한 비밀을 알아낼 수 있습니다.\n\n 한 고용주를 위해 일하는 요원들의 집합을 [sas_spy_network|E] 이라고 합니다." #deepl:821312495
 game_concept_sas_spy_network: "스파이 네트워크" #deepl:1689171219
 game_concept_sas_spy_network_desc: "모두 같은 고용주 밑에서 일하는 [sas_spies|E] 의 집합입니다. 이 네트워크는 적격 캐릭터에게 직접 스파이 모집 상호작용을 사용하거나 특정 통치자에게 스파이 확인 상호작용을 사용해 해당 법정을 조사하여 기회를 찾아 성장시킬 수 있습니다.\n\n 다른 법정에 있는 스파이들은 비밀 찾기 협의회 과제를 사용하는 [spymaster|E] 에 의해 자연스럽게 모집되며, 내 법원에서 계획 방해 협의회 과제를 사용해 발견할 수 있습니다.\n\n [sas_spy_network|E] 의 효과는 특정 결정을 통해 향상시킬 수 있으며, 최대 스파이 수를 늘리거나, 법관이 기꺼이 서비스를 제공할 가능성을 높이거나, 스파이가 을 발견하도록 하는 등의 효과를 얻을 수 있습니다. [innovations|E]" #deepl:784788192
