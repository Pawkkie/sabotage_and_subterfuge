 poison_opinion_desc: "나는 그들의 군주에 대한 [SCHEME.GetTargetCharacter.GetShortUINameNoTooltip] 의 의견을 독살하여 그들의 법정에 혼란을 일으키려고 합니다." #deepl:879276979
 poison_opinion_desc_general: "포이즌 오피니언은 대상의 직접적인 [liege|E] 에 대한 의견을 감소시키려고 시도하는 [personal_scheme|E] 입니다. 이 계획은 주로 자신의 [intrigue|E] 과 [femme_fatale_court_position|E] 의 능력에 의존합니다. [hostile_scheme|E] 이 아니므로 [secret_scheme_single|E] 도 아니고 [agents|E] 도 사용하지 않습니다.\n\n 대부분의 계획과 달리 Sway [personal_scheme|E] 와 마찬가지로 포이즌 오피니언은 완료되면 다시 시작됩니다. 잃은 의견은 누적되므로 계속 활성화하면 [scheme_target|E] 이 군주를 좋아하지 않게 됩니다.\n\n 군주에 대해 부정적인 의견을 가진 이 계획의 성공적인 표적은 [provoke_vassals_scheme|E] [hostile_scheme|E] 을 통해 생성된 파벌에 가입할 가능성이 높아집니다." #deepl:3487439977
 POISON_OPINION_SUCCESS_DESC: "[TARGET_CHARACTER.GetShortUINamePossessive] [opinion|E] 의 [liege|E] 이 감소합니다. #P [CHARACTER.MakeScope.ScriptValue('poison_opinion_opinion_decrease_per_success')|V0]#!" #deepl:3069811390
 I_AM_BLOCKED_FROM_POISONING_OPINION_OF_THIS_CHARACTER: "의견을 독살 할 수 없습니다 [TARGET_CHARACTER.GetShortUIName] [TARGET_CHARACTER.GetSheHe] 나에게 짜증나는 동안" #deepl:2782953671
