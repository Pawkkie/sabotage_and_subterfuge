 rouse_rabble_desc_general: "$rouse_rabble$ 은 대상 영역의 농민을 선동하여 영주에게 반란을 일으키려는 [hostile_scheme|E] 입니다. 이를 수행하려면 [rabble_rouser_court_position|E] [court_position|E] 을 고용해야 하며, 여러분과 대상 모두 최소 [duchy|E] 티어 이상의 영역을 담당해야 합니다.\n\n 어느 시점에서든 [rabble_rouser_court_position|E] 이 실직하거나 업무를 전환하면 계획은 취소됩니다." #deepl:2019029114
