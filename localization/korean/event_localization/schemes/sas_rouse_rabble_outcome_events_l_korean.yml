l_korean:
 roused_rabble_faction_started_tt: "폭도들은 농민군( [faction|E] )을 설립하고 내년쯤에 반란을 일으킬 것입니다. 봉기가 시작되기 전에 소식을 듣게 될 것입니다." #deepl:895772584

 ## Success and secret
 rouse_rabble_outcome.0001.t: "해외에서 들려오는 속삭임" #deepl:3047973896
 rouse_rabble_outcome.0001.desc: "부와 모험을 찾아 대륙을 횡단하는 여행자 한 명이 최근 제 궁정을 찾아왔습니다. 나는 그들이 [target.GetCapitalLocation.GetTitle.GetNameNoTier] 의 농민들에게서 본 반란의 불길에 대해 조용한 어조로 내 궁녀들과 이야기하는 것을 엿들었습니다.\n\n 무엇이 그들을 갑자기 대담하게 만들었는지 아무도 알 수 없지만, 반란은 피할 수 없는 것 같고 [target.GetShortUIName] 는 거의 알지 못합니다. 우리의 노력은 완벽하게 성공했습니다!" #deepl:3390693042
 rouse_rabble_outcome.0001.a: "그들의 불이 활활 타오르게 하세요!" #deepl:1790369756
 rouse_rabble_outcome.0001.prog: "귀하와 귀하의 [rabble_rouser|E] 진행 상황 [GetTrait('lifestyle_reveler').GetName( GetNullCharacter )] [trait|E]" #deepl:2576651623

 ## Success and discovered
 rouse_rabble_outcome.0002.t: "해외에서 제기된 의혹" #deepl:3269684831
 rouse_rabble_outcome.0002.desc: "최근 내 궁정에 부와 모험을 찾아 대륙을 횡단하는 여행자 한 명이 찾아왔어요. 나는 그들이 [target.GetCapitalLocation.GetTitle.GetNameNoTier] 의 농민들에게서 본 반란의 불길에 대해 내 신하들과 조용한 어조로 이야기하는 것을 엿들었다.\n\n 그들은 계속해서 내 방향을 훔쳐보며 혐오의 눈빛을 보냈다. 무엇이 그들을 갑자기 대담하게 만들었는지는 알 수 없지만, 봉기는 피할 수 없는 것 같았고 [target.GetShortUIName] 는 분노했습니다." #deepl:1463922575
 rouse_rabble_outcome.0002.a: "그들의 불이 활활 타오르게 하세요!" #deepl:1790369756

 ## Unsuccessful and secret
 rouse_rabble_outcome.0003.t: "언킨들드 하트" #deepl:3841976415
 rouse_rabble_outcome.0003.desc: "최근 제 궁정에 부와 모험을 찾아 대륙을 횡단하는 여행객 한 명이 찾아왔습니다. 나는 그들이 내 궁녀들과 [target.GetCapitalLocation.GetTitle.GetNameNoTier] 의 농민들과 역경에 직면한 그들의 두 배가 된 애국심에 대해 이야기하는 것을 우연히 들었습니다.\n\n 우리의 최선의 노력에도 불구하고 농민들은 그들의 삶에 만족하고 있습니다." #deepl:556202482
 rouse_rabble_outcome.0003.a: "적어도 지금은..." #deepl:4023036666

 ## Unsuccessful and discovered
 rouse_rabble_outcome.0004.t: "굳건한 마음" #deepl:3138284672
 rouse_rabble_outcome.0004.desc: "부와 모험을 찾아 대륙을 횡단하는 여행자 한 명이 최근 제 궁정을 찾아왔습니다. 나는 그들이 내 신하들과 [target.GetCapitalLocation.GetTitle.GetNameNoTier] 의 농민들과 역경에 직면한 그들의 두 배가 된 애국심에 대해 이야기하는 것을 우연히 들었습니다.\n\n 그들은 계속 내 방향을 훔쳐보며 혐오의 시선을 보냈습니다. 내가 그들을 반란으로 몰고 가려고 했다는 것은 미스터리가 아니며, [target.GetShortUIName] 는 분노했습니다." #deepl:2395136914
 rouse_rabble_outcome.0004.a: "언젠가는 얻을 수 있을 겁니다!" #deepl:1078680228

 ## Gained Reveler trait
 rouse_rabble_outcome.0005.t: "영혼을 깨우다" #deepl:3339457466
 rouse_rabble_outcome.0005.desc: "대중을 응원하고 동기를 부여하는 것이 이렇게 활력을 불어넣을 수 있을 거라고 누가 생각했을까요? 음식이 있고, 음료가 있고, 응원이 있고... 서민들이 서로를 돌보며 억압감에 맞서 집결합니다.\n\n 다른 동기로 이 계획을 시작했을지 모르지만 민중의 곤경은 내 것이 되었습니다!" #deepl:4271649516
 rouse_rabble_outcome.0005.a: "다음에 만날 때 건배를 하고 싶습니다!" #deepl:3505615210
 rouse_rabble_outcome.0005.b: "정말 거리를 두어야 하는데..." #deepl:2837144994

