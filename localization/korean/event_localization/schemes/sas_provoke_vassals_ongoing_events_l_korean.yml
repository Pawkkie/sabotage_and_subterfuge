l_korean:
 # Feeding the Flames
 provoke_vassals_ongoing.0001.t: "불길에 먹이 주기" #deepl:504191995
 provoke_vassals_ongoing.0001.desc: "[independence_vassal.GetShortUIName] 은 최근 지역적 불만으로 어려움을 겪고 있는 것 같습니다. [target.GetShortUIName] 에서 부과하는 높은 세금 때문에 주민들이 어느 정도 혼란스러워하고 있습니다.\n\n [independence_vassal.GetShortUIName] 이 진정으로 의무를 낮추기를 원하는지는 확실하지 않지만, 상위 기관의 영향 없이 지역을 직접 통제하기를 원한다는 것은 분명합니다.\n\n 아마도 제가 그들에게 몇 가지 자료를 보낼 수 있을 것 같습니다. 아마도 가장 잘 적용될 수 있는 방법에 대한 제안을 한두 가지 포함할 수 있을 것 같습니다." #deepl:2916651416
 provoke_vassals_ongoing.0001.a: "무기를 공급하겠습니다" #deepl:3294163484
 provoke_vassals_ongoing.0001.b: "식량을 공급하겠습니다." #deepl:1722600124

 # Promising the Future
 provoke_vassals_ongoing.0002.t: "미래를 약속합니다" #deepl:2733215959
 provoke_vassals_ongoing.0002.desc: "최근에 [independence_vassal.GetShortUIName] 으로부터 편지를 받았는데, 대부분 일반적인 외교적 논의였습니다. 하지만 마지막에는 개성이 넘치는 멋진 내용이 있었습니다!\n\n [independence_vassal.GetSheHe] 성장에 대한 [independence_vassal.GetHerHis] 야망, [independence_vassal.GetHerHis] 가족에 대한 부와 명성에서 다소 정체된 느낌을 받고 있는 것이 분명합니다.\n\n 이것은 우리가 여기서 찾고 있던 종류의 반응을 미끼로 삼을 수 있는 멋진 기회라는 것도 분명합니다." #deepl:2800851299
 provoke_vassals_ongoing.0002.a: "가신제가 너무 답답해서 안타깝습니다!" #deepl:2781941790
 provoke_vassals_ongoing.0002.b: "가신은 훌륭한 디딤돌에 불과합니다!" #deepl:1226632191

 # Stage Assassination Attempt
 provoke_vassals_ongoing.0003.t: "스테이지 암살 시도" #deepl:2745329543
 provoke_vassals_ongoing.0003.desc: "[rouser_name.GetShortUIName] 과 [master_assassin_name.GetShortUIName] 은 [independence_vassal.GetShortUIName] 또는 [independence_vassal.GetHerHis] 가족을 암살하려는 계획을 세우고 [target.GetShortUIName] 과 그의 군인들을 모함하고 있습니다.\n\n 두 사람은 이 계획이 완벽하다고 저에게 확신했습니다. [master_assassin_name.GetShortUIName] [independence_vassal.GetShortUIName] 혼자서 위장 잠입을 하면 실패할 확률은 기껏해야 극히 적고, 일을 망치면 체포는커녕 혼란만 초래할 것입니다.\n\n 그런 혼란은 [independence_vassal.GetHerHis] 안전을 안심시키기 위해 [target.GetShortUIName] 의 대응을 유도할 것이고, 이는 생산적이지 못한 결과를 초래할 것입니다. 그래도 효과가 있다면..." #deepl:1236986410
 provoke_vassals_ongoing.0003.a: "당신을 믿습니다, 시작합시다." #deepl:3757966510
 provoke_vassals_ongoing.0003.b: "좋은 생각인지 잘 모르겠습니다." #deepl:3991597292

 # Stage Assassination Attempt
 provoke_vassals_ongoing.0004.t: "일종의 정상 회담" #deepl:2331725663
 provoke_vassals_ongoing.0004.desc: "[target.GetShortUIName] 전염병의 본질과 최악의 전염병으로부터 우리 자신을 격리하는 방법에 초점을 맞춘 평화로운 토론에 저와 몇몇 다른 통치자와 신하들을 초대했습니다.\n\n 이것은 매우 이례적인 일이며, 대화는 생산적이었지만 일부 사람들은 [target.GetSheHe] 통치자에게 필요한 자신감 있는 리더십을 발휘할 만큼 유능한지 의심하게 되었습니다.\n\n 대화가 끝나자 [independence_vassal.GetShortUIName] 제 의견을 묻기 위해 제 귀를 사로잡았고 [independence_vassal.GetHerHis] 표현에서 의심이 분명해 보였습니다." #deepl:1606362498
 provoke_vassals_ongoing.0004.a: "[target.GetSheHe] 이 피곤해 보이지 않나요?" #deepl:111863169
 provoke_vassals_ongoing.0004.b: "[target.GetSheHe] 절대적으로 가능합니다." #deepl:3117045451
