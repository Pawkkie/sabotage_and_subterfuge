l_korean:
 poison_opinion_outcome.1001.t: "포이즌 오피니언: 기회" #deepl:2824793747
 poison_opinion_outcome.1001.desc: "[target.GetTitledFirstNamePossessive] 의 이익과 [target.GetHerHis] 의 이익을 대립시키려는 시도에서 저는 기회를 발견했습니다. 사실 두 사람의 목표는 정반대라고 주장할 수 있을 것 같습니다. 다음 편지를 쓰면서..." #deepl:4201339416
 poison_opinion_outcome.1001.a: "...저는 이러한 양립할 수 없는 이해관계를 강조합니다." #deepl:360746116
 poison_opinion_outcome.1001.a.success: "[target.GetFirstNameNoTooltip] 확신합니다" #deepl:4019449334
 poison_opinion_outcome.1001.a.failure: "[target.GetFirstNameNoTooltip] 내 노력을 꿰뚫어보고" #deepl:1317759691
 poison_opinion_outcome.1001.b: "...미묘함을 유지하려고 노력합니다." #deepl:3520019372

 poison_opinion_outcome.1002.t: "독설 의견: 종교적 신념" #deepl:3068132753
 poison_opinion_outcome.1002.same_faith: "[target.GetTitledFirstName] 나는 [target.GetHerHis] 군주의 이익에 반대하는\n \n 올바른 논거를 가지고 [target.GetSheHe] 가 [target.GetHerHis] 자신의 이익이 아니라 [ROOT.Char.GetFaith.HighGodNameAlternate] [ROOT.Char.GetFaith.HighGodHerselfHimself] 의 이익을 위해 행동하고 있다고 [target.GetHerHim] 설득할 수 있을지도 모릅니다!" #deepl:965859863
 poison_opinion_outcome.1002.other_faith: "[target.GetTitledFirstName] [target.GetHerHis] 군주의 이익과  아마도 나는 가능한 한 규칙의 족쇄에서 벗어나는 것이 모든 의 이익에 부합한다고 주장할 수 있을 것 같습니다.\n\n [target.GetLiege.GetFaith.Name] [target.GetFaith.GetAdherentNamePlural] " #deepl:1318148979
 poison_opinion_outcome.1002.a: "저는 매우 설득력 있는 주장을 할 수 있다고 생각합니다." #deepl:878806595
 poison_opinion_outcome.1002.b: "외교적인 예의를 지켜야 할 것 같습니다." #deepl:2089916252

 poison_opinion_outcome.1003.t: "포이즌 오피니언: 행운을 밀어붙이기" #deepl:2598640233
 poison_opinion_outcome.1003.desc: "나는 [target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] 의 최신 편지를 읽고 미소를 지었다 - [target.GetSheHe] 마침내 [target.GetHerHis] 영주에게 얼음처럼 차가워진 것 같다.\n\n 나는 이 기회를 이용해 그들을 더 멀리 떨어뜨리고 싶은 유혹을 느낀다...." #deepl:1850530888
 poison_opinion_outcome.1003.a: "외교력을 시험해 볼 시간입니다!" #deepl:2787417524
 poison_opinion_outcome.1003.a.success: "[target.GetSheHe|U] 더욱 대담해졌습니다." #deepl:4130052052
 poison_opinion_outcome.1003.a.failure: "[target.GetSheHe|U] 잘못된 해석을 얻습니다." #deepl:3695719111
 poison_opinion_outcome.1003.b: "이 승리로 충분합니다." #deepl:3669306734

 poison_opinion_outcome.2001.t: "포이즌 오피니언: 오해" #deepl:2264483134
 poison_opinion_outcome.2001.opening: "[target.GetTitledFirstName] 에 대한 저의 외교적 제의가 큰 오해를 불러일으킨 것 같습니다! 나는 [target.GetSheHe] 내가 완전히 다른 목표를 추구하고 있다고 생각하는 것을 분명히하는 편지를 받았습니다 ..." #deepl:1789009900
 poison_opinion_outcome.2001.not_interested_relation: "\n\n"나는 당신의 [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('target'))], [target.GetFaith.HighGodNamePossessive] 입니다!"" #deepl:3935174444
 poison_opinion_outcome.2001.not_interested_romantically: "\n\n"영광스럽기는 하지만, 귀하의 관심은 [ROOT.Char.GetWomanMan] 방송국에는 부적절하다고 생각합니다."" #deepl:1590060400
 poison_opinion_outcome.2001.not_interested_horses: "\n\n"아무리 많은 아첨의 편지를 보내도 순종 말을 팔지 않겠습니다!"" #deepl:969794771
 poison_opinion_outcome.2001.not_interested_toll_exemptions: "\n\n"아무리 많은 거래를 약속해도 통행료 면제를 해줄 수 없습니다!"" #deepl:184694203
 poison_opinion_outcome.2001.not_interested_friend: "\n\n"당신에게 진정으로 필요한 것은 친구인 것 같은데, 제가 그런 친구가 될 수 없을 것 같아 안타깝습니다. 하지만 제가 추천해 드릴 수 있는 것은..."" #deepl:1460295060
 poison_opinion_outcome.2001.not_interested_relics: "\n\n"네가 아무리 나를 위해 기도해도 내 유물은 하나도 주지 않겠다!"" #deepl:3476711187
 poison_opinion_outcome.2001.end: "\n\n요점을 파악하기 위해 계속 읽을 필요는 없습니다." #deepl:3287867042
 poison_opinion_outcome.2001.a: "이것은 모두 큰 오해입니다!" #deepl:2703424581

 poison_opinion_outcome.2002.t: "포이즌 오피니언: 사악한 음모" #deepl:421660312
 poison_opinion_outcome.2002.desc: ""나의 [ROOT.Char.GetLadyLord]! [target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] 당신과의 모든 대화를 끝냈습니다."\n\n 나의 갑작스러운 관심과 서신의 양을 보면, 마치 [target.GetSheHe] 내가 [target.GetHerHim] 에 대해 음모를 꾸미고 있다는 인상을 받고 있는 것처럼 보입니다." #deepl:3202853704
 poison_opinion_outcome.2002.a: "어떤 의미에서는 틀린 말은 아닌 것 같아요..." #deepl:513004656
