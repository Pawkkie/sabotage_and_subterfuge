l_simp_chinese:
 # Invited to a feast
 rouse_rabble_ongoing.0001.t: "应邀参加盛宴" #deepl:1441220718
 rouse_rabble_ongoing.0001.desc: "[target_title.GetNameNoTier] 郊区一个农民大户人家的长者邀请[rouser_name.GetShortUIName] 参加庆祝当地节日的宴会。[rouser_name.GetShortUIName]\n\n 这些农民根本不知道我参与了此事，我的出现可能会让他们感到震惊......但同时也是对他们事业的有力支持，尤其是如果我们平等地坐下来共进晚餐的话。" #deepl:2676334559
 rouse_rabble_ongoing.0001.a: "我要参加庆祝活动" #deepl:2695719965
 rouse_rabble_ongoing.0001.b: "我会送一份礼物" #deepl:3810044038
 rouse_rabble_ongoing.0001.c: "我不应该参与" #deepl:1759156705

 # The liege sends relief
 rouse_rabble_ongoing.0002.t: "将军送来救援" #deepl:2093183175
 rouse_rabble_ongoing.0002.desc: "[rouser_name.GetShortUIName] 通知我，最近一场大火在[target_title.GetNameNoTier] 一些农村定居点蔓延，烧毁了一个粮仓和附近的建筑物。\n\n [target.GetShortUIName] 已下令向灾区提供食品和建筑材料。提供我们的支持将促进善意，但也会稳定群众情绪......也许我们可以雇佣一些雇佣兵在运送途中拦截并摧毁运送的物资？\n\n 也许这样做太过分了......" #deepl:1680985283
 rouse_rabble_ongoing.0002.a: "拦截快递" #deepl:1927831992
 rouse_rabble_ongoing.0002.b: "认可交付" #deepl:2208938163
 rouse_rabble_ongoing.0002.c: "看看会发生什么" #deepl:4098838832

 # Connecting with the youth
 rouse_rabble_ongoing.0003.t: "联系青年" #deepl:2985966255
 rouse_rabble_ongoing.0003.desc: "[rouser_name.GetShortUIName] 似乎被要求帮助为当地的农民青年举办一个集市！\n\n 今天的青年就是明天的革命者。我在想，这是否是一个播下对我们最有益的种子的机会？" #deepl:2713189345
 rouse_rabble_ongoing.0003.a: "策划一场模拟战斗" #deepl:146267889
 rouse_rabble_ongoing.0003.b: "举办狩猎比赛" #deepl:991081673
 rouse_rabble_ongoing.0003.c: "举办文化交流讲习班" #deepl:2194861974

 # Staging a protest
 rouse_rabble_ongoing.0004.t: "举行抗议活动" #deepl:2463182722
 rouse_rabble_ongoing.0004.desc: "\n\n 我突然想到，我们可以在[target_title.GetNameNoTier] 也这样做，派一些宫廷成员来举行和平抗议，并有可能随着抗议的扩大而演变成暴力事件。" #deepl:3630176459
 rouse_rabble_ongoing.0004.a: "让我们一起摇摆" #deepl:4217286068
 rouse_rabble_ongoing.0004.b: "也许这最好留给小说去写" #deepl:726165040

 # A rowdy tavern
 rouse_rabble_ongoing.0005.t: "喧闹的酒馆" #deepl:226345630
 rouse_rabble_ongoing.0005.desc: "我秘密来到[target_title.GetNameNoTier] [rouser_name.GetShortUIName] 工作区的一家酒馆，想从[rouser_name.GetHerHim] 获得最新消息。酒馆里人头攒动，喧闹不已，像女巫的大锅一样冒着气泡\n\n 一个声音在嘈杂声中喊道，一个王国的士兵沉浸在自己的酒杯中，对农民们说三道四。虽然没有人愿意接近他，但不满的声音在人群中荡漾。" #deepl:960826830
 rouse_rabble_ongoing.0005.a: "起来把他的灯打灭" #deepl:1867440387
 rouse_rabble_ongoing.0005.b: "为不满的杂音火上浇油" #deepl:954247850
 rouse_rabble_ongoing.0005.c: "帮助士兵回家" #deepl:131614521
 rouse_rabble_ongoing.0005.d: "边喝边观察" #deepl:1953099562

 # An interesting missive
 rouse_rabble_ongoing.0006.t: "一封有趣的信" #deepl:4215557738
 rouse_rabble_ongoing.0006.desc: "我收到了一封来自令人难以置信的[target.GetShortUIName] 的信。[target.GetHerHis]\n\n 有趣的是结尾。[target.GetSheHe] 似乎正在处理农民的一些骚乱，并询问我对最佳前进方式的意见。很明显我没有受到怀疑，但这可能是一个机会。" #deepl:640877473
 rouse_rabble_ongoing.0006.a: "粉碎它们" #deepl:2237847967
 rouse_rabble_ongoing.0006.b: "放他们一马" #deepl:693808399

 # A Costly Suggestion
 rouse_rabble_ongoing.0007.t: "代价高昂的建议" #deepl:869688950
 rouse_rabble_ongoing.0007.desc: "一位特工最近向我建议，以身作则领导农民起义也许是明智之举。他们的意思是，把我们的王国作为一座闪亮的灯塔，向全世界的农民展示他们自己应该追求的目标。[rouser_name.GetShortUIName] ，然后就可以用我们的良好风范作为具体的证据，证明变革是可能的。\n\n ，这并非没有代价，因为我们显然必须改变自己与群众互动的方式。这样做值得吗？" #deepl:2964475064
 rouse_rabble_ongoing.0007.a: "减少税收" #deepl:96913909
 rouse_rabble_ongoing.0007.b: "减少征税" #deepl:26427300
 rouse_rabble_ongoing.0007.c: "给他们一些休息时间" #deepl:874460699
 rouse_rabble_ongoing.0007.d: "天哪，没有！" #deepl:162677040

 # Who's the rouser
 rouse_rabble_ongoing.0008.t: "谁是这里的咆哮者？" #deepl:1707284294
 rouse_rabble_ongoing.0008.desc: "亵渎神明马拉其真是个天启式的馊主意！我完全不明白他们在想什么！\n\n 我想[rouser_name.GetShortUIName] 才是专业人士，但真的吗？真的吗？这样的血统真的能让他们有如此独特的视角来看待这样的想法的优点吗？\n\n 我无法理解，但我们仍然需要决定行动方案。" #deepl:564414791
 rouse_rabble_ongoing.0008.a: "他们知道自己在做什么" #deepl:3356801487
 rouse_rabble_ongoing.0008.b: "我要推翻这种无稽之谈" #deepl:1872803170
 rouse_rabble_ongoing.0008.c: "我相信我们能找到一个折中方案" #deepl:730623529

 # Crossing the border
 rouse_rabble_ongoing.0009.t: "越境被抓" #deepl:2951116650
 rouse_rabble_ongoing.0009.desc: "在越过边境进入[target_title.GetNameNoTier] 时，[rouser_name.GetShortUIName] 遇到了一连串的倒霉事--一队例行巡逻的士兵在乡间游荡。\n\n 他们挥手示意[rouser_name.GetHerHim] 走过去，并不着急或不怀好意，而是带着一种犹豫不决的好奇。\n\n 在这里游荡的人并非闻所未闻，但如果处理不当，可能会给士兵们留下不好的印象。" #deepl:4133707670
 rouse_rabble_ongoing.0009.a: "谎报目的" #deepl:3028399027
 rouse_rabble_ongoing.0009.b: "随意交谈" #deepl:2801380731
 rouse_rabble_ongoing.0009.c: "行贿" #deepl:1256381302

 # Burning too bright
 rouse_rabble_ongoing.0010.t: "火焰燃烧得太亮" #deepl:1391488323
 rouse_rabble_ongoing.0010.desc: "[target_title.GetNameNoTier] 的农民工作似乎进展顺利......也许有点太顺利了。\n\n 很明显，他们的狂热有可能蔓延到其他地区，其中也包括我们自己的地区。\n\n 我们可以利用我们在内部的人试图让局势稍稍降温，但这样做会有后果。" #deepl:4227841483
 rouse_rabble_ongoing.0010.a: "鼓励强度" #deepl:3207464489
 rouse_rabble_ongoing.0010.b: "放松" #deepl:1458867344
